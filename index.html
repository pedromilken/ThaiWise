"],["คุณ","kun","khun"],["ที่","tîi","thi"],["โฮเต็ล","hoo-dten","hoten"]],"fsi":"phǒm cà paj ráp khun thîi hooten","en":"I'll pick you up at the hotel.","pt":"Eu te pego no hotel."},{"sp":"S","s":[["ราว","raao","rao"],["สัก","sàk","sak"],["หก","hòk","hok"],["โมง","moong","mong"],["ครึ่ง","krʉ̂ng","khrueng"],["นะ","ná","na"],["ฮะ","há","ha"]],"fsi":"raaw sàk hòk mooŋ khrʉ̂ŋ ná há","en":"Around 6:30, OK?","pt":"Lá pelas seis e meia, pode ser?"},{"sp":"D","s":[["ตกลง","dtòk-long","toklong"],["ฮะ","há","ha"]],"fsi":"tòkloŋ há","en":"Right.","pt":"Combinado."},{"sp":"D","s":[["ผม","pǒm","phom"],["จะ","jà","cha"],["คอย","kɔɔi","khoi"],["อยู่","yùu","yu"],["หน้า","nâa","na"],["โฮเต็ล","hoo-dten","hoten"]],"fsi":"phǒm cà khɔɔj jùu nâa hooten","en":"I'll wait for you in front of the hotel.","pt":"Te espero na frente do hotel."}],"notas":[{"t":{"pt":"Três jeitos de dizer 'atrás'","en":"Three ways to say 'ago'"},"e":{"pt":"Período + ก่อน, ที่แล้ว ou มาแล้ว, com เมื่อ opcional na frente: (เมื่อ)สามอาทิตย์ก่อน, สามอาทิตย์ที่แล้ว e สามอาทิตย์มาแล้ว significam 'três semanas atrás'. Analogia: são como 'há três semanas', 'três semanas atrás' e 'faz três semanas' — mesma ideia, três montagens.","en":"Period + ก่อน / ที่แล้ว / มาแล้ว, optionally preceded by เมื่อ, all mean 'ago'."},"ex":[["เมื่อ","mʉ̂ʉa","muea"],["สอง","sɔ̌ɔng","song"],["เดือน","dʉʉan","duean"],["ก่อน","gɔ̀ɔn","kon"]]},{"t":{"pt":"ตั้งแต่: desde","en":"ตั้งแต่: since"},"e":{"pt":"ตั้งแต่ marca o ponto de partida no tempo: ตั้งแต่สองเดือนก่อน (desde dois meses atrás), ตั้งแต่เดือนพฤศจิกายน (desde novembro).","en":"ตั้งแต่ marks a starting point in time."},"ex":[["ตั้งแต่","dtâng-dtɛ̀ɛ","tangtae"],["เดือน","dʉʉan","duean"],["มกราคม","mók-gà-raa-kom","mokkarakhom"]]},{"t":{"pt":"Os meses e os dois calendários","en":"Months and the two calendars"},"e":{"pt":"Os meses de 31 dias terminam em -คม, os de 30 em -ยน e fevereiro em -พันธ์ — a terminação já diz o tamanho do mês. Na fala, corta-se a terminação: เมษา, กุมภา. A Tailândia usa o ano budista (พ.ศ.), 543 anos à frente do cristão (ค.ศ.): 2026 ค.ศ. = 2569 พ.ศ.","en":"Months of 31 days end in -คม, of 30 in -ยน, February in -พันธ์; the Buddhist Era (พ.ศ.) is 543 years ahead of the Christian Era."},"ex":[["วันนี้","wan-níi","wanni"],["วันที่","wan-tîi","wanthi"],["เท่าไร","tâo-rài","thaorai"]]},{"t":{"pt":"อยาก × อยากให้","en":"อยาก vs อยากให้"},"e":{"pt":"อยาก + verbo = eu mesmo quero fazer (ผมอยากพบคุณ). Quando quem age é outra pessoa, entra ให้: ผมอยากให้เขาพบคุณ = quero que ele te conheça. Analogia: ให้ é o 'que' do 'quero que…' do português.","en":"อยาก + verb when the subject is the same; อยากให้ + new subject + verb when it is someone else."},"ex":[["ผม","pǒm","phom"],["อยาก","yàak","yak"],["ให้","hâi","hai"],["คุณ","kun","khun"],["มา","maa","ma"]]},{"t":{"pt":"No telefone","en":"On the phone"},"e":{"pt":"Atende-se com ฮัลโหล e o número; pede-se a pessoa com ขอพูดกับ… หน่อยได้ไหม; quem atende se identifica com 'nome + พูด'. ฮะ é uma versão relaxada de ครับ, comum entre amigos.","en":"Answer with ฮัลโหล; ask for someone with ขอพูดกับ…; identify yourself with 'name + พูด'. ฮะ is a relaxed ครับ."},"ex":[["ขอ","kɔ̌ɔ","kho"],["พูด","pûut","phut"],["กับ","gàp","kap"],["คุณ","kun","khun"],["สุนทร","sǔn-tɔɔn","sunthon"]]}],"paginas":"vol. 2, p. 347–368"},"23":{"n":23,"titulo":{"pt":"Há quanto tempo você está aqui?","en":"Conversation about length of residence"},"dialogo":[{"sp":"A","s":[["คุณ","kun","khun"],["อยู่","yùu","yu"],["เมือง","mʉʉang","mueang"],["ไทย","tai","thai"],["มา","maa","ma"],["ได้","dâai","dai"],["กี่","gìi","ki"],["ปี","bpii","pi"],["แล้ว","lɛ́ɛo","laeo"]],"fsi":"khun jùu mʉaŋ thaj maa dâj kìi pii lɛ́ɛw","en":"How long have you been living in Thailand?","pt":"Faz quantos anos que você mora na Tailândia?"},{"sp":"B","s":[["สอง","sɔ̌ɔng","song"],["ปี","bpii","pi"],["กว่า","gwàa","kwa"],["แล้ว","lɛ́ɛo","laeo"],["ครับ","kráp","khrap"]],"fsi":"sɔ̌ɔŋ pii kwàa lɛ́ɛw khráp","en":"More than two years.","pt":"Já faz mais de dois anos."},{"sp":"A","s":[["แล้ว","lɛ́ɛo","laeo"],["เพื่อน","pʉ̂ʉan","phuean"],["คุณ","kun","khun"],["ล่ะ","lâ","la"],["ครับ","kráp","khrap"]],"fsi":"lɛ́ɛw phʉ̂an khun lâ khráp","en":"And your friend?","pt":"E o seu amigo?"},{"sp":"A","s":[["มา","maa","ma"],["อยู่","yùu","yu"],["นาน","naan","nan"],["แล้ว","lɛ́ɛo","laeo"],["หรือ","rʉ̌ʉ","rue"]],"fsi":"maa jùu naan lɛ́ɛw rʉ̌ʉ","en":"Has he been here long?","pt":"Está aqui faz tempo?"},{"sp":"B","s":[["เขา","kǎo","khao"],["เพิ่ง","pə̂ng","phoeng"],["มา","maa","ma"],["ครับ","kráp","khrap"]],"fsi":"kháw phə̂ŋ maa khráp","en":"He just came.","pt":"Acabou de chegar."},{"sp":"A","s":[["เขา","kǎo","khao"],["จะ","jà","cha"],["อยู่","yùu","yu"],["กี่","gìi","ki"],["ปี","bpii","pi"],["ครับ","kráp","khrap"]],"fsi":"kháw cà jùu kìi pii khráp","en":"How many years will he be here?","pt":"Ele vai ficar quantos anos?"},{"sp":"B","s":[["อย่างน้อย","yàang-nɔ́ɔi","yangnoi"],["สอง","sɔ̌ɔng","song"],["ปี","bpii","pi"],["อย่างมาก","yàang-mâak","yangmak"],["สี่","sìi","si"],["ปี","bpii","pi"]],"fsi":"jàaŋnɔ́ɔj sɔ̌ɔŋ pii jàaŋmâak sìi pii","en":"At least two years, at most four.","pt":"No mínimo dois anos, no máximo quatro."},{"sp":"A","s":[["ทำไม","tam-mai","thammai"],["เขา","kǎo","khao"],["ถึง","tʉ̌ng","thueng"],["พูด","pûut","phut"],["ภาษาไทย","paa-sǎa-tai","phasathai"],["ได้","dâai","dai"],["ชัด","chát","chat"],["อย่างนั้น","yàang-nán","yangnan"],["ล่ะ","lâ","la"],["ครับ","kráp","khrap"]],"fsi":"thammaj kháw thʉ̌ŋ phûut phaasǎathaj dâj chát jàaŋnán lâ khráp","en":"How is it that he speaks Thai so clearly?","pt":"Como é que ele fala tailandês tão bem assim?"},{"sp":"B","s":[["เพราะ","prɔ́","phro"],["เขา","kǎo","khao"],["เคย","kəəi","khoei"],["เรียน","riian","rian"],["มาก่อน","maa-gɔ̀ɔn","makon"],["ครับ","kráp","khrap"]],"fsi":"phrɔ́ kháw khəəj rian maakɔ̀ɔn khráp","en":"He studied it previously.","pt":"Porque ele já tinha estudado antes."},{"sp":"A","s":[["ที่ไหน","tîi-nǎi","thinai"],["ครับ","kráp","khrap"]],"fsi":"thîinǎj khráp","en":"Where?","pt":"Onde?"},{"sp":"B","s":[["ที่","tîi","thi"],["อเมริกา","à-mee-rí-gaa","amerika"]],"fsi":"thîi ʔameerikaa","en":"In America.","pt":"Nos Estados Unidos."},{"sp":"A","s":[["เขา","kǎo","khao"],["เรียน","riian","rian"],["อยู่","yùu","yu"],["นาน","naan","nan"],["เท่าไร","tâo-rài","thaorai"],["ครับ","kráp","khrap"]],"fsi":"kháw rian jùu naan thâwrài khráp","en":"How long did he study?","pt":"Ele estudou por quanto tempo?"},{"sp":"B","s":[["สิบ","sìp","sip"],["เดือน","dʉʉan","duean"],["ครับ","kráp","khrap"]],"fsi":"sìp dʉan khráp","en":"Ten months.","pt":"Dez meses."}],"notas":[{"t":{"pt":"กว่า depois de número: 'e pouco'","en":"กว่า after a number: 'more than'"},"e":{"pt":"Depois de uma quantidade, กว่า quer dizer 'mais de': สองปีกว่า = mais de dois anos. Com dinheiro, a posição muda tudo: สิบบาทกว่า = entre 10 e 11 baht; สิบกว่าบาท = entre 10 e 20 baht. Analogia: é como 'dez e pouco reais' × 'dez e tantos reais'.","en":"After an amount, กว่า means 'more than'; with baht, position matters: สิบบาทกว่า (10–11) vs สิบกว่าบาท (10–20)."},"ex":[["สอง","sɔ̌ɔng","song"],["ปี","bpii","pi"],["กว่า","gwàa","kwa"]]},{"t":{"pt":"อยู่, มา…แล้ว e ได้: duração e continuidade","en":"Aspect with อยู่, มา…แล้ว and ได้"},"e":{"pt":"อยู่ + período diz quanto tempo algo dura (เรียนอยู่สองปี = vai estudar por dois anos); มา…แล้ว diz que começou no passado e continua (ทำงานมาสองปีแล้ว = trabalha há dois anos); ได้ + período sozinho é tempo passado e encerrado (ทำงานได้สองปี = trabalhou dois anos), e com แล้ว volta a ser algo que continua. Analogia: อยู่ é o cronômetro, มา…แล้ว é o odômetro que ainda gira, ได้ é o recibo do que já passou.","en":"อยู่ + period: duration; มา…แล้ว: started in the past and continuing; ได้ + period: completed (with แล้ว: still continuing)."},"ex":[["เขา","kǎo","khao"],["ทำงาน","tam-ngaan","thamngan"],["มา","maa","ma"],["สอง","sɔ̌ɔng","song"],["ปี","bpii","pi"],["แล้ว","lɛ́ɛo","laeo"]]},{"t":{"pt":"เพิ่ง: acabou de","en":"เพิ่ง: just"},"e":{"pt":"เพิ่ง vem logo antes do verbo e fala do passado bem recente: เขาเพิ่งมา = ele acabou de chegar.","en":"เพิ่ง before the verb: the very recent past."},"ex":[["ผม","pǒm","phom"],["เพิ่ง","pə̂ng","phoeng"],["กิน","gin","kin"],["ข้าว","kâao","khao"]]}],"paginas":"vol. 2, p. 369–384"},"24":{"n":24,"titulo":{"pt":"A viagem do senhor Thomas","en":"Mr. Thomas's trip (basic episode)"},"dialogo":[{"sp":"N","s":[["คุณ","kun","khun"],["โทมัส","too-mát","thomat"],["กำลัง","gam-lang","kamlang"],["เรียน","riian","rian"],["ภาษาไทย","paa-sǎa-tai","phasathai"],["อยู่","yùu","yu"]],"fsi":"khun thoomát kamlaŋ rian phaasǎathaj jùu","en":"Mr. Thomas is studying Thai","pt":"O senhor Thomas está estudando tailandês"},{"sp":"N","s":[["ที่","tîi","thi"],["โรงเรียน","roong-riian","rongrian"],["สอน","sɔ̌ɔn","son"],["ภาษา","paa-sǎa","phasa"],["ของ","kɔ̌ɔng","khong"],["กระทรวง","grà-suuang","krasuang"],["ต่างประเทศ","dtàang-bprà-têet","tangprathet"]],"fsi":"thîi rooŋrian sɔ̌ɔn phaasǎa khɔ̌ɔŋ krasuaŋ tàaŋprathêet","en":"at the language school of the Department of State.","pt":"na escola de línguas do Departamento de Estado."},{"sp":"N","s":[["เขา","kǎo","khao"],["เรียน","riian","rian"],["มา","maa","ma"],["ได้","dâai","dai"],["สอง","sɔ̌ɔng","song"],["เดือน","dʉʉan","duean"],["แล้ว","lɛ́ɛo","laeo"]],"fsi":"kháw rian maa dâj sɔ̌ɔŋ dʉan lɛ́ɛw","en":"He has been studying for two months.","pt":"Já estuda há dois meses."},{"sp":"N","s":[["เขา","kǎo","khao"],["จะ","jà","cha"],["เรียน","riian","rian"],["อีก","ìik","ik"],["สี่","sìi","si"],["เดือน","dʉʉan","duean"],["แล้ว","lɛ́ɛo","laeo"],["จะ","jà","cha"],["ไป","bpai","pai"],["เมืองไทย","mʉʉang-tai","mueangthai"]],"fsi":"kháw cà rian ʔìik sìi dʉan lɛ́ɛw cà paj mʉaŋthaj","en":"He will study four more months and then go to Thailand.","pt":"Vai estudar mais quatro meses e depois ir para a Tailândia."},{"sp":"N","s":[["เขา","kǎo","khao"],["จะ","jà","cha"],["พา","paa","pha"],["ภรรยา","pan-rá-yaa","phanraya"],["และ","lɛ́","lae"],["ลูกๆ","lûuk-lûuk","lukluk"],["ของ","kɔ̌ɔng ai"],["เพื่อน","pʉ̂ʉan","phuean"],["ใหม่","mài","mai"],["หลาย","lǎai","lai"],["คน","kon","khon"]],"fsi":"phǒm dâj phʉ̂an màj lǎaj khon","en":"I made a lot of new friends.","pt":"Fiz vários amigos novos."},{"sp":"B","s":[["อ้อ","ɔ̂ɔ","o"],["ผม","pǒm","phom"],["พบ","póp","phop"],["คน","kon","khon"],["ไทย","tai","thai"],["คน","kon","khon"],["หนึ่ง","nʉ̀ng","nueng"]],"fsi":"ʔɔ̂ɔ phǒm phóp khon thaj khon nʉ̀ŋ","en":"Oh, I ran into a Thai.","pt":"Ah, encontrei um tailandês."},{"sp":"B","s":[["เขา","kǎo","khao"],["บอก","bɔ̀ɔk","bok"],["ว่า","wâa","wa"],["เป็น","bpen","pen"],["เพื่อน","pʉ̂ʉan","phuean"],["เก่า","gào","kao"],["คุณ","kun","khun"]],"fsi":"kháw bɔ̀ɔk wâa pen phʉ̂an kàw khun","en":"He said he was an old friend of yours.","pt":"Ele disse que é um velho amigo seu."},{"sp":"A","s":[["เขา","kǎo","khao"],["ชื่อ","chʉ̂ʉ","chue"],["อะไร","à-rai","arai"]],"fsi":"kháw chʉ̂ʉ ʔaraj","en":"What was his name?","pt":"Como ele se chama?"},{"sp":"B","s":[["ผม","pǒm","phom"],["จำ","jam","cham"],["ไม่","mâi","mai"],["ได้","dâai","dai"]],"fsi":"phǒm cam mâj dâj","en":"I can't remember.","pt":"Não lembro."},{"sp":"B","s":[["เขา","kǎo","khao"],["ให้","hâi","hai"],["นามบัตร","naam-bàt","nambat"],["ผม","pǒm","phom"]],"fsi":"kháw hâj naambàt phǒm","en":"He gave me his card,","pt":"Ele me deu o cartão dele,"},{"sp":"B","s":[["แต่","dtɛ̀ɛ","tae"],["ผม","pǒm","phom"],["ลืม","lʉʉm","luem"],["เอา","ao","ao"],["มา","maa","ma"]],"fsi":"tɛ̀ɛ phǒm lʉʉm ʔaw maa","en":"but I forgot to bring it.","pt":"mas esqueci de trazer."}],"notas":[{"t":{"pt":"เป็นอะไร: o que você tem?","en":"เป็นอะไร: what's the matter?"},"e":{"pt":"เป็นอะไร(ไป) é como se pergunta por um mal-estar. Para doença, responde-se เป็น + doença: เป็นหวัด (estou resfriado), เป็นไข้ (com febre), เป็นโรคบิด. Para dor, ปวด + lugar: ปวดหัว (dor de cabeça), ปวดท้อง (dor de barriga). Analogia: เป็น é 'estar com' uma doença; ปวด é 'doer' num lugar.","en":"Ask เป็นอะไร(ไป); answer เป็น + illness or ปวด + body part."},"ex":[["ผม","pǒm","phom"],["ปวด","bpùuat","puat"],["หัว","hǔua","hua"]]},{"t":{"pt":"สนุก: divertido","en":"สนุก: fun"},"e":{"pt":"สนุก serve para lugar, coisa, pessoa ou atividade: งานเลี้ยงสนุก (a festa foi boa), เขาเป็นคนสนุก (ele é divertido). O contrário é น่าเบื่อ (chato).","en":"สนุก applies to places, things, people or activities; the opposite is น่าเบื่อ."},"ex":[["หนัง","nǎng","nang"],["เรื่อง","rʉ̂ʉang","rueang"],["นี้","níi","ni"],["สนุก","sà-nùk","sanuk"]]},{"t":{"pt":"ได้ como verbo principal: conseguir, ganhar","en":"ได้ as a main verb: to get"},"e":{"pt":"Como verbo principal, ได้ é 'obter, ganhar': ได้เพื่อนใหม่ (fiz amigos novos), ได้รางวัล (ganhou um prêmio). Analogia: é o 'ganhar' de 'ganhei um presente'.","en":"As a main verb, ได้ means to get or obtain."},"ex":[["เขา","kǎo","khao"],["ได้","dâai","dai"],["รางวัล","raang-wan","rangwan"]]},{"t":{"pt":"Tarde: ดึก, สาย ou ช้า","en":"Late: ดึก, สาย or ช้า"},"e":{"pt":"O 'tarde' muda com a hora: ดึก é tarde da noite (นอนดึก = dormir tarde); สาย é tarde da manhã (ตื่นสาย = acordar tarde); ช้า é atrasado em geral. Analogia: três relógios diferentes para o mesmo atraso.","en":"ดึก: late at night; สาย: late in the morning; ช้า: late, slow in general."},"ex":[["ผม","pǒm","phom"],["ตื่น","dtʉ̀ʉn","tuen"],["สาย","sǎai","sai"]]}],"paginas":"vol. 2, p. 397–415"},"26":{"n":26,"titulo":{"pt":"Que presente dar num casamento","en":"Discussion of wedding gifts"},"dialogo":[{"sp":"A","s":[["คุณ","kun","khun"],["สวัสดิ์","sà-wàt","sawat"],["ฮะ","há","ha"],["ถาม","tǎam","tham"],["อะไร","à-rai","arai"],["หน่อย","nɔ̀i","noi"],["ได้","dâai","dai"],["ไหม","mǎi","mai"]],"fsi":"khun sawàt há thǎam ʔaraj nɔ̀j dâj máj","en":"Mr. Sawat, may I ask you something?","pt":"Seu Sawat, posso te perguntar uma coisa?"},{"sp":"B","s":[["ยินดี","yin-dii","yindi"],["ฮะ","há","ha"]],"fsi":"jindii há","en":"Gladly.","pt":"Claro!"},{"sp":"A","s":[["วันอาทิตย์","wan-aa-tít","wanathit"],["นี้","níi","ni"],["ผม","pǒm","phom"],["ได้รับ","dâai-ráp","dairap"],["เชิญ","chəən","choen"],["ไป","bpai","pai"],["งานเลี้ยง","ngaan-líiang","nganliang"]],"fsi":"wanʔaathít níi phǒm dâjráp chəən paj ŋaanlíaŋ","en":"This Sunday I've been invited to a party.","pt":"Neste domingo fui convidado para uma festa."},{"sp":"B","s":[["งาน","ngaan","ngan"],["อะไร","à-rai","arai"],["ฮะ","há","ha"]],"fsi":"ŋaan ʔaraj há","en":"What kind of party?","pt":"Que festa?"},{"sp":"A","s":[["งาน","ngaan","ngan"],["แต่งงาน","dtɛ̀ng-ngaan","taengngan"]],"fsi":"ŋaan tɛ̀ŋŋaan","en":"A wedding.","pt":"Um casamento."},{"sp":"A","s":[["ผม","pǒm","phom"],["ไม่","mâi","mai"],["ทราบ","sâap","sap"],["ว่า","wâa","wa"],["จะ","jà","cha"],["ซื้อ","sʉ́ʉ","sue"],["อะไร","à-rai","arai"],["ให้","hâi","hai"],["เขา","kǎo","khao"],["ดี","dii","di"]],"fsi":"phǒm mâj sâap wâa cà sʉ́ʉ ʔaraj hâj kháw dii","en":"I don't know what I should buy them.","pt":"Não sei o que comprar para eles."},{"sp":"B","s":[["ให้","hâi","hai"],["ของใช้","kɔ̌ɔng-chái","khongchai"],["สิ","sì","si"],["ฮะ","há","ha"]],"fsi":"hâj khɔ̌ɔŋchái sì há","en":"Give something useful.","pt":"Dá alguma coisa útil."},{"sp":"A","s":[["เช่น","chên","chen"],["อะไร","à-rai","arai"],["มั่ง","mâng","mang"]],"fsi":"chên ʔaraj mâŋ","en":"Like what?","pt":"Tipo o quê?"},{"sp":"B","s":[["เช่น","chên","chen"],["เครื่องครัว","krʉ̂ʉang-kruua","khrueangkhrua"],["สำหรับ","sǎm-ràp","samrap"],["เจ้าสาว","jâo-sǎao","chaosao"]],"fsi":"chên khrʉ̂aŋkhrua sǎmràp câwsǎaw","en":"Kitchen utensils for the bride,","pt":"Utensílios de cozinha para a noiva,"},{"sp":"B","s":[["เครื่องใช้ไฟฟ้า","krʉ̂ʉang-chái-fai-fáa","khrueangchaifaifa"],["หรือ","rʉ̌ʉ","rue"],["ของ","kɔ̌ɔng","khong"],["สวยๆ","sǔuai-sǔuai","suaisuai"],["สำหรับ","sǎm-ràp","samrap"],["แต่ง","dtɛ̀ng","taeng"],["บ้าน","bâan","ban"]],"fsi":"khrʉ̂aŋcháifajfáa rʉ̌ʉ khɔ̌ɔŋ sǔajsǔaj sǎmràp tɛ̀ŋ bâan","en":"electrical appliances, or pretty things to decorate the house.","pt":"eletrodomésticos ou coisas bonitas para enfeitar a casa."},{"sp":"A","s":[["ตอนที่","dtɔɔn-tîi","tonthi"],["คุณ","kun","khun"],["แต่งงาน","dtɛ̀ng-ngaan","taengngan"]],"fsi":"tɔɔnthîi khun tɛ̀ŋŋaan","en":"When you got married,","pt":"Quando você se casou,"},{"sp":"A","s":[["คุณ","kun","khun"],["ได้","dâai","dai"],["ของขวัญ","kɔ̌ɔng-kwǎn","khongkhwan"],["อะไร","à-rai","arai"],["มั่ง","mâng","mang"],["ฮะ","há","ha"]],"fsi":"khun dâj khɔ̌ɔŋkhwǎn ʔaraj mâŋ há","en":"what presents did you get?","pt":"que presentes você ganhou?"},{"sp":"B","s":[["ผม","pǒm","phom"],["ได้","dâai","dai"],["ทั้ง","táng","thang"],["เงิน","ngən","ngoen"],["และ","lɛ́","lae"],["ของ","kɔ̌ɔng","khong"],["ฮะ","há","ha"]],"fsi":"phǒm dâj tháŋ ŋən lɛ́ khɔ̌ɔŋ há","en":"I got both money and things.","pt":"Ganhei dinheiro e também coisas."},{"sp":"B","s":[["เพื่อน","pʉ̂ʉan","phuean"],["บางคน","baang-kon","bangkhon"],["ก็","gɔ̂ɔ","ko"],["ให้","hâi","hai"],["ของ","kɔ̌ɔng","khong"]],"fsi":"phʉ̂an baaŋkhon kɔ̂ɔ hâj khɔ̌ɔŋ","en":"Some friends gave things;","pt":"Alguns amigos deram objetos;"},{"sp":"B","s":[["บางคน","baang-kon","bangkhon"],["ก็","gɔ̂ɔ","ko"],["ให้","hâi","hai"],["เงิน","ngən","ngoen"]],"fsi":"baaŋkhon kɔ̂ɔ hâj ŋən","en":"some gave money.","pt":"outros deram dinheiro."},{"sp":"B","s":[["ญาติๆ","yâat-yâat","yatyat"],["ส่วนมาก","sùuan-mâak","suanmak"],["ให้","hâi","hai"],["เงิน","ngən","ngoen"]],"fsi":"jâatjâat sùanmâak hâj ŋən","en":"Most of the relatives gave money.","pt":"A maioria dos parentes deu dinheiro."}],"notas":[{"t":{"pt":"Variantes das partículas de polidez","en":"Polite particle variants"},"e":{"pt":"Entre conhecidos, ครับ e ค่ะ/คะ viram ฮะ (homem) e ฮ่ะ/ฮะ (mulher). É o mesmo respeito em tom mais leve. Analogia: 'senhor' × 'seu' em 'seu Sawat'.","en":"Informally, ครับ and ค่ะ/คะ become ฮะ / ฮ่ะ."},"ex":[["ขอบคุณ","kɔ̀ɔp-kun","khopkhun"],["ฮะ","há","ha"]]},{"t":{"pt":"เชิญ × ได้รับเชิญ: convidar e ser convidado","en":"Active and passive invitation"},"e":{"pt":"เขาเชิญผม = eles me convidaram; ผมได้รับเชิญ = fui convidado. ได้รับ funciona como uma passiva formal e positiva — o contrário de ถูก, que marca algo ruim.","en":"ได้รับ + verb is a formal, positive passive (the opposite of ถูก)."},"ex":[["ผม","pǒm","phom"],["ได้รับ","dâai-ráp","dairap"],["เชิญ","chəən","choen"]]},{"t":{"pt":"ทาง + instituição: 'por parte de'","en":"ทาง + institution as agent"},"e":{"pt":"ทาง + nome de instituição a trata como quem age: ทางโรงเรียนให้หนังสือผม = a escola me deu livros; ทางราชการ = o governo. Analogia: é o nosso 'por parte da escola'.","en":"ทาง + institution treats it as the agent: ทางโรงเรียน, ทางราชการ."},"ex":[["ทาง","taang","thang"],["โรงเรียน","roong-riian","rongrian"],["ให้","hâi","hai"],["หนังสือ","nǎng-sʉ̌ʉ","nangsue"]]},{"t":{"pt":"ให้: primeiro a coisa, depois a pessoa","en":"Order with ให้"},"e":{"pt":"Com ให้ (dar), o objeto vem antes da pessoa: เขาให้หนังสือผม = ele me deu um livro. A quantidade vai para depois da pessoa: ให้หนังสือผมสองเล่ม. Analogia: primeiro se mostra o pacote, depois o destinatário, e só no fim se conta quantos.","en":"With ให้ the object precedes the recipient; quantities follow the recipient."},"ex":[["เขา","kǎo","khao"],["ให้","hâi","hai"],["หนังสือ","nǎng-sʉ̌ʉ","nangsue"],["ผม","pǒm","phom"],["สอง","sɔ̌ɔng","song"],["เล่ม","lêm","lem"]]},{"t":{"pt":"Distribuição com ละ: cada um, por mês","en":"Distributives with ละ"},"e":{"pt":"Classificador/unidade + ละ + quantidade = 'por cada': คนละสองเล่ม (dois livros para cada um), เดือนละแปดร้อยบาท (800 baht por mês).","en":"Unit + ละ + amount: per each (คนละ…, เดือนละ…)."},"ex":[["คน","kon","khon"],["ละ","lá","la"],["สอง","sɔ̌ɔng","song"],["เล่ม","lêm","lem"]]},{"t":{"pt":"Pergunta + ดี: pedindo conselho","en":"Question + ดี: asking for advice"},"e":{"pt":"ดี no fim da pergunta pede uma sugestão: จะให้อะไรดี = o que seria bom dar? A resposta curta costuma fechar com สิ: ให้ของใช้สิ.","en":"Question + ดี asks for advice; short answers often end with สิ."},"ex":[["จะ","jà","cha"],["ซื้อ","sʉ́ʉ","sue"],["อะไร","à-rai","arai"],["ดี","dii","di"]]}],"paginas":"vol. 2, p. 416–440"},"27":{"n":27,"titulo":{"pt":"Mandando chamar um táxi","en":"Sending a servant for a taxi"},"dialogo":[{"sp":"A","s":[["ช่วย","chûuai","chuai"],["เรียก","rîiak","riak"],["แท็กซี่","tɛ́k-sîi","thaeksi"],["ให้","hâi","hai"],["ผม","pǒm","phom"],["คัน","kan","khan"],["หนึ่ง","nʉ̀ng","nueng"]],"fsi":"chûaj rîak thɛ́ksîi hâj phǒm khan nʉ̀ŋ","en":"Please call a taxi for me.","pt":"Chame um táxi para mim, por favor."},{"sp":"A","s":[["บอก","bɔ̀ɔk","bok"],["เขา","kǎo","khao"],["ว่า","wâa","wa"],["ไป","bpai","pai"],["สาทร","sǎa-tɔɔn","sathon"]],"fsi":"bɔ̀ɔk kháw wâa paj sǎathɔɔn","en":"Tell him I'm going to Sathorn,","pt":"Diga que vou para a Sathorn,"},{"sp":"A","s":[["เลย","ləəi","loei"],["จัสแม็ก","jàt-sà-mɛ́k","chatsamaek"],["ไป","bpai","pai"],["หน่อย","nɔ̀i","noi"]],"fsi":"ləəj càtsamɛ́k paj nɔ̀j","en":"a little past JUSMAG.","pt":"um pouco depois do JUSMAG."},{"sp":"B","s":[["จะ","jà","cha"],["ให้","hâi","hai"],["เขา","kǎo","khao"],["คอย","kɔɔi","khoi"],["ด้วย","dûuai","duai"],["ไหม","mǎi","mai"],["คะ","ká","kha"]],"fsi":"cà hâj kháw khɔɔj dûaj máj khá","en":"Will you have him wait?","pt":"Quer que ele espere?"},{"sp":"A","s":[["ไม่ต้อง","mâi-dtɔ̂ng","maitong"]],"fsi":"mâjtɔ̂ŋ","en":"That's not necessary.","pt":"Não precisa."},{"sp":"A","s":[["ได้","dâai","dai"],["รถ","rót","rot"],["ไหม","mǎi","mai"]],"fsi":"dâj rót máj","en":"Did you get one?","pt":"Conseguiu um carro?"},{"sp":"B","s":[["ได้","dâai","dai"],["ค่ะ","kâ","kha"]],"fsi":"dâj khâ","en":"Yes, I did.","pt":"Consegui."},{"sp":"A","s":[["เขา","kǎo","khao"],["เอา","ao","ao"],["เท่าไร","tâo-rài","thaorai"]],"fsi":"kháw ʔaw thâwrài","en":"How much does he want?","pt":"Quanto ele quer?"},{"sp":"B","s":[["สิบห้า","sìp-hâa","sipha"],["บาท","bàat","bat"],["ค่ะ","kâ","kha"]],"fsi":"sìp hâa bàat khâ","en":"Fifteen baht.","pt":"Quinze baht."},{"sp":"A","s":[["ไม่","mâi","mai"],["แพง","pɛɛng","phaeng"],["ไป","bpai","pai"],["หรือ","rʉ̌ʉ","rue"]],"fsi":"mâj phɛɛŋ paj rʉ̌ʉ","en":"Isn't that too much?","pt":"Não está caro demais?"},{"sp":"A","s":[["ธรรมดา","tam-má-daa","thammada"],["เวลา","wee-laa","wela"],["ฉัน","chǎn","chan"],["เรียก","rîiak","riak"],["เอง","eeng","eng"]],"fsi":"thammadaa weelaa chán rîak ʔeeŋ","en":"Usually, when I get one myself,","pt":"Normalmente, quando eu mesmo chamo,"},{"sp":"A","s":[["เขา","kǎo","khao"],["คิด","kít","khit"],["แปด","bpɛ̀ɛt","paet"],["บาท","bàat","bat"],["เท่านั้น","tâo-nán","thaonan"]],"fsi":"kháw khít pɛ̀ɛt bàat thâwnán","en":"they charge only 8 baht.","pt":"cobram só oito baht."},{"sp":"B","s":[["ตอนนี้","dtɔɔn-níi","tonni"],["กำลัง","gam-lang","kamlang"],["เลิก","lə̂ək","loek"],["งาน","ngaan","ngan"]],"fsi":"tɔɔnníi kamlaŋ lə̂ək ŋaan","en":"It's quitting time now.","pt":"Agora é hora da saída do trabalho."},{"sp":"B","s":[["แท็กซี่","tɛ́k-sîi","thaeksi"],["หายาก","hǎa-yâak","hayak"],["ค่ะ","kâ","kha"]],"fsi":"thɛ́ksîi hǎajâak khâ","en":"Taxis are hard to find.","pt":"Táxi está difícil de achar."},{"sp":"B","s":[["ต่อ","dtɔ̀ɔ","to"],["ไม่","mâi","mai"],["ค่อย","kɔ̂i","khoi"],["ได้","dâai","dai"]],"fsi":"tɔ̀ɔ mâj khɔ̂j dâj","en":"Bargaining is hardly possible.","pt":"Quase não dá para pechinchar."}],"notas":[{"t":{"pt":"ฉัน: o 'eu' de quem está acima ou próximo","en":"ฉัน: social register"},"e":{"pt":"Homens quase só usam ฉัน falando com alguém de status social mais baixo, como um empregado. Mulheres usam mais: com subordinados, com estranhos, com conhecidos e entre amigos. Analogia: o pronome também carrega um crachá de hierarquia.","en":"Men use ฉัน mainly to social inferiors; women use it more widely."},"ex":[["ฉัน","chǎn","chan"],["ไป","bpai","pai"],["เอง","eeng","eng"]]},{"t":{"pt":"เกินไป e ไป: demais","en":"เกินไป / ไป: too much"},"e":{"pt":"Depois de verbo de estado, เกินไป ou só ไป quer dizer 'demais': แพงเกินไป = caro demais; แพงไปหรือ = não está caro demais?","en":"After stative verbs, เกินไป or ไป means 'too, excessively'."},"ex":[["แพง","pɛɛng","phaeng"],["เกินไป","gəən-bpai","koenpai"]]},{"t":{"pt":"ตอนที่ × เวลา: 'quando'","en":"ตอนที่ vs เวลา: 'when'"},"e":{"pt":"As duas viram 'quando', mas เวลา fala de ocasiões que se repetem (เวลาผมไม่เข้าใจ = sempre que não entendo) e ตอนที่ de um período específico (ตอนที่คุณเป็นเด็ก = quando você era criança).","en":"เวลา: whenever, repeated occasions; ตอนที่: a particular period."},"ex":[["เวลา","wee-laa","wela"],["ผม","pǒm","phom"],["ไม่","mâi","mai"],["เข้าใจ","kâo-jai","khaochai"]]},{"t":{"pt":"ให้ depois do verbo: para alguém","en":"ให้ after a verb: for someone"},"e":{"pt":"Como verbo secundário, ให้ quer dizer 'para alguém, no lugar de alguém': ช่วยขับรถให้ผม = dirija para mim; เขาทำอาหารให้คุณทาน = ele faz comida para você comer. Analogia: é o 'para mim' de 'faz isso para mim?'.","en":"As a secondary verb, ให้ means 'for the benefit of'."},"ex":[["ช่วย","chûuai","chuai"],["เรียก","rîiak","riak"],["แท็กซี่","tɛ́k-sîi","thaeksi"],["ให้","hâi","hai"],["ผม","pǒm","phom"]]},{"t":{"pt":"บอกให้, ขอให้, สั่งให้, อนุญาตให้","en":"Telling someone to do something"},"e":{"pt":"Verbos de pedir, mandar ou permitir ganham ให้ + frase: เขาบอกให้ผมคอย = ele me disse para esperar; เขาอนุญาตให้ผมเรียน = ele me deixou estudar. Só ให้ (เขาให้ผมคอย) diz que ele me fez esperar, sem dizer como.","en":"บอก/ขอ/สั่ง/อนุญาต + ให้ + clause: telling, asking, ordering or permitting."},"ex":[["เขา","kǎo","khao"],["บอก","bɔ̀ɔk","bok"],["ให้","hâi","hai"],["ผม","pǒm","phom"],["คอย","kɔɔi","khoi"]]},{"t":{"pt":"เอง: sozinho, por conta própria","en":"เอง: by oneself"},"e":{"pt":"เอง no fim da oração = sem ajuda de ninguém: ผมไปซื้อเอง = fui eu mesmo comprar.","en":"เอง at the end of a clause: by oneself, without help."},"ex":[["ผม","pǒm","phom"],["ทำ","tam","tham"],["เอง","eeng","eng"]]}],"paginas":"vol. 2, p. 441–471"},"28":{"n":28,"titulo":{"pt":"Pechinchando com o taxista","en":"Conversation with a taxi driver"},"dialogo":[{"sp":"D","s":[["แท็กซี่","tɛ́k-sîi","thaeksi"]],"fsi":"thɛ́ksîi","en":"Taxi!","pt":"Táxi!"},{"sp":"T","s":[["ไป","bpai","pai"],["ไหน","nǎi","nai"],["ครับ","kráp","khrap"]],"fsi":"paj nǎj khráp","en":"Where to?","pt":"Para onde?"},{"sp":"D","s":[["ไป","bpai","pai"],["ประตูน้ำ","bprà-dtuu-náam","pratunam"],["เอา","ao","ao"],["เท่าไร","tâo-rài","thaorai"]],"fsi":"paj pratuunáam ʔaw thâwrài","en":"How much to Pratunam?","pt":"Quanto até Pratunam?"},{"sp":"T","s":[["สิบสอง","sìp-sɔ̌ɔng","sipsong"],["บาท","bàat","bat"],["ครับ","kráp","khrap"]],"fsi":"sìp sɔ̌ɔŋ bàat khráp","en":"Twelve baht.","pt":"Doze baht."},{"sp":"D","s":[["เจ็ด","jèt","chet"],["บาท","bàat","bat"],["ได้","dâai","dai"],["ไหม","mǎi","mai"]],"fsi":"cèt bàat dâj máj","en":"How about seven?","pt":"Sete dá?"},{"sp":"D","s":[["ใกล้","glâi","klai"],["แค่","kɛ̂ɛ","khae"],["นี้","níi","ni"],["เอง","eeng","eng"]],"fsi":"klâj khɛ̂ɛ níi ʔeeŋ","en":"It's right near here.","pt":"É pertinho daqui."},{"sp":"T","s":[["ไม่ไหว","mâi-wǎi","maiwai"],["หรอก","rɔ̀ɔk","rok"],["ครับ","kráp","khrap"]],"fsi":"mâjwǎj rɔ̀k khráp","en":"Can't do it.","pt":"Assim não dá."},{"sp":"T","s":[["แถว","tɛ̌ɛo","thaeo"],["นั้น","nán","nan"],["รถติด","rót-dtìt","rottit"]],"fsi":"thɛ̌ɛw nán róttìt","en":"The traffic's heavy over there.","pt":"Lá o trânsito está parado."},{"sp":"D","s":[["งั้น","ngán","ngan"],["แปด","bpɛ̀ɛt","paet"],["บาท","bàat","bat"],["ไป","bpai","pai"],["ไหม","mǎi","mai"]],"fsi":"ŋán pɛ̀ɛt bàat paj máj","en":"Then, will you go for eight?","pt":"Então, oito, vai?"},{"sp":"D","s":[["เคย","kəəi","khoei"],["ไป","bpai","pai"],["ได้","dâai","dai"],["แปด","bpɛ̀ɛt","paet"],["บาท","bàat","bat"]],"fsi":"khəəj paj dâj pɛ̀ɛt bàat","en":"I've gone for eight before.","pt":"Já fui por oito."},{"sp":"T","s":[["เก้า","gâo","kao"],["บาท","bàat","bat"],["ก็แล้วกัน","gɔ̂ɔ-lɛ́ɛo-gan","kolaeokan"]],"fsi":"kâaw bàat kɔ̂ɔlɛ́ɛwkan","en":"Let's say nine baht.","pt":"Fica nove, então."},{"sp":"T","s":[["ไป","bpai","pai"],["ไหม","mǎi","mai"]],"fsi":"paj máj","en":"Do you want to go?","pt":"Vai ou não vai?"},{"sp":"D","s":[["ไป","bpai","pai"],["ก็","gɔ̂ɔ","ko"],["ไป","bpai","pai"]],"fsi":"paj kɔ̂ɔ paj","en":"If we're going, let's go.","pt":"Vamos, então."},{"sp":"D","s":[["ช่วย","chûuai","chuai"],["ขับ","kàp","khap"],["ช้าๆ","cháa-cháa","chacha"],["หน่อย","nɔ̀i","noi"],["นะ","ná","na"],["ครับ","kráp","khrap"]],"fsi":"chûaj khàp cháacháa nɔ̀j ná khráp","en":"Please drive slowly.","pt":"Dirija devagar, por favor."},{"sp":"D","s":[["คุณ","kun","khun"],["ครับ","kráp","khrap"],["อย่า","yàa","ya"],["ขับ","kàp","khap"],["เร็ว","reo","reo"],["นัก","nák","nak"],["สิ","sì","si"],["ครับ","kráp","khrap"]],"fsi":"khun khráp jàa khàp rew nák sì khráp","en":"Say, don't drive so fast.","pt":"Moço, não corra tanto!"},{"sp":"D","s":[["กรุณา","gà-rú-naa","karuna"],["ขับ","kàp","khap"],["ช้าๆ","cháa-cháa","chacha"],["หน่อย","nɔ̀i","noi"],["ได้","dâai","dai"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"karunaa khàp cháacháa nɔ̀j dâj máj khráp","en":"Could you please slow down a little?","pt":"Poderia ir mais devagar, por favor?"}],"notas":[{"t":{"pt":"Pedido afirmativo: verbo de estado dobrado","en":"Reduplication in requests"},"e":{"pt":"Em pedidos afirmativos, o modificador vem dobrado e suavizado por หน่อย: พูดช้าๆหน่อย = fale um pouco mais devagar. No pedido negativo não se dobra, e entra นัก: อย่าพูดเร็วนัก = não fale tão rápido. Analogia: o dobro é o tom gentil do 'devagarzinho'.","en":"Affirmative requests reduplicate the stative verb (+ หน่อย); negative ones use อย่า … นัก."},"ex":[["พูด","pûut","phut"],["ช้าๆ","cháa-cháa","chacha"],["หน่อย","nɔ̀i","noi"]]},{"t":{"pt":"เอง com distância: 'é logo ali'","en":"เอง with distance"},"e":{"pt":"ใกล้แค่นี้เอง = é só até aqui, pertinho. เอง enfatiza que a distância (ou o valor) é pequena.","en":"เอง stresses how short the distance is."},"ex":[["ใกล้","glâi","klai"],["แค่","kɛ̂ɛ","khae"],["นี้","níi","ni"],["เอง","eeng","eng"]]},{"t":{"pt":"หรอก suaviza o 'não'","en":"หรอก softens denials"},"e":{"pt":"หรอก (dito também rɔ̀k ou rɔ̀) acompanha negação, contradição ou correção e deixa a frase menos seca: ไม่ไหวหรอกครับ = assim não dá, não.","en":"หรอก softens a negation or correction."},"ex":[["ไม่","mâi","mai"],["แพง","pɛɛng","phaeng"],["หรอก","rɔ̀ɔk","rok"]]},{"t":{"pt":"นะ chama atenção para um comentário","en":"นะ: calling attention"},"e":{"pt":"นะครับ/นะคะ no fim chama a atenção do outro para o que se disse, sem exigir resposta; se houver, é só ครับ: ขอบคุณมากนะครับ.","en":"นะ + polite particle calls attention to a remark; reply, if any, is ครับ."},"ex":[["ขอบคุณ","kɔ̀ɔp-kun","khopkhun"],["มาก","mâak","mak"],["นะ","ná","na"],["ครับ","kráp","khrap"]]},{"t":{"pt":"สิ: pede ou insiste","en":"สิ: request or insistence"},"e":{"pt":"สิ pede que a pessoa faça algo; หน่อย ou ที suaviza quando o favor é para quem fala. Dito mais longo (ซี) insiste no que já foi pedido: ขับช้าๆซี = vai devagar, como eu pedi!","en":"สิ requests; a lengthened ซี insists on something already asked."},"ex":[["ลอง","lɔɔng","long"],["ดู","duu","du"],["สิ","sì","si"]]},{"t":{"pt":"ก็แล้วกัน: propondo um acordo","en":"ก็แล้วกัน: settling on something"},"e":{"pt":"ก็แล้วกัน no fim propõe uma escolha e pede que o outro aceite: เก้าบาทก็แล้วกัน = fica nove baht, combinado? Analogia: é o 'fechou?' da pechincha.","en":"ก็แล้วกัน proposes a choice and urges agreement."},"ex":[["วันนี้","wan-níi","wanni"],["คุณ","kun","khun"],["ขับ","kàp","khap"],["ก็แล้วกัน","gɔ̂ɔ-lɛ́ɛo-gan","kolaeokan"]]}],"paginas":"vol. 2, p. 472–480"},"29":{"n":29,"titulo":{"pt":"Vamos comer fora","en":"Going out to eat"},"dialogo":[{"sp":"A","s":[["ผม","pǒm","phom"],["จะ","jà","cha"],["ไป","bpai","pai"],["หา","hǎa","ha"],["อะไร","à-rai","arai"],["ทาน","taan","than"],["ข้างนอก","kâang-nɔ̂ɔk","khangnok"]],"fsi":"phǒm cà paj hǎa ʔaraj thaan khâaŋnɔ̂ɔk","en":"I'm going out for something to eat.","pt":"Vou sair para comer alguma coisa."},{"sp":"A","s":[["ไป","bpai","pai"],["ด้วยกัน","dûuai-gan","duaikan"],["ไหม","mǎi","mai"]],"fsi":"paj dûajkan máj","en":"Want to come along?","pt":"Quer vir junto?"},{"sp":"B","s":[["ไป","bpai","pai"]],"fsi":"paj","en":"Yes.","pt":"Quero."},{"sp":"B","s":[["คุณ","kun","khun"],["ชวน","chuuan","chuan"],["ใคร","krai","khrai"],["ไป","bpai","pai"],["ด้วย","dûuai","duai"],["หรือเปล่า","rʉ̌ʉ-bplàao","rueplao"]],"fsi":"khun chuan khraj paj dûaj rʉ̌ʉplàaw","en":"Did you ask anybody else to go along?","pt":"Você chamou mais alguém?"},{"sp":"A","s":[["ไม่","mâi","mai"],["ได้","dâai","dai"],["ชวน","chuuan","chuan"],["ใคร","krai","khrai"],["เพราะ","prɔ́","phro"],["ไม่","mâi","mai"],["มี","mii","mi"],["ใคร","krai","khrai"],["อยู่","yùu","yu"]],"fsi":"mâj dâj chuan khraj phrɔ́ mâj mii khraj jùu","en":"No, I didn't, because nobody was in.","pt":"Não chamei, porque não tinha ninguém."},{"sp":"B","s":[["คุณ","kun","khun"],["สมศรี","sǒm-sǐi","somsi"],["ล่ะ","lâ","la"]],"fsi":"khun sǒmsǐi lâ","en":"How about Somsri?","pt":"E a Somsri?"},{"sp":"A","s":[["ไม่","mâi","mai"],["มา","maa","ma"]],"fsi":"mâj maa","en":"She didn't come.","pt":"Ela não veio."},{"sp":"A","s":[["ป่วย","bpùuai","puai"]],"fsi":"pùaj","en":"She's sick.","pt":"Está doente."},{"sp":"B","s":[["งั้น","ngán","ngan"],["ทาน","taan","than"],["เสร็จ","sèt","set"],["แล้ว","lɛ́ɛo","laeo"]],"fsi":"ŋán thaan sèt lɛ́ɛw","en":"Then, after we have eaten,","pt":"Então, depois de comer,"},{"sp":"B","s":[["ถ้า","tâa","tha"],["เรา","rao","rao"],["มี","mii","mi"],["เวลา","wee-laa","wela"],["พอ","pɔɔ","pho"]],"fsi":"thâa raw mii weelaa phɔɔ","en":"if we have time,","pt":"se der tempo,"},{"sp":"B","s":[["ไป","bpai","pai"],["เยี่ยม","yîiam","yiam"],["เขา","kǎo","khao"],["สัก","sàk","sak"],["หน่อย","nɔ̀i","noi"]],"fsi":"paj jîam kháw sàk nɔ̀j","en":"let's go visit her for a while.","pt":"a gente passa para visitar ela um pouquinho."},{"sp":"A","s":[["ดี","dii","di"],["ไหม","mǎi","mai"]],"fsi":"dii máj","en":"OK?","pt":"Que tal?"},{"sp":"B","s":[["เอา","ao","ao"],["สิ","sì","si"],["ครับ","kráp","khrap"]],"fsi":"ʔaw sì khráp","en":"Good idea!","pt":"Fechado!"},{"sp":"B","s":[["งั้น","ngán","ngan"],["เรา","rao","rao"],["รีบ","rîip","rip"],["ไป","bpai","pai"],["กัน","gan","kan"],["เถอะ","tə̀","thoe"]],"fsi":"ŋán raw rîip paj kan thə̀","en":"Then let's hurry,","pt":"Então vamos andando,"},{"sp":"B","s":[["เดี๋ยว","dǐiao","diao"],["จะ","jà","cha"],["กลับ","glàp","klap"],["มา","maa","ma"],["ไม่","mâi","mai"],["ทัน","tan","than"]],"fsi":"dǐaw cà klàp maa mâj than","en":"or we won't get back on time.","pt":"senão não voltamos a tempo."}],"notas":[{"t":{"pt":"เอาไหม × ดีไหม: topa?","en":"เอาไหม / ดีไหม: proposals"},"e":{"pt":"Depois de uma proposta, เอาไหม pergunta 'aceita?', como ดีไหม. Responde-se เอาสิครับ (fechado!) ou ไม่เอาครับ (não, obrigado).","en":"After a proposal, เอาไหม asks 'will you accept?'; answer เอาสิ or ไม่เอา."},"ex":[["ไป","bpai","pai"],["กิน","gin","kin"],["ข้าว","kâao","khao"],["กัน","gan","kan"],["เอาไหม","ao-mǎi","aomai"]]},{"t":{"pt":"ใคร e อะไร como 'alguém' e 'algo'","en":"ใคร / อะไร as indefinite pronouns"},"e":{"pt":"Em perguntas com ไหม ou หรือเปล่า e em negações, ใคร e อะไร perdem o sentido de pergunta: มีใครมาไหม = veio alguém?; ไม่มีใครอยู่ = não tem ninguém. Com มี, ใคร é alguém conhecido ou esperado e คน é qualquer pessoa: มีคนโทรมาไหม (alguém ligou, sobre o anúncio?) × มีใครโทรมาไหม (algum amigo ligou?).","en":"In questions and negations, ใคร/อะไร mean 'anyone/anything'; with มี, ใคร is someone expected, คน anyone at all."},"ex":[["ไม่","mâi","mai"],["มี","mii","mi"],["ใคร","krai","khrai"],["อยู่","yùu","yu"]]},{"t":{"pt":"เสร็จ e ทัน: verbos que fecham a ação","en":"Completive verbs เสร็จ and ทัน"},"e":{"pt":"Frase + เสร็จ = terminar a atividade (ทำงานเสร็จแล้ว = acabou o trabalho); frase + ทัน = conseguir a tempo (มาไม่ทัน = não chegou a tempo). Analogia: เสร็จ é a linha de chegada; ทัน é chegar antes do apito.","en":"Sentence + เสร็จ: to finish; + ทัน: to make it in time."},"ex":[["ผม","pǒm","phom"],["ทำ","tam","tham"],["การบ้าน","gaan-bâan","kanban"],["เสร็จ","sèt","set"],["แล้ว","lɛ́ɛo","laeo"]]},{"t":{"pt":"ไหม com verbo de ação: um convite","en":"ไหม after action verbs: invitations"},"e":{"pt":"Depois de verbo de ação, ไหม deixa a escolha com o outro, por isso é como se convida: ไปด้วยกันไหม = quer ir junto? Aceita-se com ไปสิ e recusa-se com ไม่ละ ขอบคุณ.","en":"After action verbs, ไหม offers a choice and works as an invitation."},"ex":[["กิน","gin","kin"],["กาแฟ","gaa-fɛɛ","kafae"],["ไหม","mǎi","mai"]]},{"t":{"pt":"หรือเปล่า no passado: ไม่ได้ × ไม่","en":"หรือเปล่า: ไม่ได้ vs ไม่"},"e":{"pt":"หรือเปล่า pergunta se algo aconteceu: ไปหรือเปล่า = você foi? Há duas negativas: ไม่ได้ไป (não fui, algo me impediu) e ไม่ไป (não fui porque não quis). Analogia: ไม่ได้ é 'não deu'; ไม่ é 'não quis'.","en":"หรือเปล่า asks about the past; ไม่ได้ = couldn't (circumstances), ไม่ = didn't want to."},"ex":[["ผม","pǒm","phom"],["ไม่","mâi","mai"],["ได้","dâai","dai"],["ไป","bpai","pai"]]},{"t":{"pt":"เถอะ e เดี๋ยว","en":"เถอะ and เดี๋ยว"},"e":{"pt":"เถอะ faz sugestões suaves, e depois de กัน chama para fazer junto: ไปกันเถอะ = vamos! เดี๋ยว no começo da frase seguinte vira 'senão': รีบไปเถอะ เดี๋ยวไม่ทัน = vamos logo, senão não dá tempo.","en":"เถอะ: mild suggestion; เดี๋ยว as a connective: 'or else'."},"ex":[["ไป","bpai","pai"],["กัน","gan","kan"],["เถอะ","tə̀","thoe"]]}],"paginas":"vol. 2, p. 481–511"},"30":{"n":30,"titulo":{"pt":"O dia agitado do John","en":"A visit to the hospital and the Sunday Market"},"dialogo":[{"sp":"N","s":[["คุณ","kun","khun"],["จอห์น","jɔɔn","chon"],["กำลัง","gam-lang","kamlang"],["จะ","jà","cha"],["ไป","bpai","pai"],["เยี่ยม","yîiam","yiam"],["เพื่อน","pʉ̂ʉan","phuean"],["ที่","tîi","thi"],["โรงพยาบาล","roong-pá-yaa-baan","rongphayaban"],["มิชชั่น","mít-chân","mitchan"]],"fsi":"khun cɔɔn kamlaŋ cà paj jîam phʉ̂an thîi rooŋphajaabaan mítchân","en":"John is about to visit a friend at the Mission Hospital.","pt":"O John está indo visitar um amigo no Hospital Mission."},{"sp":"N","s":[["เพื่อน","pʉ̂ʉan","phuean"],["ของ","kɔ̌ɔng","khong"],["เขา","kǎo","khao"],["ไม่สบาย","mâi-sà-baai","maisabai"],["มา","maa","ma"],["หลาย","lǎai","lai"],["วัน","wan","wan"],["แล้ว","lɛ́ɛo" hey could practice speaking Thai with Thais.","pt":"para que eles treinassem o tailandês com nativos."}],"notas":[{"t":{"pt":"เมื่อ + nome ou + frase","en":"เมื่อ + phrase or clause"},"e":{"pt":"เมื่อ + expressão de tempo fala do passado: เมื่อคืนนี้ (ontem à noite), เมื่อเด็กๆ (na infância). เมื่อ + frase pode ser passado (ผมมาเมื่อเขาไปแล้ว = cheguei quando ele já tinha ido) ou futuro e condição (เมื่อผมมีรถ ผมจะไปได้ = quando eu tiver carro, vou poder ir).","en":"เมื่อ + time phrase: past; เมื่อ + clause: past, future or conditional."},"ex":[["เมื่อ","mʉ̂ʉa","muea"],["ผม","pǒm","phom"],["มี","mii","mi"],["รถ","rót","rot"],["ผม","pǒm","phom"],["จะ","jà","cha"],["ไป","bpai","pai"]]},{"t":{"pt":"เสร็จ × จบ: terminar","en":"เสร็จ vs จบ"},"e":{"pt":"เสร็จ encerra uma atividade em geral (ทำงานเสร็จ = acabou de trabalhar); จบ completa algo com duração prevista ou com fim marcado (เรียนจบ = formou-se; ดูหนังไม่จบ = não viu o filme até o fim). Analogia: เสร็จ é desligar o computador; จบ é chegar à última página do livro.","en":"เสร็จ: finish an activity; จบ: complete something with a set end."},"ex":[["เขา","kǎo","khao"],["เรียน","riian","rian"],["จบ","jòp","chop"],["แล้ว","lɛ́ɛo","laeo"]]},{"t":{"pt":"Narrar com เลย e ก็","en":"Narrating with เลย and ก็"},"e":{"pt":"เลย liga causa e consequência ('aí, por isso'): ไปถึงช้า เลยไปเยี่ยมไม่ทัน. ก็ marca o passo seguinte ou opõe frases paralelas: บางอย่างก็ถูก บางอย่างก็แพง.","en":"เลย: so, consequently; ก็: next step or parallel contrast."},"ex":[["เขา","kǎo","khao"],["ป่วย","bpùuai","puai"],["เลย","ləəi","loei"],["ไม่","mâi","mai"],["มา","maa","ma"]]}],"paginas":"vol. 2, p. 512–535"},"31":{"n":31,"titulo":{"pt":"Procurando onde morar","en":"Looking for a place to live"},"dialogo":[{"sp":"A","s":[["เมื่อวานนี้","mʉ̂ʉa-waan-níi","mueawanni"],["ผม","pǒm","phom"],["ไป","bpai","pai"],["หา","hǎa","ha"],["คุณ","kun","khun"],["แต่","dtɛ̀ɛ","tae"],["ไม่","mâi","mai"],["พบ","póp","phop"]],"fsi":"mʉ̂awaanníi phǒm paj hǎa khun tɛ̀ɛ mâj âak kwàa","en":"Actually, I myself prefer living in a house.","pt":"Para falar a verdade, eu mesmo prefiro morar em casa."},{"sp":"A","s":[["แต่","dtɛ̀ɛ","tae"],["สำหรับ","sǎm-ràp","samrap"],["คน","kon","khon"],["โสด","sòot","sot"],["ผม","pǒm","phom"],["ว่า","wâa","wa"],["อยู่","yùu","yu"],["แฟลต","flɛ̀t","flaet"],["ดี","dii","di"],["กว่า","gwàa","kwa"]],"fsi":"tɛ̀ɛ sǎmràp khon sòot phǒm wâa jùu flɛ̀t dii kwàa","en":"But for single people, I think a flat is better.","pt":"Mas, para quem é solteiro, acho melhor um apartamento."},{"sp":"B","s":[["ทำไม","tam-mai","thammai"],["ล่ะ","lâ","la"],["ครับ","kráp","khrap"]],"fsi":"thammaj lâ khráp","en":"Why?","pt":"Por quê?"},{"sp":"A","s":[["สะดวก","sà-dùuak","saduak"],["กว่า","gwàa","kwa"],["อยู่","yùu","yu"],["บ้าน","bâan","ban"]],"fsi":"sadùak kwàa jùu bâan","en":"It's more convenient than living in a house,","pt":"É mais prático que morar em casa"},{"sp":"A","s":[["และ","lɛ́","lae"],["เปลือง","bplʉʉang","plueang"],["น้อย","nɔ́ɔi","noi"],["กว่า","gwàa","kwa"]],"fsi":"lɛ́ plʉaŋ nɔ́ɔj kwàa","en":"and less expensive,","pt":"e gasta menos,"},{"sp":"A","s":[["เพราะ","prɔ́","phro"],["ไม่","mâi","mai"],["ต้อง","dtɔ̂ng","tong"],["จ้าง","jâang","chang"],["คนใช้","kon-chái","khonchai"],["หลาย","lǎai","lai"],["คน","kon","khon"]],"fsi":"phrɔ́ mâj tɔ̂ŋ câaŋ khonchái lǎaj khon","en":"because you don't have to hire a lot of servants.","pt":"porque não precisa contratar vários empregados."},{"sp":"B","s":[["จริง","jing","ching"],["นะ","ná","na"]],"fsi":"ciŋ ná","en":"Right.","pt":"É verdade."},{"sp":"B","s":[["ปลอดภัย","bplɔ̀ɔt-pai","plotphai"],["กว่า","gwàa","kwa"],["ด้วย","dûuai","duai"]],"fsi":"plɔ̀ɔtphaj kwàa dûaj","en":"It's safer too.","pt":"E é mais seguro também."},{"sp":"B","s":[["ไม่","mâi","mai"],["ต้อง","dtɔ̂ng","tong"],["กลัว","gluua","klua"],["ขโมย","kà-mooi","khamoi"]],"fsi":"mâj tɔ̂ŋ klua khamooj","en":"You don't have to be afraid of thieves.","pt":"Não precisa ter medo de ladrão."}],"notas":[{"t":{"pt":"หาพบ, หาได้, หาเจอ: o resultado da busca","en":"Results of looking: หาพบ / หาได้ / หาเจอ"},"e":{"pt":"หา é procurar; o resultado vem depois: หาพบ (achou a pessoa), หาได้ (conseguiu o que buscava), หาเจอ (achou, inclusive objetos perdidos). Negativa: หาไม่พบ, หาไม่ได้, หาไม่เจอ. Sozinho, เจอ é topar por acaso: เมื่อวานผมเจอเพื่อนเก่า. Analogia: หา é a pescaria; พบ/ได้/เจอ é o peixe no anzol.","en":"หา + พบ/ได้/เจอ gives the result of looking; เจอ alone means to run into."},"ex":[["หา","hǎa","ha"],["ไม่","mâi","mai"],["เจอ","jəə","choe"]]},{"t":{"pt":"กว่า: três montagens","en":"Comparatives with กว่า"},"e":{"pt":"Depois de verbo de estado, só กว่า: ภาษาอังกฤษยากกว่า. Depois de outros verbos, มากกว่า ou น้อยกว่า: ผมชอบคุณมากกว่าเขา. A diferença vem no fim: คุณสวยกว่าเขามาก (muito mais bonita); ที่นี่มีนักเรียนมากกว่าครูสี่ร้อยคน (400 alunos a mais que professores).","en":"Stative verb + กว่า; other verbs + มากกว่า/น้อยกว่า; the degree of difference goes last."},"ex":[["ผม","pǒm","phom"],["ชอบ","chɔ̂ɔp","chop"],["ชา","chaa","cha"],["มาก","mâak","mak"],["กว่า","gwàa","kwa"],["กาแฟ","gaa-fɛɛ","kafae"]]},{"t":{"pt":"คิดว่ายังไง × คิดอะไร","en":"คิดว่ายังไง vs คิดอะไร"},"e":{"pt":"คุณคิด(ว่า)ยังไง ou คุณว่ายังไง pede opinião (o que você acha?). คุณกำลังคิดอะไร pergunta o que está na cabeça da pessoa (no que você está pensando?).","en":"คิด(ว่า)ยังไง asks for an opinion; คิดอะไร asks what someone is thinking about."},"ex":[["คุณ","kun","khun"],["ว่า","wâa","wa"],["ยังไง","yang-ngai","yangngai"]]},{"t":{"pt":"ตัว…เอง: ênfase no 'eu mesmo'","en":"ตัว … เอง: emphatic self"},"e":{"pt":"ตัวผมเอง, ตัวเขาเอง = eu mesmo, ele mesmo. Dá peso ao contraste com os outros: ตัวผมเองชอบอยู่บ้าน (eu, de minha parte, prefiro casa).","en":"ตัว + pronoun + เอง: emphatic 'myself, himself'."},"ex":[["ตัว","dtuua","tua"],["เขา","kǎo","khao"],["เอง","eeng","eng"]]}],"paginas":"vol. 2, p. 536–555"},"32":{"n":32,"titulo":{"pt":"Alugando uma casa","en":"Renting a house (2)"},"dialogo":[{"sp":"A","s":[["คุณ","kun","khun"],["ได้","dâai","dai"],["บ้านเช่า","bâan-châo","banchao"],["แล้ว","lɛ́ɛo","laeo"],["หรือยัง","rʉ̌ʉ-yang","rueyang"]],"fsi":"khun dâj bâanchâw lɛ́ɛw rʉ̌ʉjaŋ","en":"Have you got a house to rent yet?","pt":"Já arrumou casa para alugar?"},{"sp":"B","s":[["ยัง","yang","yang"],["ครับ","kráp","khrap"]],"fsi":"jaŋ khráp","en":"Not yet.","pt":"Ainda não."},{"sp":"A","s":[["ใน","nai","nai"],["ซอย","sɔɔi","soi"],["บ้าน","bâan","ban"],["ผม","pǒm","phom"]],"fsi":"naj sɔɔj bâan phǒm","en":"On my lane","pt":"Na rua da minha casa"},{"sp":"A","s":[["มี","mii","mi"],["บ้าน","bâan","ban"],["ว่าง","wâang","wang"],["ให้","hâi","hai"],["เช่า","châo","chao"],["อยู่","yùu","yu"],["หลัง","lǎng","lang"],["หนึ่ง","nʉ̀ng","nueng"]],"fsi":"mii bâan wâaŋ hâj châw jùu lǎŋ nʉ̀ŋ","en":"there's a house for rent.","pt":"tem uma casa vaga para alugar."},{"sp":"B","s":[["เขา","kǎo","khao"],["คิด","kít","khit"],["ค่าเช่า","kâa-châo","khachao"],["ยังไง","yang-ngai","yangngai"],["ครับ","kráp","khrap"]],"fsi":"kháw khít khâachâw jaŋŋaj khráp","en":"How is the rent figured?","pt":"Como eles cobram o aluguel?"},{"sp":"A","s":[["ผม","pǒm","phom"],["ไม่","mâi","mai"],["ได้","dâai","dai"],["ถาม","tǎam","tham"],["รายละเอียด","raai-lá-ìiat","railaiat"]],"fsi":"phǒm mâj dâj thǎam raajlaʔìat","en":"I didn't ask the details.","pt":"Não perguntei os detalhes."},{"sp":"A","s":[["เป็น","bpen","pen"],["บ้าน","bâan","ban"],["ใหม่","mài","mai"]],"fsi":"pen bâan màj","en":"It's a new house.","pt":"É uma casa nova."},{"sp":"A","s":[["น่าอยู่","nâa-yùu","nayu"],["ดี","dii","di"]],"fsi":"nâajùu dii","en":"It's cozy.","pt":"Bem gostosa de morar."},{"sp":"A","s":[["สำหรับ","sǎm-ràp","samrap"],["ครอบครัว","krɔ̂ɔp-kruua","khropkhrua"],["เล็กๆ","lék-lék","leklek"],["อย่าง","yàang","yang"],["คุณ","kun","khun"]],"fsi":"sǎmràp khrɔ̂ɔpkhrua léklék jàaŋ khun","en":"For a small family like yours","pt":"Para uma família pequena como a sua,"},{"sp":"A","s":[["ขนาด","kà-nàat","khanat"],["กำลังพอดี","gam-lang-pɔɔ-dii","kamlangphodi"]],"f นอน (quarto, 'sala de dormir'), ห้องรับแขก (sala de visitas, 'sala de receber hóspede'), ห้องเก็บของ ('sala de guardar coisas'). Nome + nome: ห้องอาหาร, ห้องครัว, โรงรถ, สวนดอกไม้. Analogia: são peças de LEGO que se encaixam formando palavras novas.","en":"Noun + verb phrase (ห้องนอน) or noun + noun (ห้องอาหาร)."},"ex":[["ห้อง","hɔ̂ng","hong"],["นอน","nɔɔn","non"]]},{"t":{"pt":"Cores: claro e escuro","en":"Light and dark colors"},"e":{"pt":"สี + cor; acrescente อ่อน para claro e แก่ ou เข้ม para escuro: สีเขียวอ่อน (verde-claro), สีเขียวแก่ (verde-escuro), สีน้ำเงินเข้ม (azul-escuro). Azul-claro tem nome próprio: สีฟ้า ('cor do céu'). Marrom é สีน้ำตาล ('cor de açúcar').","en":"สี + color + อ่อน (light) / แก่, เข้ม (dark); สีฟ้า sky blue; สีน้ำตาล brown."},"ex":[["สี","sǐi","si"],["เขียว","kǐiao","khiao"],["อ่อน","ɔ̀ɔn","on"]]}],"paginas":"vol. 2, p. 572–592"},"34":{"n":34,"titulo":{"pt":"Negociando o aluguel","en":"Renting a house (4)"},"dialogo":[{"sp":"A","s":[["เป็น","bpen","pen"],["ยังไง","yang-ngai","yangngai"],["คะ","ká","kha"],["บ้าน","bâan","ban"],["หลัง","lǎng","lang"],["นี้","níi","ni"]],"fsi":"pen jaŋŋaj khá bâan lǎŋ níi","en":"How is this house?","pt":"E então, o que achou desta casa?"},{"sp":"A","s":[["คุณ","kun","khun"],["ชอบ","chɔ̂ɔp","chop"],["ไหม","mǎi","mai"],["คะ","ká","kha"]],"fsi":"khun chɔ̂ɔp máj khá","en":"Do you like it?","pt":"Gostou?"},{"sp":"B","s":[["สบาย","sà-baai","sabai"],["มาก","mâak","mak"],["ครับ","kráp","khrap"]],"fsi":"sabaaj mâak khráp","en":"Very nice.","pt":"Muito confortável."},{"sp":"B","s":[["บริเวณ","bɔɔ-rí-ween","boriwen"],["ก็","gɔ̂ɔ","ko"],["กว้างขวาง","gwâang-kwǎang","kwangkhwang"],["ดี","dii","di"]],"fsi":"bɔɔríween kɔ̂ɔ kwâaŋkhwǎaŋ dii","en":"The grounds are nice and large too.","pt":"E o terreno é bem espaçoso."},{"sp":"B","s":[["ขอโทษ","kɔ̌ɔ-tôot","khothot"],["คุณ","kun","khun"],["คิด","kít","khit"],["ค่าเช่า","kâa-châo","khachao"],["ยังไง","yang-ngai","yangngai"],["ครับ","kráp","khrap"]],"fsi":"khɔ̌ɔthôot khun khí  pares fixa os dois de uma vez.","en":"Common stative-verb opposites, learned in pairs."},"ex":[["กระเป๋า","grà-bpǎo","krapao"],["นี้","níi","ni"],["หนัก","nàk","nak"]]}],"paginas":"vol. 2, p. 616–630"},"36":{"n":36,"titulo":{"pt":"Comprando tecido","en":"Buying clothing"},"dialogo":[{"sp":"V","s":[["ซื้อ","sʉ́ʉ","sue"],["อะไร","à-rai","arai"],["คะ","ká","kha"]],"fsi":"sʉ́ʉ ʔaraj khá","en":"What would you like to buy?","pt":"O que o senhor deseja?"},{"sp":"C","s":[["ขอ","kɔ̌ɔ","kho"],["ชม","chom","chom"],["ผ้าไหม","pâa-mǎi","phamai"],["ไทย","tai","thai"],["หน่อย","nɔ̀i","noi"],["ครับ","kráp","khrap"]],"fsi":"khɔ̌ɔ chom phâamǎj thaj nɔ̀j khráp","en":"I'd like to look at some Thai silk.","pt":"Queria ver uns tecidos de seda tailandesa."},{"sp":"V","s":[["ต้องการ","dtɔ̂ng-gaan","tongkan"],["ผ้า","pâa","pha"],["ตัด","dtàt","tat"],["เสื้อ","sʉ̂ʉa","suea"],["ผู้ชาย","pûu-chaai","phuchai"],["หรือ","rʉ̌ʉ","rue"],["ผู้หญิง","pûu-yǐng","phuying"],["คะ","ká","kha"]],"fsi":"tɔ̂ŋkaan phâa tàt sʉ̂a phûuchaaj rʉ̌ʉ phûujǐŋ khá","en":"Do you want fabric for men's or women's clothing?","pt":"É tecido para roupa masculina ou feminina?"},{"sp":"C","s":[["ผ้า","pâa","pha"],["ตัด","dtàt","tat"],["กางเกง","gaang-geeng","kangkeng"],["ผู้ชาย","pûu-chaai","phuchai"]],"fsi":"phâa tàt kaaŋkeeŋ phûuchaaj","en":"Fabric for men's pants.","pt":"Tecido para calça masculina."},{"sp":"V","s":[["นี่","nîi","ni"],["ค่ะ","kâ","kha"]],"fsi":"nîi khâ","en":"Here it is.","pt":"Aqui está."},{"sp":"V","s":[["อย่าง","yàang","yang"],["นี้","níi","ni"],["ราคา","raa-kaa","rakha"],["หลา","lǎa","la"],["ละ","lá","la"],["หกสิบ","hòk-sìp","hoksip"],["บาท","bàat","bat"]],"fsi":"jàaŋ níi raakhaa lǎa lá hòksìp bàat","en":"This kind is 60 baht a yard,","pt":"Este sai a sessenta baht a jarda,"},{"sp":"V","s":[["อย่าง","yàang","yang"],["นั้น","nán","nan"],["แปดสิบ","bpɛ̀ɛt-sìp","paetsip"]],"fsi":"jàaŋ nán pɛ̀ɛtsìp","en":"that kind 80,","pt":"aquele, oitenta,"},{"sp":"V","s":[["และ","lɛ́","lae"],["อย่าง","yàang","yang"],["โ ึง com quantidades: chegar a","en":"ถึง with amounts"},"e":{"pt":"ถึง como verbo principal é 'chegar a' e, com quantias, 'chegar a tanto': มีแบงก์ย่อยแต่ไม่ถึงร้อยบาท = tenho trocado, mas não chega a cem baht.","en":"ถึง: to reach; with amounts, 'to be as much as'."},"ex":[["ไม่","mâi","mai"],["ถึง","tʉ̌ng","thueng"],["ร้อย","rɔ́ɔi","roi"],["บาท","bàat","bat"]]},{"t":{"pt":"สัก × ตั้ง: pouco ou muito","en":"สัก vs ตั้ง"},"e":{"pt":"Antes de uma quantia, สัก a diminui ('só uns'): ขอยืมสักร้อยบาท = me empresta só uns cem? ตั้ง a aumenta ('nada menos que'): ตั้งร้อยบาทเชียวหรือ = cem baht, tudo isso? Analogia: สัก é a lupa ao contrário; ตั้ง é a lupa.","en":"สัก minimizes an amount; ตั้ง stresses it is large."},"ex":[["ตั้ง","dtâng","tang"],["ร้อย","rɔ́ɔi","roi"],["บาท","bàat","bat"],["เชียว","chiiao","chiao"]]},{"t":{"pt":"ยืม × ให้ยืม: pegar e dar emprestado","en":"Borrow and lend"},"e":{"pt":"ยืม é pegar emprestado (ผมขอยืมเงินคุณ); ให้ยืม é emprestar (เขาให้ผมยืมห้าบาท = ele me emprestou cinco baht). ก่อน em ขอยืมก่อน diz que é por pouco tempo.","en":"ยืม: to borrow; ให้ + person + ยืม: to lend."},"ex":[["เขา","kǎo","khao"],["ให้","hâi","hai"],["ผม","pǒm","phom"],["ยืม","yʉʉm","yuem"],["เงิน","ngən","ngoen"]]},{"t":{"pt":"ช่าง + ofício","en":"ช่าง compounds"},"e":{"pt":"ช่าง (artesão) + o que ele faz: ช่างตัดผม (barbeiro), ช่างตัดเสื้อ (alfaiate), ช่างทอง (ourives), ช่างถ่ายรูป (fotógrafo), ช่างไม้ (carpinteiro).","en":"ช่าง + skill: ช่างตัดผม, ช่างไม้, ช่างทอง…"},"ex":[["ช่าง","châang","chang"],["ตัด","dtàt","tat"],["ผม","pǒm","phom"]]},{"t":{"pt":"ออก no fim: conseguir resolver","en":"Completive ออก"},"e":{"pt":"ออก depois de verbo de pensar mostra que se chegou ao resultado: คิดออก (descobriu), นึกออก (lembrou). A negação vai antes do ออก: คิดไม่ออก (não consegui descobrir), นึกไม่ออก (não lembro). Analogia: ออก é a lâmpada que acende.","en":"ออก after thinking verbs: success; negate as คิดไม่ออก."},"ex":[["ผม","pǒm","phom"],["นึก","nʉ́k","nuek"],["ไม่","mâi","mai"],["ออก","ɔ̀ɔk","ok"]]},{"t":{"pt":"ฝาก e ทำด้วย","en":"ฝาก; ทำด้วย"},"e":{"pt":"ฝาก é confiar algo a alguém: ฝากเงิน (depositar), ฝากซื้อ (pedir que alguém compre por você). ทำด้วย + material = feito de: ชามที่ทำด้วยไม้ (tigela de madeira). E ด้วย no fim de um pedido diz 'já que você vai mesmo': ช่วยซื้อให้ด้วย.","en":"ฝาก: entrust; ทำด้วย + material: made of."},"ex":[["โต๊ะ","dtó","to"],["ตัว","dtuua","tua"],["นี้","níi","ni"],["ทำ","tam","tham"],["ด้วย","dûuai","duai"],["ไม้","mái","mai"]]}],"paginas":"vol. 2, p. 713–740"}}};

/* ThaiWise (herdado do DevWise/IAWise) - modelos de rastreamento do conhecimento.

   Um modelo PILOTA o jogo (calcula o domínio exibido, libera fases, escolhe a dificuldade do próximo ticket). Os demais rodam como
   SOMBRAS: antes de cada resposta registram no log a probabilidade de acerto que previam, e atualizam o próprio estado, sem interferir.
   A seleção segue as ferramentas do estudo de confundidores com o ENEM que podem rodar no navegador sem treino prévio:
     elo  Elo/Rasch online com dificuldade de item e chute (estrutura do lado do item; piloto padrão)
     irt  TRI de 3 parâmetros com habilidade por EAP numa grade de 81 pontos, só com as respostas anteriores (o "teto" psicométrico)
     bkt  Bayesian Knowledge Tracing (Corbett e Anderson)
     pfa  Performance Factors Analysis (sucessos e falhas anteriores)
     afm  Additive Factor Model (contagem de oportunidades)
   As arquiteturas profundas do estudo (DKT, DKVMN, SAKT, AKT, SAINT, SimpleKT) exigem treino em muitos alunos: o log exportado tem o
   formato necessário para treiná-las fora do jogo.

   TODOS os parâmetros abaixo são a priori de projeto, não estimativas. A recomendação do próprio estudo vale aqui: recalibrar os itens
   na população real, a partir dos logs exportados, e republicar as dificuldades em ITEM_B. */
const KT = (() => {
  const sig = x => 1 / (1 + Math.exp(-x)), logit = p => Math.log(p / (1 - p)), clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const B_SCALE = 1.2;                                   // dificuldade autoral 1, 2, 3 vira b = -1,2, 0, +1,2 logits
  const ITEM_B = {};                                     // recalibração empírica por item (id -> b), quando houver dados
  const itemB = it => ITEM_B[it.id] != null ? ITEM_B[it.id] : (it.d - 2) * B_SCALE;
  const GRID = Array.from({ length: 81 }, (_, i) => -4 + i * 0.1);

  const MODELS = {
    /* K0 e DEC calibrados por simulação (iniciante domina uma habilidade em ~10 tickets). WRONG < 1 amortece a queda após um erro isolado
       (tolerância a deslize, como o 'slip' do BKT): sem isso um único erro num item fácil apagava dois acertos. Custo assumido: leve viés para cima. */
    elo: { master: 0.85, K0: 1.8, DEC: 0.06, WRONG: 0.7,
      init: L => ({ th: logit(clamp(L, .02, .98)), n: 0 }),
      predict: (m, it, c) => c + (1 - c) * sig(m.th - itemB(it)),
      update(m, it, c, y) { const p = this.predict(m, it, c); m.th = clamp(m.th + this.K0 / (1 + this.DEC * m.n) * (y - p) * (y ? 1 : this.WRONG), -4, 5); m.n++; },
      mastery: m => sig(m.th) },
    irt: { master: 0.85, shadowOnly: true,   // referência psicométrica ESTÁTICA (o "teto" do estudo): não acompanha quem está aprendendo, então nunca pilota
      init: L => ({ mu: logit(clamp(L, .02, .98)), r: [] }),
      post(m) { let w = GRID.map(t => Math.exp(-0.5 * Math.pow((t - m.mu) / 1.2, 2))); for (const [b, c, y] of m.r) w = w.map((x, i) => { const p = c + (1 - c) * sig(GRID[i] - b); return x * (y ? p : 1 - p); }); const s = w.reduce((a, b) => a + b, 0) || 1; return w.map(x => x / s); },
      predict(m, it, c) { const w = this.post(m), b = itemB(it); return w.reduce((a, x, i) => a + x * (c + (1 - c) * sig(GRID[i] - b)), 0); },
      update(m, it, c, y) { m.r.push([+itemB(it).toFixed(2), +c.toFixed(3), y ? 1 : 0]); if (m.r.length > 60) m.r.shift(); },
      mastery(m) { const w = this.post(m); return sig(w.reduce((a, x, i) => a + x * GRID[i], 0)); } },
    bkt: { master: 0.95, T: 0.2, SLIP: 0.1,
      init: L => ({ L }),
      predict(m, it, c) { return m.L * (1 - this.SLIP) + (1 - m.L) * c; },
      update(m, it, c, y) { const s = this.SLIP, L = m.L, post = y ? L * (1 - s) / (L * (1 - s) + (1 - L) * c) : L * s / (L * s + (1 - L) * (1 - c)); m.L = Math.min(.995, post + (1 - post) * this.T); },
      mastery: m => m.L },
    pfa: { master: 0.85, BETA: -1.4, GAMMA: 0.75, RHO: -0.15,
      init: L => ({ s: 0, f: 0, b0: logit(clamp(L, .02, .98)) - (-1.4) - 0.34 }),
      lin(m) { return this.BETA + m.b0 + 0.34 + this.GAMMA * m.s + this.RHO * m.f; },
      predict(m) { return sig(this.lin(m)); },
      update(m, it, c, y) { if (y) m.s++; else m.f++; },
      mastery(m) { return sig(this.lin(m)); } },
    afm: { master: 0.85, BETA: -1.4, GAMMA: 0.45,
      init: L => ({ n: 0, b0: logit(clamp(L, .02, .98)) - (-1.4) - 0.34 }),
      lin(m) { return this.BETA + m.b0 + 0.34 + this.GAMMA * m.n; },
      predict(m) { return sig(this.lin(m)); },
      update(m) { m.n++; },
      mastery(m) { return sig(this.lin(m)); } }
  };
  const IDS = Object.keys(MODELS);
  return {
    IDS, MODELS, itemB, PILOTS: IDS.filter(k => !MODELS[k].shadowOnly),
    ensure(tr) { if (!tr.m) tr.m = {}; for (const k of IDS) if (!tr.m[k]) tr.m[k] = MODELS[k].init(tr.L); return tr; },
    predictAll(tr, it, c) { this.ensure(tr); const o = {}; for (const k of IDS) o[k] = +clamp(MODELS[k].predict(tr.m[k], it, c), .001, .999).toFixed(4); return o; },
    updateAll(tr, it, c, y) { this.ensure(tr); for (const k of IDS) MODELS[k].update(tr.m[k], it, c, y); },
    mastery(tr, pilot) { this.ensure(tr); return clamp(MODELS[pilot].mastery(tr.m[pilot]), .001, .999); },
    master: pilot => MODELS[pilot].master,
    /* métricas de previsão sobre um log: Brier, AUC (Mann-Whitney) e acurácia a 0,5 */

/* ThaiWise - camada de jogo: economia de XP, modos de dificuldade, loja e patentes. Mesma economia do DevWise/IAWise. */

/* Modos. mult: multiplicador de XP; pen: XP perdido por erro (x dificuldade do item); hint: lente liberada? */
const MODES = {
  normal:   { mult: 1,   pen: 2,  hint: true },
  medio:    { mult: 1.5, pen: 4,  hint: true },
  dificil:  { mult: 2,   pen: 6,  hint: false },
  hardcore: { mult: 3,   pen: 10, hint: false }
};
const MODE_ICON = { normal: "🌱", medio: "⚙️", dificil: "🔥", hardcore: "💀" };
const ITEM_XP = { 1: 10, 2: 20, 3: 35 };   // XP base por dificuldade do item
const COMEBACK = 5;                       // bônus por acertar logo depois de um erro

/* Loja. kind: "power" (consumível) | "title" (cosmético, compra única). */
const SHOP = [
  { id: "shield", icon: "🛡️", kind: "power", cost: 30 },
  { id: "boost",  icon: "⚡", kind: "power", cost: 40 },
  { id: "lens",   icon: "🔍", kind: "power", cost: 20 },
  { id: "key",    icon: "🗝️", kind: "power", cost: 60 },
  { id: "tKai",   icon: "ก", kind: "title", cost: 80 },
  { id: "tChang", icon: "ช", kind: "title", cost: 150 },
  { id: "tHuuk",  icon: "ฮ", kind: "title", cost: 300 }
];

/* Patentes por XP acumulado. */
const ROLE_XP = [0, 150, 400, 900, 1600, 2600];

const GAME = {
  gain(S, d, ok) {
    const M = MODES[S.mode] || MODES.normal;
    if (ok) {
      let x = Math.round(ITEM_XP[d] * M.mult);
      if (S.boost > 0) { x *= 2; S.boost--; }
      if (S.lastWrong) x += COMEBACK;
      return x;
    }
    if (S.inv.shield > 0) { S.inv.shield--; return 0; }
    return -M.pen * d;
  },
  role(xpTotal) { let r = 0; ROLE_XP.forEach((v, i) => { if (xpTotal >= v) r = i; }); return r; }
};

/* ThaiWise - motor sem DOM: gera itens, escolhe o próximo, decide desbloqueios e priors.
   Níveis: 0 = Escrita e tons (pré-A1); 1..6 = CEFR A1..C2, alinhados pedagogicamente aos cinco níveis do CU-TFL.
   Habilidades (dim): ouvir, falar, ler, escrever, traduzir, tom (classe + sílaba viva/morta + marca) e gramática.
   Ids de habilidade: e01..e08 escrita; v{nível}u{nn} vocabulário; f{nn} lição do FSI Thai Basic Course; g{nível} gramática. */
const ENGINE = (() => {
  const WORD = {}; DATA.words.forEach(w => { if (!WORD[w.t]) WORD[w.t] = w; });
  const UNITS = {}; DATA.levels.forEach(L => L.units.forEach(u => { UNITS[u.id] = u; }));
  const CONS = {}; DATA.script.cons.forEach(c => { CONS[c.c] = c; });

  /* ---------- itens ---------- */

      if (d.s && d.s.length >= 3 && d.s.length <= 9) out.push({ skill: u.id, lv: u.lv, id: `${u.id}:d${i}:o`, type: "order", dim: "translate", d: 3, c: .05, s: { t: d.s, pt: d.pt, en: d.en } });
    });

  }
  function grammarItems(lv) {

    DATA.gItems.filter(g => g.lv === lv).forEach(g => out.push({ id: `${skill}:${g.id}`, skill, lv, type: "gap", dim: "grammar", d: 2, c: .25, g }));
    DATA.gSent.filter(s => s.lv === lv).forEach(s => out.push({ id: `${skill}:${s.id}`, skill, lv, type: "order", dim: "grammar", d: 3, c: .05, s }));
    return out;
  }
  function itemsFor(skill, caps) {
    if (skill[0] === "g") return grammarItems(+skill.slice(1));

  const consOf = ch => CONS[ch];
  function options(it, lang, seed) {
    const r = rng(it.id + "|" + seed), w = wordOf(it), S = DATA.script;
    const pickCons = (n, f) => shuffle(S.cons.filter(c => c.c !== it.ch && !c.obs && (!f || f(c))), r).slice(0, n);

      case "translate": case "listen": return shuffle([w, ...distractors(w, 3, lang, r)], r).map(x => ({ key: x.t, label: x.t, th: 1 }));
      case "rom": return shuffle([w.p, ...romVariants(w.p, 3, r)], r).map(p => ({ key: p, label: p, rom: 1 }));
      case "cls": return ["M", "H", "L"].map(k => ({ key: k, label: k }));
      case "ini": { const c = consOf(it.ch), seen = new Set([c.ini]), ds = []; for (const x of pickCons(40)) { if (x.ini && !seen.has(x.ini)) { seen.add(x.ini); ds.push(x.ini); } if (ds.length >= 3) break; } return shuffle([c.ini, ...ds], r).map(k => ({ key: k, label: k || "∅", rom: 1 })); }
      case "letter": case "lsn": return shuffle([it.ch, ...pickCons(3).map(c => c.c)], r).map(k => ({ key: k, label: k, th: 1 }));
      case "vrom": { const v = S.vow[it.v]; return shuffle([v.p, ...shuffle(S.vow.filter(x => x.p !== v.p), r).slice(0, 3).map(x => x.p)], r).map(k => ({ key: k, label: k, rom: 1 })); }

/* ThaiWise - tutor com LLM (traga sua própria chave).

  google:    { name: "Google (Gemini)", model: "gemini-2.5-flash", fallback: ["gemini-2.5-flash-lite", "gemini-2.0-flash", "gemini-flash-latest"], url: "https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent", kind: "google" },
  deepseek:  { name: "DeepSeek", model: "deepseek-chat", url: "https://api.deepseek.com/chat/completions", kind: "openai" },
  groq:      { name: "Groq (Llama, Meta)", model: "llama-3.3-70b-versatile", url: "https://api.groq.com/openai/v1/chat/completions", kind: "openai" },
  mistral:   { name: "Mistral", model: "mistral-small-latest", url: "https://api.mistral.ai/v1/chat/completions", kind: "openai" },
  openrouter:{ name: "OpenRouter (vários)", model: "meta-llama/llama-3.3-70b-instruct", url: "https://openrouter.ai/api/v1/chat/completions", kind: "openai" },
  custom:    { name: "OpenAI-compatível (URL própria)", model: "", url: "", kind: "openai" }

const LLM = {
  cfg() { try { return Object.assign({ provider: "anthropic", key: "", model: "", url: "" }, JSON.parse(localStorage.getItem(LLM_KEY) || "{}")); } catch (e) { return { provider: "anthropic", key: "", model: "", url: "" }; } },

  ready() { const c = LLM.cfg(); return !!c.key && (c.provider !== "custom" || !!c.url); },
  /* messages: [{role:"user"|"assistant", content}] ; devolve o texto da resposta */
  /* Tenta o modelo escolhido com até 3 tentativas (espera 1,5 s e 4 s) quando o provedor está sobrecarregado;

        catch (e) { last = e; if (!e.retry) { if (e.status === 404) break; throw e; } if (a < 2) { onStatus && onStatus({ wait: true, model, attempt: a + 2 }); await new Promise(r => setTimeout(r, a ? 4000 : 1500)); } }
