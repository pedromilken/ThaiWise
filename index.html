<meta name="description" content="Treino adaptativo de tailandês: escrita e regra dos tons, vocabulário e gramática por nível CEFR alinhados ao CU-TFL, lições do FSI Thai Basic Course, romanização Paiboon+ e RTGS, knowledge tracing e tutor de IA.">

<style>
/* ThaiWise - visual. Celadon (Thai ceramic) as the base, saffron as the reward accent, lacquer for errors.
   The memorable element is the five tone colors: they appear on every Paiboon+ syllable, in the rule table and in the tone exercises. */
:root {
  --bg: #eaf0ec; --paper: #f7faf8; --ink: #1b2630; --muted: #5b6a72; --line: #c9d6cf;
  --celadon: #3f7f6b; --celadon-2: #d5e7de; --saffron: #c47f12; --saffron-2: #f6e7cc; --lacquer: #9c2f3a; --ok: #2c7a52;
  --tM: #6b7880; --tL: #2d62ad; --tF: #b13a3a; --tH: #2a8653; --tR: #b8720f;
  --cM: #3f7f6b; --cH: #9c2f3a; --cL: #2d62ad;
  --r1: 6px; --r2: 14px;
  --sans: "Atkinson Hyperlegible", system-ui, sans-serif; --disp: "Bricolage Grotesque", "Atkinson Hyperlegible", sans-serif;
  --thai: "Noto Sans Thai Looped", "Noto Sans Thai", "Leelawadee UI", "Tahoma", sans-serif; --rom: "Noto Sans", "Segoe UI", "DejaVu Sans", sans-serif;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121a1d; --paper: #1a2428; --ink: #e5ece8; --muted: #9aaab1; --line: #2e3d43;
  --celadon: #7cc0a8; --celadon-2: #213a33; --saffron: #e6a643; --saffron-2: #3a2e17; --lacquer: #e07a84; --ok: #6fcf9b;
  --tM: #a2afb6; --tL: #79a8f0; --tF: #ef7d7d; --tH: #6fd39a; --tR: #f0b24d; --cM: #7cc0a8; --cH: #e07a84; --cL: #79a8f0; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121a1d; --paper: #1a2428; --ink: #e5ece8; --muted: #9aaab1; --line: #2e3d43;
  --celadon: #7cc0a8; --celadon-2: #213a33; --saffron: #e6a643; --saffron-2: #3a2e17; --lacquer: #e07a84; --ok: #6fcf9b;
  --tM: #a2afb6; --tL: #79a8f0; --tF: #ef7d7d; --tH: #6fd39a; --tR: #f0b24d; --cM: #7cc0a8; --cH: #e07a84; --cL: #79a8f0; color-scheme: dark; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--sans); }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 48px; }
h1, h2, h3, h4 { font-family: var(--disp); line-height: 1.2; margin: 1.2em 0 .5em; }
h2 { font-size: 1.5rem; } h3 { font-size: 1.15rem; } h4 { font-size: 1rem; color: var(--muted); }
p { margin: .5em 0; text-align: justify; hyphens: auto; }
a { color: var(--celadon); }
.muted { color: var(--muted); } .small { font-size: .85rem; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }
.th { font-family: var(--thai); font-weight: 500; }
.th.big { font-size: 1.6rem; line-height: 1.6; } .th.huge { font-size: clamp(2.4rem, 8vw, 3.6rem); line-height: 1.5; display: block; }
.rom { font-family: var(--rom); font-size: .92em; }
.rom.both { display: inline-flex; gap: .5em; align-items: baseline; flex-wrap: wrap; } .rom .rt, .rom.rt { color: var(--muted); font-style: italic; }
.pb.tc .tM { color: var(--tM); } .pb.tc .tL { color: var(--tL); } .pb.tc .tF { color: var(--tF); } .pb.tc .tH { color: var(--tH); } .pb.tc .tR { color: var(--tR); }
.sent { display: inline-flex; flex-direction: column; gap: .1em; } .sent .th { font-size: 1.3rem; }

/* cabeçalho */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin: 0 -16px; padding: 8px 16px 0; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { background: none; border: 0; display: flex; align-items: center; gap: 8px; padding: 0; font-family: var(--disp); font-size: 1.25rem; }
.logo { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--celadon); color: var(--paper); font-size: 1.4rem; }
.hud { display: flex; gap: 14px; font-size: .9rem; color: var(--muted); flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 6px; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 10px; white-space: nowrap; color: var(--muted); }
.tabs button[aria-current="page"] { color: var(--ink); border-color: var(--celadon); }

/* botões e campos */
.btn { background: var(--celadon); color: var(--paper); border: 0; border-radius: var(--r1); padding: 10px 18px; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--celadon); border: 1.5px solid var(--celadon); }
.btn.small { padding: 6px 12px; font-size: .9rem; } .btn.danger { background: var(--lacquer); }
.linkish { background: none; border: 0; color: var(--celadon); text-decoration: underline; padding: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0; } .row.between { justify-content: space-between; } .row.end { justify-content: flex-end; } .row.center { justify-content: center; }
.field { display: grid; gap: 4px; margin: 12px 0; max-width: 520px; } .field select, .field input, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r1); background: var(--paper); color: var(--ink); }
.check { display: flex; gap: 8px; align-items: flex-start; margin: 10px 0; }
.tag { font-size: .78rem; padding: 2px 8px; border-radius: 999px; background: var(--celadon-2); color: var(--ink); margin-left: 6px; } .tag.plain { background: transparent; border: 1px solid var(--line); }
.note { background: var(--saffron-2); border-left: 4px solid var(--saffron); padding: 10px 14px; border-radius: var(--r1); }
.say { background: none; border: 1px solid var(--line); border-radius: 50%; width: 34px; height: 34px; display: inline-grid; place-items: center; color: var(--celadon); flex: none; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .85rem; color: #fff; margin: 2px; }
.chip.tM { background: var(--tM); } .chip.tL { background: var(--tL); } .chip.tF { background: var(--tF); } .chip.tH { background: var(--tH); } .chip.tR { background: var(--tR); }
.chip.cM { background: var(--cM); } .chip.cH { background: var(--cH); } .chip.cL { background: var(--cL); }
.legend { margin: 8px 0; }

/* início */
.hero { padding: 28px 0 8px; }
.hero-th { margin: 0; font-size: clamp(3.5rem, 15vw, 7.5rem); line-height: 1.25; color: var(--celadon); text-align: left; }
.hero h1 { margin: 0; font-size: clamp(2rem, 5vw, 2.8rem); } .lead { font-size: 1.15rem; max-width: 62ch; text-align: left; }
.five { margin: 24px 0; } .five-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.tone-card { background: var(--paper); border: 1px solid var(--line); border-top: 6px solid; border-radius: var(--r2); padding: 12px 6px; display: grid; justify-items: center; gap: 2px; }
.tone-card .th { font-size: 2rem; } .tone-card small { font-weight: 700; }
.tone-card.tM { border-top-color: var(--tM); } .tone-card.tL { border-top-color: var(--tL); } .tone-card.tF { border-top-color: var(--tF); } .tone-card.tH { border-top-color: var(--tH); } .tone-card.tR { border-top-color: var(--tR); }
.tone-card.tM small { color: var(--tM); } .tone-card.tL small { color: var(--tL); } .tone-card.tF small { color: var(--tF); } .tone-card.tH small { color: var(--tH); } .tone-card.tR small { color: var(--tR); }
.pillars { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; margin: 24px 0; }
.pillars article { border-top: 2px solid var(--ink); padding-top: 6px; } .pillars h3 { margin-top: .3em; } .pillars p { text-align: left; }
.levels-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 18px 0; }
.lvl { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r1); padding: 10px; display: grid; text-align: left; gap: 2px; }
.lvl b { font-family: var(--disp); font-size: 1.2rem; }

/* mapa */
.level { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r2); padding: 6px 18px 14px; margin: 18px 0; }
.level.closed { opacity: .75; } .level-h { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; } .level-h h2 { margin-bottom: .2em; }
.track { margin: 12px 0 4px; }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.unit { position: relative; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r2); padding: 10px 8px 8px; display: grid; justify-items: center; gap: 2px; min-height: 120px; }
.unit .n { position: absolute; top: 26px; font-family: var(--thai); font-weight: 700; font-size: 1.15rem; }
.unit .ring { width: 54px; height: 54px; border-radius: 50%; background: conic-gradient(var(--celadon) calc(var(--p) * 1%), var(--line) 0); -webkit-mask: radial-gradient(circle, transparent 20px, #000 21px); mask: radial-gradient(circle, transparent 20px, #000 21px); }
.unit .pc { font-size: .8rem; color: var(--muted); } .unit .lbl { font-size: .78rem; line-height: 1.25; text-align: center; }
.unit.master .ring { background: conic-gradient(var(--saffron) 100%, var(--line) 0); } .unit.locked { opacity: .55; }

/* módulos e listas */
.lesson { width: 100%; display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r1); padding: 12px; margin: 8px 0; }
.lesson .ln { font-family: var(--disp); font-size: 1.5rem; color: var(--celadon); text-align: center; } .lesson .pc { color: var(--muted); }
.subtabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin: 10px 0 0; }
.subtabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; color: var(--muted); }
.subtabs button[aria-selected="true"] { color: var(--ink); border-color: var(--saffron); }
.tabbody { padding-top: 10px; }
.meter { display: flex; align-items: center; gap: 8px; font-size: .9rem; } .meter .track { width: 140px; height: 8px; background: var(--line); border-radius: 4px; margin: 0; overflow: hidden; } .meter .fill { height: 100%; background: var(--celadon); }
.rule { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 10px 0; }
.rule h3 { margin-top: .2em; } .rule .ex { display: flex; flex-direction: column; gap: 2px; background: var(--celadon-2); padding: 8px 12px; border-radius: var(--r1); text-align: left; } .ex .tr { color: var(--muted); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; } td, th { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.grid th { font-family: var(--disp); font-weight: 600; } .tones td { font-weight: 700; }
.tones td.tM { color: var(--tM); } .tones td.tL { color: var(--tL); } .tones td.tF { color: var(--tF); } .tones td.tH { color: var(--tH); } .tones td.tR { color: var(--tR); }
.consgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.cons { background: var(--paper); border: 1px solid var(--line); border-left: 5px solid; border-radius: var(--r1); padding: 8px; display: grid; gap: 1px; text-align: left; }
.cons.cM { border-left-color: var(--cM); } .cons.cH { border-left-color: var(--cH); } .cons.cL { border-left-color: var(--cL); } .cons.obs { opacity: .6; }
.cons .th.big { font-size: 2.1rem; line-height: 1.3; }
.words td:first-child { width: 1%; white-space: nowrap; }
.links li { margin: 6px 0; }
.dlg { list-style: none; padding: 0; } .dlg li { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.sp { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--celadon-2); font-weight: 700; } .dlg .tr { color: var(--muted); font-size: .95rem; }

/* exercício */
.q { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r2); padding: 18px; margin: 10px 0; }
.kind { font-family: var(--disp); font-weight: 600; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.prompt { margin: 10px 0 16px; } .prompt.center { text-align: center; display: grid; justify-items: center; gap: 4px; } .big-gloss { font-size: 1.4rem; font-weight: 700; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; } .opts.two { grid-template-columns: 1fr 1fr; } .opts.many { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); }
.opt { background: var(--bg); border: 1.5px solid var(--line); border-radius: var(--r1); padding: 12px; min-height: 52px; text-align: center; display: grid; place-items: center; gap: 2px; }
.opt .th { font-size: 1.35rem; } .opt > span { display: inline-grid; justify-items: center; gap: 2px; } .opt:hover:not(:disabled) { border-color: var(--celadon); }
.opt.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--paper)); animation: pop .35s ease; opacity: 1; }
.opt.no { border-color: var(--lacquer); background: color-mix(in srgb, var(--lacquer) 10%, var(--paper)); opacity: 1; }
@keyframes pop { 50% { transform: scale(1.04); } }
.slot, .pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 58px; padding: 8px; border-radius: var(--r1); }
.slot { border: 2px dashed var(--line); margin-bottom: 8px; } .tok { background: var(--bg); border: 1.5px solid var(--line); border-radius: var(--r1); padding: 6px 10px; display: grid; justify-items: center; }
.tok .th { font-size: 1.35rem; } .tok .tile { font-size: 1.8rem; min-width: 1.2em; text-align: center; } .tok small { font-size: .72rem; color: var(--muted); }
.feedback { display: none; margin-top: 14px; padding: 12px 14px; border-radius: var(--r1); } .feedback.show { display: block; }
.feedback.ok { background: color-mix(in srgb, var(--ok) 12%, var(--paper)); border-left: 4px solid var(--ok); } .feedback.no { background: color-mix(in srgb, var(--saffron) 14%, var(--paper)); border-left: 4px solid var(--saffron); }
.feedback .full { margin-top: 6px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; } .xpd { font-weight: 700; color: var(--saffron); }
.tutor { margin: 14px 0; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r1); padding: 8px 14px; } .tutor summary { cursor: pointer; font-weight: 700; }
.chat { display: grid; gap: 8px; margin: 8px 0; } .msg { padding: 8px 12px; border-radius: var(--r1); white-space: pre-wrap; } .msg.user { background: var(--celadon-2); justify-self: end; } .msg.assistant { background: var(--bg); }
.tutor textarea { width: 100%; }

/* relatório e loja */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; } .stats div { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r1); padding: 12px; display: grid; } .stats b { font-family: var(--disp); font-size: 1.6rem; }
.cellbar { background: linear-gradient(90deg, var(--celadon-2) calc(var(--p) * 1%), transparent 0); padding: 2px 6px; border-radius: 4px; }
tr.master td:last-child { color: var(--saffron); font-weight: 700; }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; } .shop article { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r2); padding: 14px; display: grid; gap: 6px; } .shop .ic { font-size: 2rem; } .shop p { text-align: left; }
.printonly { display: none; }
@media (max-width: 560px) { body { font-size: 16px; } .five-row { grid-template-columns: repeat(3, 1fr); } .hud { gap: 8px; } .stats b { font-size: 1.3rem; } p { text-align: left; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media print { .top, .noprint, .tutor, button { display: none !important; } .printonly { display: block; } body { background: #fff; } .wrap { max-width: none; } .level, .q, .stats div { break-inside: avoid; } }

</style>

:0,"u":"e08","pt":"pessoa","tone":"M"},{"t":"ช้าง","p":"cháang","r":"chang","cls":"L","lead":"","live":1,"long":1,"mark":2,"u":"e08","pt":"elefante","tone":"H"},{"t":"ร้อน","p":"rɔ́ɔn","r":"ron","cls":"L","lead":"","live":1,"long":1,"mark":2,"u":"e08","pt":"quente","tone":"H"},{"t":"เล่น","p":"lên","r":"len","cls":"L","lead":"","live":1,"long":0,"mark":1,"u":"e08","pt":"brincar","tone":"F"},{"t":"หมา","p":"mǎa","r":"ma","cls":"H","lead":"h","live":1,"long":1,"mark":0,"u":"e08","pt":"cachorro","tone":"R"},{"t":"หนู","p":"nǔu","r":"nu","cls":"H","lead":"h","live":1,"long":1,"mark":0,"u":"e08","pt":"rato","tone":"R"},{"t":"หญิง","p":"yǐng","r":"ying","cls":"H","lead":"h","live":1,"long":0,"mark":0,"u":"e08","pt":"mulher","tone":"R"},{"t":"หนึ่ง","p":"nʉ̀ng","r":"nueng","cls":"H","lead":"h","live":1,"long":0,"mark":1,"u":"e08","pt":"um","tone":"L"},{"t":"ใหม่","p":"mài","r":"mai","cls":"H","lead":"h","live":1,"long":0,"mark":1,"u":"e08","pt":"novo","tone":"L"},{"t":"หลับ","p":"làp","r":"lap","cls":"H","lead":"h","live":0,"long":0,"mark":0,"u":"e08","pt":"adormecer","tone":"L"},{"t":"อยู่","p":"yùu","r":"yu","cls":"M","lead":"o","live":1,"long":1,"mark":1,"u":"e08","pt":"estar, morar","tone":"L"},{"t":"อยาก","p":"yàak","r":"yak","cls":"M","lead":"o","live":0,"long":1,"mark":0,"u":"e08","pt":"querer","tone":"L"},{"t":"อย่า","p":"yàa","r":"ya","cls":"M","lead":"o","live":1,"long":1,"mark":1,"u":"e08","pt":"não (proibição)","tone":"L"}]},"grammar":{"1":[{"id":"g1-01","t":"Ordem básica: sujeito + verbo + objeto","e":"O tailandês segue a ordem SVO, como o português, mas o verbo nunca muda: não há conjugação, gênero, número nem tempo na forma da palavra. Analogia: as palavras são peças de LEGO de formato fixo — o sentido vem da ordem do encaixe e de palavrinhas extras (jà, lɛ́ɛo), nunca de deformar a peça.","ex":[["ผม","pǒm","phom"],["กิน","gin","kin"],["ข้าว","kâao","khao"]],"pt":"Eu como (comi, vou comer) arroz.","en":"I eat (ate, will eat) rice.","lv":1},{"id":"g1-02","t":"Partículas de polidez: ครับ, ค่ะ, คะ","e":"No fim da frase, quem FALA marca a polidez: homens usam ครับ (kráp); mulheres usam ค่ะ (kâ) em afirmações e คะ (ká) em perguntas. Analogia: é a assinatura no fim de um e-mail — sem ela, a frase soa seca ou até rude.","ex":[["สวัสดี","sà-wàt-dii","sawatdi"],["ครับ","kráp","khrap"]],"pt":"Olá (dito por um homem).","en":"Hello (said by a man).","lv":1},{"id":"g1-03","t":"Negação com ไม่","e":"ไม่ (mâi) vai imediatamente antes do verbo ou do adjetivo negado. Analogia: é um interruptor colocado logo antes da lâmpada — desliga só a palavra seguinte.","ex":[["ผม","pǒm","phom"],["ไม่","mâi","mai"],["กิน","gin","kin"],["เนื้อ","nʉ́ʉa","nuea"]],"pt":"Eu não como carne bovina.","en":"I don't eat beef.","lv":1},{"id":"g1-04","t":"Perguntas de sim ou não com ไหม","e":"Acrescente ไหม (mǎi) no fim de uma afirmação para virar pergunta. Não há 'sim' e 'não' universais: responde-se repetindo o verbo (กิน = sim; ไม่กิน = não). Analogia: é o 'né?' no fim da frase, só que transforma de verdade em pergunta.","ex":[["คุณ","kun","khun"],["กิน","gin","kin"],["เผ็ด","pèt","phet"],["ไหม","mǎi","mai"]],"pt":"Você come apimentado?","en":"Do you eat spicy food?","lv":1},{"id":"g1-05","t":"เป็น, คือ e อยู่: três 'ser/estar'","e":"เป็น (bpen) liga o sujeito a uma categoria ou profissão; คือ (kʉʉ) iguala e define (X é exatamente Y); อยู่ (yùu) dá localização. Analogia: เป็น é a etiqueta da gaveta, คือ é o sinal de igual (=) e อยู่ é o endereço.","ex":[["แม่","mɛ̂ɛ","mae"],["เป็น","bpen","pen"],["ครู","kruu","khru"]],"pt":"Minha mãe é professora.","en":"My mother is a teacher.","lv":1},{"id":"g1-06","t":"Adjetivo como predicado, depois do substantivo","e":"Adjetivos funcionam como verbos de estado: não usam 'ser' (เป็น aqui é erro). E vêm depois do substantivo: บ้านใหม่ = casa nova. Analogia: a comida 'gostosa-está' — o adjetivo já traz o verbo embutido.","ex":[["อาหาร","aa-hǎan","ahan"],["ไทย","tai","thai"],["อร่อย","à-rɔ̀i","aroi"],["มาก","mâak","mak"]],"pt":"A comida tailandesa é muito gostosa.","en":"Thai food is very tasty.","lv":1},{"id":"g1-07","t":"Posse com ของ","e":"O possuidor vem depois da coisa: บ้าน (ของ) ผม = casa (de) eu → minha casa. ของ (kɔ̌ɔng) é opcional quando a relação é óbvia (família, corpo). Analogia: é o 'de' de 'a casa de Pedro', que às vezes cai na fala.","ex":[["นี่","nîi","ni"],["กระเป๋า","grà-bpǎo","krapao"],["ของ","kɔ̌ɔng","khong"],["ใคร","krai","khrai"]],"pt":"De quem é esta bolsa?","en":"Whose bag is this?","lv":1},{"id":"g1-08","t":"Classificadores: substantivo + número + classificador","e":"Para contar: กาแฟ สอง แก้ว = 'café dois copo'. Cada tipo de coisa tem seu classificador: คน (pessoas), ตัว (animais, roupas), เล่ม (livros), ใบ (folhas, bilhetes), อัน (objetos em geral). Analogia: em português dizemos 'duas cabeças de gado' ou 'três folhas de papel' — o tailandês faz isso sempre.","ex":[["ขอ","kɔ̌ɔ","kho"],["กาแฟ","gaa-fɛɛ","kafae"],["สอง","sɔ̌ɔng","song"],["แก้ว","gɛ̂ɛo","kaeo"]],"pt":"Dois cafés, por favor.","en":"Two coffees, please.","lv":1},{"id":"g1-09","t":"Demonstrativos: นี้, นั้น, โน้น e นี่, นั่น","e":"Como determinante, นี้ (este), นั้น (esse) e โน้น (aquele) fecham o sintagma, depois do classificador: เสื้อ ตัว นี้ = esta camisa. Sozinhos, como pronome, usa-se นี่/นั่น: นี่อะไร = o que é isto? Analogia: o classificador é o cabo, o demonstrativo é o dedo que aponta.","ex":[["หนังสือ","nǎng-sʉ̌ʉ","nangsue"],["เล่ม","lêm","lem"],["นี้","níi","ni"],["สนุก","sà-nùk","sanuk"]],"pt":"Este livro é divertido.","en":"This book is fun.","lv":1},{"id":"g1-10","t":"Palavra interrogativa no lugar da resposta","e":"A palavra interrogativa fica onde a resposta ficaria: คุณชื่ออะไร = 'você se chama o quê?'. Nada se inverte. Analogia: é deixar um espaço em branco na frase — o interlocutor só preenche.","ex":[["คุณ","kun","khun"],["ไป","bpai","pai"],["ไหน","nǎi","nai"]],"pt":"Aonde você vai?","en":"Where are you going?","lv":1},{"id":"g1-11","t":"Futuro e intenção com จะ","e":"จะ (jà) antes do verbo marca futuro ou intenção. Muitas vezes basta uma palavra de tempo (พรุ่งนี้). Analogia: é o 'vou' de 'vou comer' — uma etiqueta de intenção colada antes do verbo.","ex":[["พรุ่งนี้","prûng-níi","phrungni"],["ผม","pǒm","phom"],["จะ","jà","cha"],["ไป","bpai","pai"],["ทะเล","tá-lee","thale"]],"pt":"Amanhã vou à praia.","en":"Tomorrow I'll go to the sea.","lv":1},{"id":"g1-12","t":"กำลัง (em andamento) e แล้ว (já, concluído)","e":"กำลัง (gam-lang) antes do verbo = estar fazendo agora. แล้ว (lɛ́ɛo) no fim = já aconteceu ou houve mudança de estado. Analogia: กำลัง é o botão ▶ (em andamento) e แล้ว é o ✔ (concluído).","ex":[["แม่","mɛ̂ɛ","mae"],["กำลัง","gam-lang","kamlang"],["ทำ","tam","tham"],["อาหาร","aa-hǎan","ahan"]],"pt":"A mãe está fazendo comida.","en":"Mum is cooking.","lv":1},{"id":"g1-13","t":"Experiência com เคย; 'ainda não' com ยังไม่","e":"เคย (kəəi) + verbo = já ter feito alguma vez. Para 'ainda não', use ยังไม่ + verbo. Analogia: เคย é o carimbo no passaporte — prova que você esteve lá; ยังไม่ é a página ainda em branco.","ex":[["คุณ","kun","khun"],["เคย","kəəi","khoei"],["ไป","bpai","pai"],["เชียงใหม่","chiiang-mài","chiangmai"],["ไหม","mǎi","mai"]],"pt":"Você já foi a Chiang Mai?","en":"Have you ever been to Chiang Mai?","lv":1},{"id":"g1-14","t":"อยาก, ต้อง e ได้","e":"อยาก (yàak) + verbo = querer fazer; ต้อง (dtɔ̂ng) + verbo = precisar; ได้ (dâai) DEPOIS do verbo = conseguir, saber fazer. Analogia: อยาก é o coração (desejo), ต้อง é o relógio (obrigação) e ได้ é a ferramenta (habilidade) — e a ferramenta fica no fim da frase.","ex":[["ผม","pǒm","phom"],["พูด","pûut","phut"],["ภาษาไทย","paa-sǎa-tai","phasathai"],["ได้","dâai","dai"],["นิดหน่อย","nít-nɔ̀i","nitnoi"]],"pt":"Falo um pouco de tailandês.","en":"I can speak a little Thai.","lv":1},{"id":"g1-15","t":"Preço e quantidade: เท่าไร e กี่","e":"เท่าไร (tâo-rài) pergunta 'quanto' (preço, valor) e fica no fim. กี่ (gìi) pergunta 'quantos' e exige classificador: กี่คน = quantas pessoas. Analogia: เท่าไร é a etiqueta de preço; กี่ é a contagem nos dedos — e cada dedo pede um classificador.","ex":[["อัน","an","an"],["นี้","níi","ni"],["ราคา","raa-kaa","rakha"],["เท่าไร","tâo-rài","thaorai"]],"pt":"Quanto custa este?","en":"How much is this one?","lv":1},{"id":"g1-16","t":"Verbos em série","e":"O tailandês encadeia verbos sem conectivo, na ordem dos acontecimentos: ไป ซื้อ ของ = ir comprar coisas; เดิน ไป ตลาด = ir a pé ao mercado. Analogia: uma esteira de montagem — cada verbo faz uma etapa da mesma ação.","ex":[["ผม","pǒm","phom"],["จะ","jà","cha"],["ไป","bpai","pai"],["ซื้อ","sʉ́ʉ","sue"],["ผลไม้","pǒn-lá-mái","phonlamai"]],"pt":"Vou comprar fruta.","en":"I'm going to buy fruit.","lv":1},{"id":"g1-17","t":"Pronomes pessoais e o sujeito que some","e":"ผม (eu, homem), ดิฉัน (eu, mulher, formal), ฉัน (eu, mulher, informal), เรา (nós; também 'eu' informal), คุณ (você), เขา (ele ou ela), พวกเขา/พวกเรา (eles, nós). มัน é 'isso' e serve para animais; usado para pessoas, ofende. Quando o contexto deixa claro, o sujeito simplesmente some: ไปไหน? = 'aonde (você) vai?'. Analogia: como no português 'Vou ao mercado' — ninguém precisa dizer 'eu'.","ex":[["พวกเขา","pûuak-kǎo","phuakkhao"],["เป็น","bpen","pen"],["คน","kon","khon"],["บราซิล","braa-sin","brasin"]],"pt":"Eles são brasileiros.","en":"They are Brazilian.","lv":1},{"id":"g1-18","t":"Pedindo: ขอ, ช่วย, หน่อย","e":"Para pedir uma coisa: ขอ + coisa (+ หน่อย): ขอน้ำหน่อย = me dá uma água? Para pedir uma ação: ช่วย + verbo (+ หน่อย): ช่วยปิดประตูหน่อย = fecha a porta, por favor. หน่อย ('um pouquinho') amacia o pedido; ครับ/ค่ะ no fim completa a polidez. Analogia: หน่อย é o 'por favorzinho' — diminui o peso do que se pede.","ex":[["ขอ","kɔ̌ɔ","kho"],["น้ำ","náam","nam"],["หน่อย","nɔ̀i","noi"],["ครับ","kráp","khrap"]],"pt":"Uma água, por favor.","en":"Some water, please.","lv":1},{"id":"g1-19","t":"Tempo sem conjugação","e":"O verbo tailandês nunca muda: ไป é 'vou', 'fui' e 'irei'. O tempo vem das palavras ao redor — เมื่อวาน (ontem), วันนี้ (hoje), พรุ่งนี้ (amanhã), ปีที่แล้ว (ano passado) — e dos marcadores จะ (futuro), กำลัง (em andamento) e แล้ว (concluído). Analogia: o verbo é uma foto sem data; as palavras de tempo são o carimbo que diz quando foi tirada.","ex":[["เมื่อวาน","mʉ̂ʉa-waan","mueawan"],["ผม","pǒm","phom"],["ไป","bpai","pai"],["ทะเล","tá-lee","thale"]],"pt":"Ontem fui à praia.","en":"Yesterday I went to the beach.","lv":1},{"id":"g1-20","t":"Advérbios e intensificadores depois do verbo","e":"Modo e intensidade vêm depois do verbo ou do adjetivo: พูดเร็ว (fala rápido), เดินช้า (anda devagar), อร่อยมาก (muito gostoso). Intensificadores: มาก (muito), จัง (muito, coloquial: ร้อนจัง), จริงๆ (de verdade), ไป (demais: แพงไป). ค่อนข้าง (bastante, meio) vem antes: ค่อนข้างแพง. Analogia: o tailandês diz primeiro o quê, depois o quanto.","ex":[["เขา","kǎo","khao"],["พูด","pûut","phut"],["เร็ว","reo","reo"],["มาก","mâak","mak"]],"pt":"Ele fala muito rápido.","en":"He speaks very fast.","lv":1},{"id":"g1-21","t":"Ordinais: ที่ + número","e":"Para ordinais, coloca-se ที่ antes do número: ที่หนึ่ง (primeiro), ที่สอง (segundo), ชั้นที่สาม (terceiro andar), ครั้งที่ห้า (quinta vez). 'Primeiro' também pode ser แรก, depois do nome: วันแรก (o primeiro dia). Analogia: ที่ é o 'º' de 1º, 2º.","ex":[["เขา","kǎo","khao"],["เป็น","bpen","pen"],["ลูก","lûuk","luk"],["คน","kon","khon"],["ที่","tîi","thi"],["สอง","sɔ̌ɔng","song"]],"pt":"Ele é o segundo filho.","en":"He is the second child.","lv":1},{"id":"g1-22","t":"Cultura: chamando as pessoas pelo nome","e":"Na Tailândia chama-se pelo primeiro nome, nunca pelo sobrenome: คุณ + nome (คุณสมชาย). Quase todo mundo tem um ชื่อเล่น (apelido) curto — ต้น, นก, เล็ก, ปุ้ย —, que é o nome do dia a dia, até no trabalho. Professores são อาจารย์ ou ครู + nome. Analogia: é como o Brasil, onde o presidente pode ser chamado pelo apelido — o sobrenome quase não aparece.","ex":[["สวัสดี","sà-wàt-dii","sawatdi"],["ค่ะ","kâ","kha"],["คุณ","kun","khun"],["สมชาย","sǒm-chaai","somchai"]],"pt":"Olá, senhor Somchai.","en":"Hello, Mr. Somchai.","lv":1}],"2":[{"id":"g2-01","t":"Comparativo กว่า e superlativo ที่สุด","e":"Adjetivo + กว่า (gwàa) + termo = 'mais ... que'. Adjetivo + ที่สุด (tîi-sùt) = 'o mais'. Não há palavra para 'mais' antes do adjetivo. Analogia: กว่า é a balança de dois pratos; ที่สุด é o pódio.","ex":[["ช้าง","cháang","chang"],["ใหญ่","yài","yai"],["กว่า","gwàa","kwa"],["ม้า","máa","ma"]],"pt":"O elefante é maior que o cavalo.","en":"The elephant is bigger than the horse.","lv":2},{"id":"g2-02","t":"Orações relativas com ที่","e":"ที่ (tîi) liga um substantivo à oração que o descreve: คนที่ใส่หมวก = a pessoa que usa chapéu. Vem logo depois do substantivo. Analogia: ที่ é o gancho onde se pendura a descrição.","ex":[["ร้าน","ráan","ran"],["ที่","tîi","thi"],["เรา","rao","rao"],["ไป","bpai","pai"],["เมื่อวาน","mʉ̂ʉa-waan","mueawan"],["ปิด","bpìt","pit"],["แล้ว","lɛ́ɛo","laeo"]],"pt":"A loja aonde fomos ontem já fechou.","en":"The shop we went to yesterday has closed.","lv":2},{"id":"g2-03","t":"ว่า: dizer, pensar, saber que","e":"Depois de verbos de dizer, pensar e saber (บอก, คิด, รู้), ว่า (wâa) introduz o conteúdo: ผมคิดว่า... = eu acho que... Analogia: ว่า abre as aspas invisíveis do que foi dito ou pensado.","ex":[["ผม","pǒm","phom"],["คิด","kít","khit"],["ว่า","wâa","wa"],["ฝน","fǒn","fon"],["จะ","jà","cha"],["ตก","dtòk","tok"]],"pt":"Acho que vai chover.","en":"I think it's going to rain.","lv":2},{"id":"g2-04","t":"ให้: dar, mandar fazer, para alguém","e":"ให้ (hâi) tem três usos: dar (ให้ของขวัญ); fazer ou deixar alguém fazer (หมอให้ผมพัก); e 'para alguém' depois do verbo (ซื้อให้แม่). Analogia: ให้ é uma seta de entrega — de um objeto, de uma ordem ou de um favor.","ex":[["ผม","pǒm","phom"],["ซื้อ","sʉ́ʉ","sue"],["ดอกไม้","dɔ̀ɔk-mái","dokmai"],["ให้","hâi","hai"],["แม่","mɛ̂ɛ","mae"]],"pt":"Comprei flores para a mãe.","en":"I bought flowers for Mum.","lv":2},{"id":"g2-05","t":"Passiva adversativa com ถูก","e":"ถูก (tùuk) + agente + verbo forma uma passiva usada sobretudo para coisas ruins: ผมถูกหมากัด = fui mordido por um cachorro. Para fatos neutros ou bons, prefere-se a voz ativa. Analogia: ถูก é uma placa de 'cuidado' — avisa que o sujeito sofreu algo.","ex":[["เขา","kǎo","khao"],["ถูก","tùuk","thuk"],["ตำรวจ","dtam-rùuat","tamruat"],["จับ","jàp","chap"]],"pt":"Ele foi preso pela polícia.","en":"He was arrested by the police.","lv":2},{"id":"g2-06","t":"Condicional: ถ้า ... ก็ ...","e":"ถ้า (tâa) abre a condição; ก็ (gɔ̂ɔ) costuma marcar a consequência, antes do verbo da segunda oração. Analogia: ถ้า é o 'se' do semáforo e ก็ é o 'então siga' que acende depois.","ex":[["ถ้า","tâa","tha"],["ฝน","fǒn","fon"],["ตก","dtòk","tok"],["ผม","pǒm","phom"],["ก็","gɔ̂ɔ","ko"],["จะ","jà","cha"],["อยู่","yùu","yu"],["บ้าน","bâan","ban"]],"pt":"Se chover, fico em casa.","en":"If it rains, I'll stay home.","lv":2},{"id":"g2-07","t":"Causa e concessão: เพราะ, จึง, แม้ว่า","e":"เพราะ(ว่า) dá a causa; จึง (jʉng) marca o resultado; แม้ว่า (mɛ́ɛ-wâa) = embora, com ก็ na segunda oração. Analogia: เพราะ é a raiz, จึง é o fruto; แม้ว่า é remar contra a correnteza e chegar mesmo assim.","ex":[["แม้ว่า","mɛ́ɛ-wâa","maewa"],["ฝน","fǒn","fon"],["ตก","dtòk","tok"],["เรา","rao","rao"],["ก็","gɔ̂ɔ","ko"],["ไป","bpai","pai"]],"pt":"Embora chovesse, fomos.","en":"Although it rained, we went.","lv":2},{"id":"g2-08","t":"Partículas finais: นะ, สิ, หรอก","e":"Além de ครับ/ค่ะ, o fim da frase carrega a emoção: นะ (ná) suaviza e pede concordância ('tá?'), สิ (sì) incentiva ('vai!'), หรอก (rɔ̀ɔk) suaviza uma negação. Analogia: são os emojis da fala tailandesa.","ex":[["กิน","gin","kin"],["สิ","sì","si"],["อร่อย","à-rɔ̀i","aroi"],["นะ","ná","na"]],"pt":"Come aí, é gostoso, viu?","en":"Go on, eat — it's tasty, you know.","lv":2},{"id":"g2-09","t":"ได้ antes do verbo: aconteceu, teve a chance","e":"Antes do verbo, ได้ (dâai) indica que a ação de fato ocorreu ou houve oportunidade: ผมได้ไปเชียงใหม่. Depois do verbo, ได้ é habilidade (A1). Analogia: antes do verbo é o ingresso usado; depois do verbo é a carteira de motorista.","ex":[["เมื่อวาน","mʉ̂ʉa-waan","mueawan"],["ผม","pǒm","phom"],["ได้","dâai","dai"],["คุย","kui","khui"],["กับ","gàp","kap"],["ครู","kruu","khru"]],"pt":"Ontem consegui conversar com o professor.","en":"Yesterday I got to talk with the teacher.","lv":2},{"id":"g2-10","t":"Verbos de direção e resultado: มา, ไป, ไว้","e":"Depois do verbo, ไป e มา dão direção (para longe ou para perto de quem fala) e ไว้ (wái) indica guardar para depois: เอามา = trazer, เอาไป = levar, จดไว้ = anotar (e guardar). Analogia: setas coladas ao verbo — para lá, para cá ou para a gaveta.","ex":[["อย่า","yàa","ya"],["ลืม","lʉʉm","luem"],["เอา","ao","ao"],["ตั๋ว","dtǔua","tua"],["มา","maa","ma"],["นะ","ná","na"]],"pt":"Não esqueça de trazer o bilhete, tá?","en":"Don't forget to bring the ticket, OK?","lv":2},{"id":"g2-11","t":"กัน: um ao outro, juntos","e":"กัน (gan) depois do verbo indica ação mútua ou em conjunto: รักกัน = amam-se; ไปกินข้าวกัน = vamos comer (juntos). Analogia: กัน é o aperto de mão — precisa de pelo menos dois.","ex":[["เรา","rao","rao"],["ไป","bpai","pai"],["เที่ยว","tîiao","thiao"],["กัน","gan","kan"]],"pt":"Vamos passear (juntos).","en":"Let's go out together.","lv":2},{"id":"g2-12","t":"Repetição com ๆ","e":"O sinal ๆ (mái yá-mók) repete a palavra anterior: เร็วๆ = bem rápido; เด็กๆ = as crianças (plural vago); ช้าๆ = devagarinho. Analogia: é o 'bis' de um show — repetir dá ênfase ou suaviza, conforme o contexto.","ex":[["ช่วย","chûuai","chuai"],["พูด","pûut","phut"],["ช้าๆ","cháa-cháa","chacha"],["หน่อย","nɔ̀i","noi"]],"pt":"Fale devagar, por favor.","en":"Please speak slowly.","lv":2},{"id":"g2-13","t":"Orações de tempo: ก่อน, หลังจาก, ตอนที่, จนกว่า","e":"ก่อน(ที่) = antes de; หลังจาก = depois de; ตอนที่ = quando; จนกว่า = até que. A oração de tempo pode vir antes ou depois da principal. Analogia: marcadores na linha do tempo — você finca a bandeira e diz o que veio antes ou depois.","ex":[["หลังจาก","lǎng-jàak","langchak"],["กิน","gin","kin"],["ข้าว","kâao","khao"],["ผม","pǒm","phom"],["แปรงฟัน","bprɛɛng-fan","praengfan"]],"pt":"Depois de comer, escovo os dentes.","en":"After eating, I brush my teeth.","lv":2},{"id":"g2-14","t":"ยัง ... อยู่ (ainda) e เพิ่ง (acabar de)","e":"ยัง + verbo + อยู่ = ainda estar fazendo: เขายังนอนอยู่. เพิ่ง (pə̂ng) + verbo = acabar de: ผมเพิ่งมา. Analogia: ยัง...อยู่ é a luz que continua acesa; เพิ่ง é a tinta ainda fresca.","ex":[["ผม","pǒm","phom"],["เพิ่ง","pə̂ng","phoeng"],["กลับ","glàp","klap"],["มา","maa","ma"],["จาก","jàak","chak"],["ญี่ปุ่น","yîi-bpùn","yipun"]],"pt":"Acabei de voltar do Japão.","en":"I've just come back from Japan.","lv":2},{"id":"g2-15","t":"As horas: o relógio de seis em seis","e":"O tailandês falado divide o dia em quatro blocos de seis horas: madrugada com ตี (ตีหนึ่ง = 1h), manhã com …โมงเช้า (เจ็ดโมงเช้า = 7h), tarde com บ่าย…โมง (บ่ายสองโมง = 14h) e …โมงเย็น (ห้าโมงเย็น = 17h), noite com ทุ่ม (หนึ่งทุ่ม = 19h, สองทุ่ม = 20h). เที่ยง é meio-dia, เที่ยงคืน meia-noite. ตี e ทุ่ม vêm das batidas de gongo e tambor que marcavam as horas. Analogia: é um relógio com quatro ponteiros diferentes — cada turno tem seu nome.","ex":[["ผม","pǒm","phom"],["ตื่น","dtʉ̀ʉn","tuen"],["หก","hòk","hok"],["โมง","moong","mong"],["เช้า","cháao","chao"]],"pt":"Acordo às seis da manhã.","en":"I wake up at six in the morning.","lv":2},{"id":"g2-16","t":"Cultura: parentes que viram pronomes","e":"Os termos de família viram pronomes, inclusive com desconhecidos: พี่ (alguém um pouco mais velho), น้อง (mais novo, também garçons e atendentes jovens), ลุง e ป้า (bem mais velhos, idade dos pais), ตา e ยาย (idosos). A pessoa usa o mesmo termo para si: พี่ไปก่อนนะ = 'eu (o mais velho) vou indo'. Meninas e moças às vezes dizem หนู para falar de si com mais velhos. Analogia: é o 'tia' e 'tio' que as crianças brasileiras usam com qualquer adulto — só que o sistema inteiro funciona assim.","ex":[["พี่","pîi","phi"],["ครับ","kráp","khrap"],["ขอ","kɔ̌ɔ","kho"],["น้ำ","náam","nam"],["หน่อย","nɔ̀i","noi"]],"pt":"(Para alguém pouco mais velho:) Me dá uma água, por favor?","en":"(To someone slightly older:) Some water, please.","lv":2},{"id":"g2-17","t":"Ordem e proibição: อย่า, ห้าม, ต้อง, ไม่ต้อง","e":"O verbo sozinho já é uma ordem (นั่ง = senta!). อย่า + verbo = não faça (อย่าลืม = não esqueça); ห้าม + verbo = é proibido, típico de placas (ห้ามสูบบุหรี่); ต้อง = tem que; ไม่ต้อง = não precisa. นะ e หน่อย suavizam: อย่าลืมนะ. Analogia: อย่า é o conselho da mãe; ห้าม é a placa do fiscal.","ex":[["อย่า","yàa","ya"],["ลืม","lʉʉm","luem"],["นะ","ná","na"]],"pt":"Não esqueça, hein!","en":"Don't forget!","lv":2},{"id":"g2-18","t":"Saber, poder, aguentar: ได้, เป็น, ไหว","e":"Três 'conseguir' diferentes depois do verbo: ได้ (é possível, tenho permissão: ไปได้), เป็น (sei fazer porque aprendi: ว่ายน้ำเป็น = sei nadar) e ไหว (tenho força para: เดินไม่ไหว = não aguento mais andar). Analogia: ได้ é a porta aberta, เป็น é o diploma, ไหว é a bateria.","ex":[["ผม","pǒm","phom"],["ว่ายน้ำ","wâai-náam","wainam"],["เป็น","bpen","pen"]],"pt":"Eu sei nadar.","en":"I can swim (I know how).","lv":2},{"id":"g2-19","t":"Quantificadores: ทุก, แต่ละ, บาง, หลาย, ทั้ง","e":"Vêm antes do classificador: ทุกคน (todos), แต่ละคน (cada um), บางคน (alguns), หลายคน (vários), ทั้งวัน (o dia inteiro). ทุก olha o grupo como bloco; แต่ละ olha um por um. Analogia: ทุก é a foto da turma; แต่ละ é a chamada, nome por nome.","ex":[["นักเรียน","nák-riian","nakrian"],["ทุก","túk","thuk"],["คน","kon","khon"],["มา","maa","ma"]],"pt":"Todos os alunos vieram.","en":"All the students came.","lv":2},{"id":"g2-20","t":"Perguntas de confirmação: ใช่ไหม, หรือเปล่า, หรือยัง, เหรอ","e":"ใช่ไหม confirma uma suposição (não é?); หรือเปล่า pergunta se algo aconteceu ou é verdade (ou não?); หรือยัง pergunta se já aconteceu (já… ou ainda não?); เหรอ (falado; escrito หรือ) mostra surpresa (é mesmo?). Responde-se a หรือยัง com …แล้ว (já) ou ยัง (ainda não). Analogia: são quatro tons de ponto de interrogação.","ex":[["คุณ","kun","khun"],["เป็น","bpen","pen"],["ครู","kruu","khru"],["ใช่ไหม","châi-mǎi","chaimai"]],"pt":"Você é professor, não é?","en":"You're a teacher, right?","lv":2}],"3":[{"id":"g3-01","t":"Verbos de resultado: como a ação termina","e":"Um segundo verbo depois do principal mostra o resultado ou a direção: ไว้ (deixar guardado: เก็บไว้), ออก (sair, conseguir: คิดออก), เจอ e พบ (achar: หาเจอ), เสร็จ (terminar: ทำเสร็จ), ทัน (a tempo: มาทัน), ขึ้น e ลง (para cima e para baixo; mais e menos: ดีขึ้น). A negação entra no meio: หาไม่เจอ, คิดไม่ออก. Analogia: o primeiro verbo é a tentativa; o segundo é o placar.","ex":[["ผม","pǒm","phom"],["คิด","kít","khit"],["ไม่","mâi","mai"],["ออก","ɔ̀ɔk","ok"]],"pt":"Não consigo descobrir.","en":"I can't figure it out.","lv":3},{"id":"g3-02","t":"Semelhança e diferença: เหมือน, คล้าย, ต่าง","e":"เหมือน (igual, como), คล้าย (parecido), เท่ากับ (igual em medida), ต่างจาก (diferente de), ไม่เหมือน (não é igual). Com กัน, a comparação fica mútua: เหมือนกัน (iguais), ต่างกัน (diferentes entre si). Analogia: เหมือน é gêmeo idêntico, คล้าย é primo, ต่าง é vizinho.","ex":[["เขา","kǎo","khao"],["หน้า","nâa","na"],["เหมือน","mʉ̌ʉan","muean"],["แม่","mɛ̂ɛ","mae"]],"pt":"O rosto dele é igual ao da mãe.","en":"He looks just like his mother.","lv":3},{"id":"g3-03","t":"Causar e deixar: ทำให้, ให้, ปล่อยให้","e":"ทำให้ = causar, quase sempre um estado ou emoção (ข่าวนี้ทำให้ผมเศร้า = a notícia me deixou triste); ให้ = fazer alguém agir (ครูให้นักเรียนอ่าน); ปล่อยให้ = deixar acontecer, não impedir. Analogia: ทำให้ é o vento que derruba; ให้ é o chefe que manda; ปล่อยให้ é quem abre a porta e sai da frente.","ex":[["ข่าว","kàao","khao"],["นี้","níi","ni"],["ทำให้","tam-hâi","thamhai"],["ผม","pǒm","phom"],["เศร้า","sâo","sao"]],"pt":"Esta notícia me deixou triste.","en":"This news made me sad.","lv":3},{"id":"g3-04","t":"Discurso indireto: บอกว่า, ถามว่า, ได้ยินว่า","e":"ว่า introduz o que alguém disse, pensou ou ouviu: บอกว่า, คิดว่า, ได้ยินว่า (ouvi dizer que), เขาว่า (dizem que). Para pergunta indireta: ถามว่า + pergunta com ไหม, หรือเปล่า ou palavra interrogativa. O tempo do verbo não muda — só o pronome, se precisar. Analogia: ว่า é o par de aspas, só que invisível.","ex":[["เขา","kǎo","khao"],["บอก","bɔ̀ɔk","bok"],["ว่า","wâa","wa"],["จะ","jà","cha"],["มา","maa","ma"],["สาย","sǎai","sai"]],"pt":"Ele disse que vai chegar atrasado.","en":"He said he would be late.","lv":3},{"id":"g3-05","t":"Orações de tempo: พอ…ก็, ระหว่างที่, จนกระทั่ง","e":"พอ + fato, … ก็ + reação = assim que (พอถึงบ้านเขาก็นอน); ทันทีที่ = no instante em que; ระหว่างที่ = enquanto; จนกระทั่ง (ou จน) = até que; ตั้งแต่ = desde. Analogia: são as marcações de um roteiro de cinema — corta, enquanto isso, até que.","ex":[["พอ","pɔɔ","pho"],["ถึง","tʉ̌ng","thueng"],["บ้าน","bâan","ban"],["เขา","kǎo","khao"],["ก็","gɔ̂ɔ","ko"],["นอน","nɔɔn","non"]],"pt":"Assim que chegou em casa, ele dormiu.","en":"As soon as he got home, he slept.","lv":3},{"id":"g3-06","t":"Probabilidade e conselho: คง, อาจจะ, น่าจะ, ควร","e":"Antes do verbo, mostram o grau de certeza: คง (provavelmente, palpite seguro), น่าจะ (deve ser, é lógico que), อาจจะ (talvez, pode ser). ควร(จะ) é conselho: deveria. Analogia: é a previsão do tempo — คง é 80%, น่าจะ é 70%, อาจจะ é 40%; ควร é o guarda-chuva que a mãe manda levar.","ex":[["พรุ่งนี้","prûng-níi","phrungni"],["ฝน","fǒn","fon"],["อาจจะ","àat-jà","atcha"],["ตก","dtòk","tok"]],"pt":"Amanhã talvez chova.","en":"It might rain tomorrow.","lv":3},{"id":"g3-07","t":"Si mesmo e um ao outro: ตัวเอง, เอง, กัน","e":"ตัวเอง = a si mesmo (ดูแลตัวเอง = cuidar de si); เอง = por conta própria (ทำเอง); กัน = um ao outro ou juntos (ช่วยกัน, รักกัน); ซึ่งกันและกัน = mutuamente, formal. Analogia: ตัวเอง é o espelho; กัน é o aperto de mão.","ex":[["เขา","kǎo","khao"],["ดูแล","duu-lɛɛ","dulae"],["ตัวเอง","dtuua-eeng","tuaeng"]],"pt":"Ele cuida de si mesmo.","en":"He takes care of himself.","lv":3},{"id":"g3-08","t":"Classificadores: o mapa completo","e":"Pessoas: คน (comum), ท่าน (respeito), รูป (monges), องค์ (realeza e imagens de Buda). Animais, roupas, móveis: ตัว. Veículos: คัน. Casas: หลัง. Livros: เล่ม. Frutas e bolas: ลูก. Papéis: แผ่น e ใบ. Garrafas: ขวด. Copos: แก้ว. Pares: คู่. Lugares: แห่ง. Coisas pequenas: อัน. Vezes: ครั้ง. Ordem: nome + número + classificador. Analogia: é o 'cabeças de gado' ou 'dentes de alho' do português — só que para tudo.","ex":[["ผม","pǒm","phom"],["มี","mii","mi"],["แมว","mɛɛo","maeo"],["สอง","sɔ̌ɔng","song"],["ตัว","dtuua","tua"]],"pt":"Tenho dois gatos.","en":"I have two cats.","lv":3},{"id":"g3-09","t":"Cultura: a escada da polidez nos pedidos","e":"Do mais seco ao mais delicado: verbo puro (ปิดประตู) → ช่วย…หน่อย → ช่วย…ได้ไหม → รบกวน…หน่อยได้ไหมคะ (desculpe incomodar) → กรุณา ou โปรด (escrito e avisos). Com quem é mais velho ou superior, sobe-se pelo menos um degrau. Analogia: é a diferença entre 'passa o sal', 'pode me passar o sal?' e 'desculpe, seria possível me passar o sal?'.","ex":[["รบกวน","róp-guuan","ropkuan"],["ช่วย","chûuai","chuai"],["ถ่าย","tàai","thai"],["รูป","rûup","rup"],["ให้","hâi","hai"],["หน่อย","nɔ̀i","noi"],["ได้","dâai","dai"],["ไหม","mǎi","mai"],["คะ","ká","kha"]],"pt":"Desculpe incomodar, poderia tirar uma foto para mim?","en":"Sorry to bother you, could you take a photo for me?","lv":3},{"id":"g3-10","t":"Cultura: เกรงใจ, ไม่เป็นไร e o 'não' indireto","e":"เกรงใจ é não querer incomodar ou impor-se — por isso o tailandês hesita em pedir, recusa ofertas na primeira vez e evita o 'não' seco. Recusa-se de lado: ไม่ค่อยสะดวก (não é muito conveniente), ขอคิดดูก่อน (vou pensar), ไว้วันหลัง (fica para outro dia). ไม่เป็นไร (tudo bem, não foi nada) desarma tensões. Analogia: é o 'vou ver e te aviso' brasileiro — todo mundo entende que pode ser não, mas ninguém perde a cara.","ex":[["วันนี้","wan-níi","wanni"],["ไม่","mâi","mai"],["ค่อย","kɔ̂i","khoi"],["สะดวก","sà-dùuak","saduak"],["ค่ะ","kâ","kha"]],"pt":"Hoje não fica muito bom para mim.","en":"Today isn't very convenient.","lv":3},{"id":"g3-11","t":"Quantidades aproximadas","e":"ประมาณ e ราว(ๆ) = cerca de (antes do número); เกือบ = quase; número + กว่า = e pouco (สิบกว่า = dez e pouco); dois números juntos = alguns (สองสามวัน = dois ou três dias); เศษ = e tantos (formal). Analogia: é o 'uns', 'por volta de' e 'e pouco' do português.","ex":[["เขา","kǎo","khao"],["อายุ","aa-yú","ayu"],["ประมาณ","bprà-maan","praman"],["สามสิบ","sǎam-sìp","samsip"]],"pt":"Ele tem uns trinta anos.","en":"He is about thirty.","lv":3},{"id":"g3-12","t":"ก็: a palavra-coringa","e":"ก็ liga a segunda parte à primeira e muda de sentido conforme o lugar: 'então' (ถ้าฝนตกก็ไม่ไป), 'também' (ผมก็ชอบ), 'tanto faz' (อะไรก็ได้), 'pois é, enfim' (ก็…แหละ) e 'uns…, outros…' (บางคนก็…). Vem sempre antes do verbo. Analogia: é o 'aí' do português falado — 'aí choveu, aí a gente ficou'.","ex":[["ไป","bpai","pai"],["ก็","gɔ̂ɔ","ko"],["ได้","dâai","dai"]],"pt":"Pode ser, posso ir.","en":"I could go, sure.","lv":3}],"4":[{"id":"g4-01","t":"A passiva: ถูก, โดน, ได้รับ","e":"Três passivas com cores diferentes: ถูก (algo ruim, neutro-formal: ถูกขโมย), โดน (algo ruim, falado: โดนหมากัด), ได้รับ (algo bom, formal: ได้รับรางวัล). O agente vem logo depois: ถูกตำรวจจับ (foi preso pela polícia). Na fala comum, o tailandês prefere a voz ativa — a passiva com ถูก/โดน já carrega o tom de 'que azar'. Analogia: ถูก e โดน são a nuvem de chuva; ได้รับ é o raio de sol.","ex":[["เขา","kǎo","khao"],["โดน","doon","don"],["หมา","mǎa","ma"],["กัด","gàt","kat"]],"pt":"Ele foi mordido por um cachorro.","en":"He was bitten by a dog.","lv":4},{"id":"g4-02","t":"Orações relativas: ที่, ซึ่ง, อัน","e":"ที่ é o relativo de todo dia (คนที่ยืนอยู่ = a pessoa que está de pé); ซึ่ง é formal e costuma acrescentar uma explicação; อัน é literário e acompanha ideias abstratas (ความรู้อันมีค่า = um saber valioso). Analogia: ที่ é o 'que' falado, ซึ่ง é o 'o qual' dos relatórios, อัน é o 'cujo' dos discursos.","ex":[["คน","kon","khon"],["ที่","tîi","thi"],["ยืน","yʉʉn","yuen"],["อยู่","yùu","yu"],["เป็น","bpen","pen"],["ครู","kruu","khru"]],"pt":"A pessoa que está de pé é professora.","en":"The person standing is a teacher.","lv":4},{"id":"g4-03","t":"Ênfase: เอง, แหละ, ถึง","e":"เอง destaca a pessoa ou coisa exata (ผมเองที่โทรมา = fui eu mesmo que liguei; นี่เอง = é isso, então!). แหละ e นั่นแหละ confirmam com força (นี่แหละบ้านผม = esta aqui é a minha casa). ถึง (+ จะ) marca 'só então' (ทำเสร็จถึงไปได้ = só depois de terminar você pode ir). Analogia: são o negrito, o sublinhado e o asterisco da frase falada.","ex":[["นี่","nîi","ni"],["แหละ","lɛ̀","lae"],["บ้าน","bâan","ban"],["ผม","pǒm","phom"]],"pt":"Esta aqui é a minha casa.","en":"This is my house, right here.","lv":4},{"id":"g4-04","t":"Conjunções em pares: ทั้ง…และ, ไม่…ก็, ไม่ใช่…แต่, ทั้งๆที่","e":"ทั้ง A และ B = tanto A quanto B; ไม่ A ก็ B = se não for A, é B; ไม่ใช่ A แต่ B = não A, mas sim B; ทั้งๆที่ = apesar de, mesmo que (com tom de crítica: ไปทำงานทั้งๆที่ป่วย). Analogia: são pares de colchetes — abriu um, o outro tem que vir.","ex":[["เขา","kǎo","khao"],["พูด","pûut","phut"],["ได้","dâai","dai"],["ทั้ง","táng","thang"],["ไทย","tai","thai"],["และ","lɛ́","lae"],["จีน","jiin","chin"]],"pt":"Ele fala tanto tailandês quanto chinês.","en":"He speaks both Thai and Chinese.","lv":4},{"id":"g4-05","t":"Negações especiais","e":"ไม่ nega verbos e adjetivos; ไม่ใช่ nega identidade (ไม่ใช่หมอ = não sou médico); ไม่ได้ nega que algo aconteceu ou desfaz uma suposição (ไม่ได้ไป = não fui); ไม่ค่อย = quase não; ไม่เคย = nunca; ยังไม่ = ainda não; ไม่…เลย = nem um pouco; มิ/มิได้ = formal escrito. Analogia: são chaves diferentes para portas diferentes — a chave errada não gira.","ex":[["ผม","pǒm","phom"],["ไม่ใช่","mâi-châi","maichai"],["หมอ","mɔ̌ɔ","mo"]],"pt":"Não sou médico.","en":"I'm not a doctor.","lv":4},{"id":"g4-06","t":"Prestes a, quase, acabou de","e":"กำลังจะ = prestes a (รถกำลังจะออก = o ônibus está saindo); ใกล้จะ = perto de (ใกล้จะจบ); เกือบ(จะ) = quase, mas não aconteceu (เกือบตกรถ = quase perdi o ônibus); เพิ่ง = acabou de. Analogia: é a régua do tempo — กำลังจะ é o dedo no gatilho, เกือบ é o tiro que passou raspando.","ex":[["รถ","rót","rot"],["กำลังจะ","gam-lang-jà","kamlangcha"],["ออก","ɔ̀ɔk","ok"]],"pt":"O ônibus está para sair.","en":"The bus is about to leave.","lv":4},{"id":"g4-07","t":"Cultura: pronomes conforme o contexto","e":"O tailandês escolhe 'eu' e 'você' conforme idade, intimidade e lugar. EU: ผม (homem, padrão), ดิฉัน (mulher, formal), ฉัน (mulher, informal), เรา (neutro, entre amigos), หนู (jovem com mais velhos), กระผม (homem, muito respeitoso), ข้าพเจ้า (discursos e documentos), กู (íntimo ou grosseiro). VOCÊ: คุณ (padrão), เธอ (íntimo, para alguém mais novo), นาย (entre amigos homens), แก (íntimo; ofensivo com estranhos), ท่าน (superior), มึง (íntimo ou grosseiro) — e os termos de parentesco (พี่, น้อง, ป้า). No escritório: ผม/ดิฉัน + คุณ; entre amigos: เรา + นาย/แก; no mercado: พี่/ป้า/น้อง. Analogia: é o 'tu, você, o senhor, Vossa Excelência' do português, multiplicado por dois.","ex":[["คุณ","kun","khun"],["จะ","jà","cha"],["ไป","bpai","pai"],["ไหน","nǎi","nai"],["ครับ","kráp","khrap"]],"pt":"Aonde o(a) senhor(a) vai?","en":"Where are you going?","lv":4},{"id":"g4-08","t":"Cultura: títulos e formas de tratamento","e":"Em documentos e situações formais: นาย (Sr.), นาง (Sra., casada), นางสาว (Srta.), เด็กชาย e เด็กหญิง (meninos e meninas até 15 anos). No trato: อาจารย์ (professor universitário, e qualquer mestre respeitado), คุณครู (professor de escola), คุณหมอ (médico), ท่าน + cargo (ท่านนายก, ท่านทูต), พระ + nome para monges. Analogia: é o 'doutor', 'professor', 'dona' do Brasil — o título vem antes do nome e às vezes no lugar dele.","ex":[["คุณหมอ","kun-mɔ̌ɔ","khunmo"],["ครับ","kráp","khrap"],["ผม","pǒm","phom"],["ปวด","bpùuat","puat"],["หัว","hǔua","hua"]],"pt":"Doutor, estou com dor de cabeça.","en":"Doctor, I have a headache.","lv":4},{"id":"g4-09","t":"Cultura: o wai (ไหว้)","e":"O wai é o cumprimento com as mãos juntas, e a altura mostra o respeito: na altura do peito (entre iguais), com as pontas dos dedos no nariz (mais velhos, superiores), na testa (monges, imagens de Buda). Quem é mais novo ou de status menor faz primeiro; o outro responde (รับไหว้). Adultos não fazem wai para crianças nem para atendentes — respondem com um aceno e um sorriso. Diante de monges e dos pais em ocasiões especiais, กราบ (prostrar-se). Analogia: é o aperto de mão com um medidor de respeito embutido.","ex":[["เด็ก","dèk","dek"],["ไหว้","wâi","wai"],["ผู้ใหญ่","pûu-yài","phuyai"]],"pt":"A criança faz o wai ao adulto.","en":"The child wais the adult.","lv":4},{"id":"g4-10","t":"Cultura: partículas de homem e de mulher","e":"Homem: ครับ em tudo; ครับผม é mais respeitoso (resposta ao chefe); ฮะ é relaxado. Mulher: ค่ะ (tom descendente) em afirmações, คะ (tom alto) em perguntas e ao chamar alguém; ขา responde a um chamado ('sim?'); จ้ะ e จ๊ะ são afetuosos, com crianças e íntimos. Trocar ค่ะ por คะ é um erro clássico de estrangeiros. Analogia: é o 'obrigado' e o 'obrigada' do português, mas presente em quase toda frase.","ex":[["ขอบคุณ","kɔ̀ɔp-kun","khopkhun"],["ค่ะ","kâ","kha"]],"pt":"Obrigada.","en":"Thank you (female).","lv":4},{"id":"g4-11","t":"Cultura: agradecer, desculpar, felicitar","e":"ขอบคุณ (obrigado) para todos; ขอบใจ só para mais novos ou íntimos. ขอโทษ (desculpe); ขออภัย é formal e aparece em avisos. Respostas: ไม่เป็นไร (tudo bem, não foi nada), ยินดี (de nada, formal). Ocasiões: ยินดีด้วย (parabéns), เสียใจด้วย (sinto muito, condolências). Analogia: são as frases de etiqueta que abrem portas — quem as usa bem soa educado mesmo com gramática imperfeita.","ex":[["ขอบใจ","kɔ̀ɔp-jai","khopchai"],["นะ","ná","na"]],"pt":"Valeu, viu! (para alguém mais novo)","en":"Thanks! (to someone younger)","lv":4},{"id":"g4-12","t":"Cultura: tabus e palavras para reconhecer","e":"Para reconhecer, não para usar: กู e มึง são 'eu' e 'você' de íntimos (entre amigos homens) e ofensivos com estranhos; ไอ้ e อี antes do nome são pejorativos; มัน para uma pessoa é desprezo. Alguns tabus vão além da língua: a cabeça é a parte mais alta e não se toca; os pés são a mais baixa e não se aponta com eles; falar mal da monarquia é crime (lesa-majestade). Analogia: é o mapa dos buracos da estrada — você conhece para desviar.","ex":[["อย่า","yàa","ya"],["ใช้","chái","chai"],["คำ","kam","kham"],["ว่า","wâa","wa"],["มึง","mʉng","mueng"],["กับ","gàp","kap"],["คน","kon","khon"],["แปลกหน้า","bplɛ̀ɛk-nâa","plaekna"]],"pt":"Não use มึง com desconhecidos.","en":"Don't use มึง with strangers.","lv":4},{"id":"g4-13","t":"Interjeições e reações","e":"As reações rápidas dão naturalidade: อ้าว (ué!, surpresa ou contrariedade), อุ๊ย (ai!, susto leve), โอ้โห (uau!), จริงเหรอ (é mesmo?), แหม (ora, ora…, ironia carinhosa), เฮ้อ (suspiro, cansaço). Analogia: são os temperos da conversa — pouca quantidade, muito sabor.","ex":[["โอ้โห","ôo-hǒo","oho"],["สวย","sǔuai","suai"],["จัง","jang","chang"]],"pt":"Uau, que lindo!","en":"Wow, how beautiful!","lv":4}],"5":[{"id":"g5-01","t":"การ e ความ: transformando em substantivo","e":"การ + verbo de ação vira o nome da atividade (เลือกตั้ง → การเลือกตั้ง, 'a eleição'); ความ + verbo de estado ou de sentimento vira o nome da qualidade (จน → ความยากจน, 'a pobreza'; สุข → ความสุข, 'a felicidade'). Analogia: são os sufixos '-ção' e '-dade' do português, só que vêm na frente.","ex":[["การ","gaan","kan"],["ศึกษา","sʉ̀k-sǎa","sueksa"],["สำคัญ","sǎm-kan","samkhan"],["มาก","mâak","mak"]],"pt":"A educação é muito importante.","en":"Education is very important.","lv":5},{"id":"g5-02","t":"Conectivos formais de texto","e":"No texto formal, as frases se ligam com conectivos próprios: อย่างไรก็ตาม (no entanto), นอกจากนี้ (além disso), ดังนั้น ou เพราะฉะนั้น (portanto), ทั้งนี้ (nesse sentido), กล่าวคือ (ou seja). Analogia: são as placas de trânsito do texto — avisam se vem curva, contramão ou reta.","ex":[["นอกจากนี้","nɔ̂ɔk-jàak-níi","nokchakni"],["รัฐบาล","rát-tà-baan","ratthaban"],["ยัง","yang","yang"],["ลด","lót","lot"],["ภาษี","paa-sǐi","phasi"]],"pt":"Além disso, o governo ainda reduziu impostos.","en":"Moreover, the government also cut taxes.","lv":5},{"id":"g5-03","t":"เนื่องจาก … จึง: causa e efeito","e":"เนื่องจาก + causa, (sujeito) + จึง + efeito: เนื่องจากฝนตกหนัก ถนนจึงน้ำท่วม = devido à chuva forte, as ruas alagaram. จึง vem depois do sujeito e antes do verbo. Analogia: เนื่องจาก abre a porta da causa; จึง fecha a porta da consequência.","ex":[["เนื่องจาก","nʉ̂ʉang-jàak","nueangchak"],["ฝน","fǒn","fon"],["ตก","dtòk","tok"],["ถนน","tà-nǒn","thanon"],["จึง","jʉng","chueng"],["ปิด","bpìt","pit"]],"pt":"Por causa da chuva, a rua foi fechada.","en":"Because of the rain, the road was closed.","lv":5},{"id":"g5-04","t":"ได้รับ: a passiva formal e positiva","e":"ได้รับ + verbo forma a passiva quando a coisa é boa ou neutra: ได้รับเชิญ (foi convidado), ได้รับเลือก (foi eleito), ได้รับอนุญาต (recebeu permissão). Para o que é ruim, usa-se ถูก (ถูกจับ = foi preso). Analogia: ได้รับ é receber um presente; ถูก é levar uma multa.","ex":[["เขา","kǎo","khao"],["ได้รับ","dâai-ráp","dairap"],["เลือก","lʉ̂ʉak","lueak"],["เป็น","bpen","pen"],["ผู้แทน","pûu-tɛɛn","phuthaen"]],"pt":"Ele foi eleito representante.","en":"He was elected representative.","lv":5},{"id":"g5-05","t":"ซึ่ง: o 'que' formal","e":"ซึ่ง liga uma explicação ao que veio antes, como 'o qual': ประเทศไทยซึ่งมีประชากรหกสิบล้านคน = a Tailândia, que tem sessenta milhões de habitantes. ที่ identifica ('o livro que comprei'); ซึ่ง acrescenta informação e soa mais escrito. Analogia: ซึ่ง é o par de vírgulas que abre um aposto.","ex":[["กรุงเทพฯ","grung-têep","krungthep"],["ซึ่ง","sʉ̂ng","sueng"],["เป็น","bpen","pen"],["เมืองหลวง","mʉʉang-lǔuang","mueangluang"],["มี","mii","mi"],["รถ","rót","rot"],["มาก","mâak","mak"]],"pt":"Bangkok, que é a capital, tem muitos carros.","en":"Bangkok, which is the capital, has a lot of cars.","lv":5},{"id":"g5-06","t":"โดย: por meio de, por (agente)","e":"โดย indica o meio (โดยรถไฟ = de trem), o modo (โดยเร็ว = rapidamente) ou, na passiva formal, o agente (เขียนโดย… = escrito por…). Expressões fixas: โดยเฉพาะ (especialmente), โดยตรง (diretamente), โดยทั่วไป (em geral).","ex":[["หนังสือ","nǎng-sʉ̌ʉ","nangsue"],["เล่ม","lêm","lem"],["นี้","níi","ni"],["เขียน","kǐian","khian"],["โดย","dooi","doi"],["นักข่าว","nák-kàao","nakkhao"]],"pt":"Este livro foi escrito por um jornalista.","en":"This book was written by a journalist.","lv":5},{"id":"g5-07","t":"ต่อ, แก่, แด่: 'a, para' no registro formal","e":"Para dizer a quem algo se dirige, o texto formal usa ต่อ (diante de, em relação a: แถลงต่อสื่อ = declarou à imprensa), แก่ (para alguém de status igual ou inferior: มอบรางวัลแก่นักเรียน) e แด่ (para alguém superior ou venerado: ถวายแด่พระ). Na fala, tudo isso vira ให้ ou กับ.","ex":[["รัฐบาล","rát-tà-baan","ratthaban"],["มอบ","mɔ̂ɔp","mop"],["ทุน","tun","thun"],["แก่","gɛ̀ɛ","kae"],["นักเรียน","nák-riian","nakrian"]],"pt":"O governo concedeu bolsas aos estudantes.","en":"The government granted scholarships to students.","lv":5},{"id":"g5-08","t":"ผู้ + verbo: quem faz","e":"ผู้ + verbo forma o nome de quem pratica a ação: ผู้เช่า (inquilino), ผู้ชม (espectador), ผู้บริโภค (consumidor), ผู้ป่วย (paciente), ผู้แทน (representante). Diferente de นัก (profissão ou hábito: นักข่าว) e ช่าง (ofício manual: ช่างไม้). Analogia: é o '-dor' de 'consumidor'.","ex":[["ผู้","pûu","phu"],["บริโภค","bɔɔ-rí-pôok","boriphok"],["มี","mii","mi"],["สิทธิ","sìt-tí","sitthi"],["เลือก","lʉ̂ʉak","lueak"]],"pt":"O consumidor tem o direito de escolher.","en":"Consumers have the right to choose.","lv":5},{"id":"g5-09","t":"ถึงแม้ว่า … ก็: concessão","e":"ถึงแม้ว่า (ou แม้ว่า) + fato, (sujeito) + ก็ + resultado inesperado: ถึงแม้ว่าเขาจะรวย เขาก็ไม่มีความสุข = embora seja rico, ele não é feliz. O ก็ marca que, apesar de tudo, o resultado vale. Analogia: ถึงแม้ว่า é o 'apesar da chuva'; ก็ é o 'o jogo continuou'.","ex":[["ถึงแม้ว่า","tʉ̌ng-mɛ́ɛ-wâa","thuengmaewa"],["ฝน","fǒn","fon"],["ตก","dtòk","tok"],["เขา","kǎo","khao"],["ก็","gɔ̂ɔ","ko"],["มา","maa","ma"]],"pt":"Mesmo chovendo, ele veio.","en":"Even though it rained, he came.","lv":5},{"id":"g5-10","t":"ไม่ว่า … ก็: seja qual for","e":"ไม่ว่า + palavra interrogativa, … ก็ … = não importa o quê/quem/onde: ไม่ว่าใครก็ต้องเสียภาษี = seja quem for, tem que pagar imposto; ไม่ว่าจะไปไหน เขาก็พกกล้อง = aonde quer que vá, leva a câmera.","ex":[["ไม่ว่า","mâi-wâa","maiwa"],["ใคร","krai","khrai"],["ก็","gɔ̂ɔ","ko"],["ต้อง","dtɔ̂ng","tong"],["เสีย","sǐia","sia"],["ภาษี","paa-sǐi","phasi"]],"pt":"Seja quem for, tem que pagar imposto.","en":"Whoever it is has to pay taxes.","lv":5},{"id":"g5-11","t":"ยิ่ง … ยิ่ง: quanto mais, mais","e":"ยิ่ง + A + ยิ่ง + B = quanto mais A, mais B: ยิ่งเรียนยิ่งสนุก (quanto mais estuda, mais divertido); ยิ่งเร็วยิ่งดี (quanto antes, melhor). Sozinho antes de adjetivo, ยิ่ง intensifica: ยิ่งใหญ่ (grandioso).","ex":[["ยิ่ง","yîng","ying"],["เรียน","riian","rian"],["ยิ่ง","yîng","ying"],["สนุก","sà-nùk","sanuk"]],"pt":"Quanto mais estudo, mais divertido fica.","en":"The more I study, the more fun it gets.","lv":5},{"id":"g5-12","t":"ตาม: segundo, de acordo com","e":"ตาม + fonte = de acordo com: ตามรายงาน (segundo o relatório), ตามกฎหมาย (conforme a lei), ตามที่… (conforme…). É a palavra das notícias e dos documentos. Analogia: é o 'segundo fontes' do jornal.","ex":[["ตาม","dtaam","tam"],["รายงาน","raai-ngaan","raingan"],["เศรษฐกิจ","sèet-tà-gìt","setthakit"],["ดีขึ้น","dii-kʉ̂n","dikhuen"]],"pt":"Segundo o relatório, a economia melhorou.","en":"According to the report, the economy improved.","lv":5},{"id":"g5-13","t":"Registro falado × escrito","e":"A mesma ideia muda de roupa conforme o registro: comer é กิน (comum), ทาน (educado), รับประทาน (formal); 'não' é ไม่ na fala e มิ ou มิได้ no texto solene; 'muito' é เยอะ na conversa e จำนวนมาก no relatório; 'porque' é เพราะ, e no texto formal เนื่องจาก. Analogia: é trocar a camiseta pelo terno — a pessoa é a mesma.","ex":[["กรุณา","gà-rú-naa","karuna"],["รับประทาน","ráp-bprà-taan","rapprathan"],["อาหาร","aa-hǎan","ahan"],["ก่อน","gɔ̀ɔn","kon"]],"pt":"Por favor, sirva-se antes.","en":"Please eat first (formal).","lv":5}],"6":[{"id":"g6-01","t":"ราชาศัพท์: o vocabulário da realeza","e":"Para o rei e a família real, as palavras comuns são trocadas por outras: comer é เสวย (não กิน), dormir é บรรทม, falar é ตรัส, ir é เสด็จ. Analogia: é como o 'Vossa Majestade' do português, só que o verbo inteiro também muda de roupa.","ex":[["ในหลวง","nai-lǔuang","nailuang"],["เสด็จ","sà-dèt","sadet"],["ไป","bpai","pai"],["เชียงใหม่","chiiang-mài","chiangmai"]],"pt":"O Rei foi a Chiang Mai.","en":"The King went to Chiang Mai.","lv":6},{"id":"g6-02","t":"ทรง: o prefixo que torna o verbo real","e":"ทรง antes de um verbo ou substantivo comum o transforma em ação real: ทรงงาน (o rei trabalha), ทรงดนตรี (toca música), ทรงพระสำราญ (está bem-disposto). Com verbos que já são reais (เสด็จ, ตรัส), não se usa ทรง. Analogia: ทรง é a coroa que se coloca sobre o verbo.","ex":[["พระองค์","prá-ong","phraong"],["ทรง","song","song"],["งาน","ngaan","ngan"],["หนัก","nàk","nak"],["มาก","mâak","mak"]],"pt":"Sua Majestade trabalha muito.","en":"His Majesty works very hard.","lv":6},{"id":"g6-03","t":"Falando com monges e sobre monges","e":"Os monges têm vocabulário próprio: comem com ฉัน, dormem com จำวัด, morrem com มรณภาพ; o monge diz อาตมา (eu) e chama o leigo de โยม; o leigo convida com นิมนต์ e oferece com ถวาย. Analogia: é um dialeto de respeito, como o tratamento dado a um juiz no tribunal.","ex":[["โยม","yoom","yom"],["ถวาย","tà-wǎai","thawai"],["อาหาร","aa-hǎan","ahan"],["แด่","dɛ̀ɛ","dae"],["พระสงฆ์","prá-sǒng","phrasong"]],"pt":"Os fiéis oferecem comida aos monges.","en":"Lay people offer food to the monks.","lv":6},{"id":"g6-04","t":"Morrer: o verbo muda com a pessoa","e":"A morte é dita com palavras diferentes para cada posição: ตาย (comum, cru), เสียชีวิต (neutro, notícias), ถึงแก่กรรม (respeitoso), มรณภาพ (monges), สิ้นพระชนม์ (príncipes) e สวรรคต (o rei). Escolher a palavra errada é uma gafe grave. Analogia: é um elevador — cada andar social tem sua porta.","ex":[["ผู้","pûu","phu"],["ป่วย","bpùuai","puai"],["เสียชีวิต","sǐia-chii-wít","siachiwit"],["เมื่อ","mʉ̂ʉa","muea"],["คืนนี้","kʉʉn-níi","khuenni"]],"pt":"O paciente faleceu esta noite.","en":"The patient passed away last night.","lv":6},{"id":"g6-05","t":"สำนวน: os provérbios na fala","e":"Introduz-se um provérbio com เหมือน (como), ดังสำนวนที่ว่า (como diz o ditado) ou só soltando-o no meio da frase. Muitos têm imagens rurais: ช้าง, ควาย, เสือ, น้ำ, ข้าว. Analogia: é o nosso 'quem não tem cão caça com gato' — a imagem resume a lição.","ex":[["ทำ","tam","tham"],["ความดี","kwaam-dii","khwamdi"],["แบบ","bɛ̀ɛp","baep"],["ปิดทองหลังพระ","bpìt-tɔɔng-lǎng-prá","pitthonglangphra"]],"pt":"Fazer o bem sem buscar reconhecimento.","en":"Doing good without seeking credit.","lv":6},{"id":"g6-06","t":"คำซ้อน: pares de palavras","e":"O tailandês adora juntar duas palavras de sentido parecido para soar completo e elegante: บ้านเรือน (casas), เงินทอง (riquezas), สวยงาม (belo), ซื่อสัตย์ (honesto), อ่อนแอ (fraco). Às vezes o par generaliza: ข้าวปลาอาหาร é 'comida em geral', não 'arroz e peixe'. Analogia: são como 'são e salvo' ou 'eira nem beira' — dois que valem por um.","ex":[["เขา","kǎo","khao"],["เป็น","bpen","pen"],["คน","kon","khon"],["ซื่อสัตย์","sʉ̂ʉ-sàt","suesat"]],"pt":"Ele é uma pessoa honesta.","en":"He is an honest person.","lv":6},{"id":"g6-07","t":"Pronomes de hierarquia","e":"O 'eu' e o 'você' mudam com o status: กระผม (eu, homem, muito respeitoso), ข้าพเจ้า (eu, em discursos e textos formais), ท่าน (o senhor, a senhora, a quem se deve respeito), เขา (ele) × ท่าน (ele, alguém superior). Analogia: é o 'Vossa Senhoria' dos ofícios brasileiros.","ex":[["ข้าพเจ้า","kâa-pá-jâo","khaphachao"],["ขอ","kɔ̌ɔ","kho"],["ขอบคุณ","kɔ̀ɔp-kun","khopkhun"],["ทุก","túk","thuk"],["ท่าน","tâan","than"]],"pt":"Eu agradeço a todos os senhores.","en":"I thank all of you.","lv":6},{"id":"g6-08","t":"ถึงกับ: a ponto de","e":"ถึงกับ + verbo mostra que algo chegou a um extremo surpreendente: เขาดีใจถึงกับร้องไห้ = ficou tão feliz que chegou a chorar. Analogia: é o 'chegou ao ponto de' do português.","ex":[["เขา","kǎo","khao"],["ดีใจ","dii-jai","dichai"],["ถึงกับ","tʉ̌ng-gàp","thuengkap"],["ร้องไห้","rɔ́ɔng-hâi","ronghai"]],"pt":"Ele ficou tão feliz que chegou a chorar.","en":"He was so happy he cried.","lv":6},{"id":"g6-09","t":"Partículas finais: o tom da conversa","e":"As partículas dão a atitude: นะ (suaviza, pede atenção), สิ (incentiva, 'vai!'), ละ/ล่ะ (e então?, devolve a pergunta), หรอก (suaviza a negação), เถอะ (convite: 'vamos'), น่ะ (explica, 'é que…'), เหรอ (surpresa, 'é mesmo?'). Analogia: são os emojis da fala — o texto é o mesmo, a intenção muda.","ex":[["ไป","bpai","pai"],["กัน","gan","kan"],["เถอะ","tə̀","thoe"]],"pt":"Vamos lá!","en":"Let's go!","lv":6},{"id":"g6-10","t":"Linguagem jurídica: มิได้, หาก, อนึ่ง","e":"O texto legal e oficial usa formas antigas: มิได้ e มิ no lugar de ไม่ได้/ไม่ (ผู้ใดมิได้ปฏิบัติตาม = quem não cumprir); หาก ou หากว่า no lugar de ถ้า; อนึ่ง ('outrossim') para acrescentar; ทั้งนี้ ('ressalvado que'). Analogia: é o 'outrossim' e o 'doravante' dos contratos brasileiros.","ex":[["หาก","hàak","hak"],["ผู้","pûu","phu"],["เช่า","châo","chao"],["มิได้","mí-dâai","midai"],["จ่าย","jàai","chai"],["ค่าเช่า","kâa-châo","khachao"]],"pt":"Caso o locatário não pague o aluguel.","en":"Should the tenant fail to pay the rent.","lv":6},{"id":"g6-11","t":"Diplomacia: suavizar e propor","e":"Na linguagem diplomática e de negócios, evita-se o 'não' direto: ขอ (peço licença para), เห็นควร (considera-se conveniente), อาจจะ (talvez), ขอรับไว้พิจารณา (vamos considerar — que muitas vezes quer dizer 'não'). Analogia: é a luva de veludo — a mão é a mesma, o toque é macio.","ex":[["ทาง","taang","thang"],["เรา","rao","rao"],["ขอ","kɔ̌ɔ","kho"],["รับ","ráp","rap"],["ไว้","wái","wai"],["พิจารณา","pí-jaa-rá-naa","phicharana"]],"pt":"Vamos levar o assunto em consideração.","en":"We will take it under consideration.","lv":6},{"id":"g6-12","t":"Retórica escrita: ถือว่า, นับว่า, กล่าวได้ว่า","e":"Para avaliar e concluir num texto: ถือว่า (considera-se que), นับว่า (pode-se dizer que, conta como), กล่าวได้ว่า (pode-se afirmar que), เป็นที่ทราบกันดีว่า (é sabido que). Analogia: são os degraus que levam o leitor até a conclusão.","ex":[["นับว่า","náp-wâa","napwa"],["เป็น","bpen","pen"],["ข่าวดี","kàao-dii","khaodi"],["สำหรับ","sǎm-ràp","samrap"],["ประชาชน","bprà-chaa-chon","prachachon"]],"pt":"Pode-se dizer que é uma boa notícia para o povo.","en":"It can be considered good news for the people.","lv":6}]},"gItems":[{"id":"g1-01g1","lv":1,"pt_id":"g1-01","s":[["เขา","kǎo","khao"],["___","",""],["ภาษาไทย","paa-sǎa-tai","phasathai"]],"h":"","o":[["พูด","pûut","phut"],["กิน","gin","kin"],["นอน","nɔɔn","non"],["ไกล","glai","klai"]],"a":"พูด","x":"พูด (falar) é o verbo que combina com ภาษาไทย (língua tailandesa)."},{"id":"g1-01g2","lv":1,"pt_id":"g1-01","s":[["แม่","mɛ̂ɛ","mae"],["___","",""],["กาแฟ","gaa-fɛɛ","kafae"]],"h":"","o":[["ดื่ม","dʉ̀ʉm","duem"],["เดิน","dəən","doen"],["สูง","sǔung","sung"],["ฟัง","fang","fang"]],"a":"ดื่ม","x":"ดื่ม (beber) + กาแฟ (café)."},{"id":"g1-02g1","lv":1,"pt_id":"g1-02","s":[["ขอบคุณ","kɔ̀ɔp-kun","khopkhun"],["___","",""]],"h":"Uma mulher agradece.","o":[["ค่ะ","kâ","kha"],["คะ","ká","kha"],["ไหม","mǎi","mai"],["ไม่","mâi","mai"]],"a":"ค่ะ","x":"Mulher, afirmação: ค่ะ (tom descendente)."},{"id":"g1-02g2","lv":1,"pt_id":"g1-02","s":[["คุณ","kun","khun"],["ชื่อ","chʉ̂ʉ","chue"],["อะไร","à-rai","arai"],["___","",""]],"h":"Uma mulher pergunta.","o":[["คะ","ká","kha"],["ค่ะ","kâ","kha"],["แล้ว","lɛ́ɛo","laeo"],["จะ","jà"," s","en":"Pronouns"},"e":{"pt":"ผม é 'eu' só para homens; ดิฉัน é 'eu' para mulheres; คุณ é o 'você' polido; เขา serve para ele, ela ou eles (só pessoas). Analogia: o pronome 'eu' já vem com crachá de gênero.","en":"ผม 'I' is used by men; ดิฉัน by women; คุณ is polite 'you'; เขา covers he, she and they (people only)."}},{"t":{"pt":"O verbo não muda","en":"Verbs don't change"},"e":{"pt":"สบายดี (estar bem) serve para estou, está, estamos: o sujeito vem antes e o verbo fica igual.","en":"สบายดี works for am, is, are: the subject comes first and the verb stays the same."},"ex":[["ผม","pǒm","phom"],["สบายดี","sà-baai-dii","sabaidi"]]},{"t":{"pt":"Perguntas com palavra final","en":"Questions with a final word"},"e":{"pt":"Uma afirmação vira pergunta com uma palavra no fim. หรือ pede confirmação ('é mesmo?'); ล่ะ devolve a pergunta ('e você?'). Analogia: a palavra final é o ponto de interrogação falado.","en":"A statement becomes a question with a final word. หรือ asks for confirmation; ล่ะ turns the question back ('and you?')."},"ex":[["คุณ","kun","khun"],["สบายดี","sà-baai-dii","sabaidi"],["หรือ","rʉ̌ʉ","rue"]]}],"paginas":"vol. 1, p. 1–6"},"2":{"n":2,"titulo":{"pt":"Descobrindo o nome de alguém","en":"Finding out someone's name"},"dialogo":[{"sp":"A","s":[["สวัสดี","sà-wàt-dii","sawatdi"],["ครับ","kráp","khrap"]],"fsi":"sawàtdii khráp","en":"Hello.","pt":"Olá."},{"sp":"A","s":[["ผม","pǒm","phom"],["ชื่อ","chʉ̂ʉ","chue"],["ประภาส","bprà-pâat","praphat"]],"fsi":"phǒm chʉ̂ʉ praphâat","en":"My name is Prabas.","pt":"Meu nome é Prabas."},{"sp":"A","s":[["ขอโทษ","kɔ̌ɔ-tôot","khothot"],["คุณ","kun","khun"],["ชื่อ","chʉ̂ʉ","chue"],["อะไร","à-rai","arai"],["ครับ","kráp","khrap"]],"fsi":"khɔ̌ɔthôot, khun chʉ̂ʉ ʔaraj khráp","en":"Excuse me. What's your name?","pt":"Com licença. Como você se chama?"},{"sp":"B","s":[["ผม","pǒm","phom"],["ชื่อ","chʉ̂ʉ","chue"],["จอห์น","jɔɔn","chon"],["ครับ","kráp","khrap"]],"fsi":"phǒm chʉ̂ʉ coon khráp","en":"My name's John.","pt":"Meu nome é John."},{"sp":"A","s":[["ขอโทษ","kɔ̌ɔ-tôot","khothot"],["คุณ","kun","khun"],["ชื่อ","chʉ̂ʉ","chue"],["อะไร","à-rai","arai"],["นะ","ná","na"],["ครับ","kráp","khrap"]],"fsi":"khɔ̌ɔthôot, khun chʉ̂ʉ ʔaraj ná khráp","en":"Excuse me. What's your name (again)?","pt":"Desculpe, qual é mesmo o seu nome?"},{"sp":"A","s":[["กรุณา","gà-rú-naa","karuna"],["พูด","pûut","phut"],["อีกที","ìik-tii","ikthi"],["ได้","dâai","dai"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"karunaa phûut ʔìik thii, dâj máj khráp","en":"Could you please repeat that?","pt":"Poderia repetir, por favor?"},{"sp":"B","s":[["ขอโทษ","kɔ̌ɔ-tôot","khothot"],["คุณ","kun","khun"],["ประภาส","bprà-pâat","praphat"],["นามสกุล","naam-sà-gun","namsakun"],["อะไร","à-rai","arai"],["ครับ","kráp","khrap"]],"fsi":"khɔ̌ɔthôot, khun praphâat naamsakun ʔaraj khráp","en":"Excuse me, Mr. Prabas what? (family name)","pt":"Com licença, senhor Prabas de quê? (sobrenome)"},{"sp":"A","s":[["ผม","pǒm","phom"],["นามสกุล","naam-sà-gun","namsakun"],["รักไทย","rák-tai","rakthai"],["ครับ","kráp","khrap"]],"fsi":"phǒm naamsakun rákthaj khráp","en":"My family name's Rakthai.","pt":"Meu sobrenome é Rakthai."},{"sp":"A","s":[["คุณ","kun","khun"],["จอห์น","jɔɔn","chon"],["นามสกุล","naam-sà-gun","namsakun"],["สมิธ","sà-mít","samit"],["ใช่","châi","chai"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"khun coon naamsakun samít, châj máj khráp","en":"Mr. John, your family name is Smith, isn't it?","pt":"Senhor John, seu sobrenome é Smith, não é?"},{"sp":"B","s":[["ไม่","mâi","mai"],["ใช่","châi","chai"],["ครับ","kráp","khrap"]],"fsi":"mâj châj khráp","en":"No, it isn't.","pt":"Não é."},{"sp":"B","s":[["ผม","pǒm","phom"],["นามสกุล","naam-sà-gun","namsakun"],["บราวน์","braao","brao"]],"fsi":"phǒm naamsakun braaw","en":"My family name's Brown.","pt":"Meu sobrenome é Brown."},{"sp":"A","s":[["จอห์น","jɔɔn","chon"],["บราวน์","braao","brao"],["หรือ","rʉ̌ʉ","rue"],["ครับ","kráp","khrap"]],"fsi":"coon braaw rʉ̌ʉ khráp","en":"John Brown, huh?","pt":"John Brown, é?"}],"notas":[{"t":{"pt":"ชื่อ é o primeiro nome","en":"ชื่อ is the given name"},"e":{"pt":"Na Tailândia as pessoas são chamadas pelo primeiro nome, com คุณ antes: คุณประภาส. O sobrenome é นามสกุล. Analogia: é como no Brasil chamar o médico de 'doutor Pedro', não 'doutor Milken'.","en":"Thais are addressed by their given name with คุณ before it. The family name is นามสกุล."},"ex":[["คุณ","kun","khun"],["ประภาส","bprà-pâat","praphat"]]},{"t":{"pt":"อะไร fica no lugar da resposta","en":"อะไร sits where the answer goes"},"e":{"pt":"Pergunta: คุณชื่ออะไร. Resposta: ผมชื่อจอห์น. A palavra interrogativa ocupa a posição da informação que falta.","en":"Question: คุณชื่ออะไร. Answer: ผมชื่อจอห์น. The question word takes the slot of the missing information."},"ex":[["คุณ","kun","khun"],["ชื่อ","chʉ̂ʉ","chue"],["อะไร","à-rai","arai"]]},{"t":{"pt":"Sim e não: ใช่ / ไม่ใช่ / เปล่า","en":"Yes and no"},"e":{"pt":"ใช่ไหม no fim pede confirmação ('não é?'). Responde-se ใช่ (é) ou ไม่ใช่ (não é); เปล่า nega com mais força. Analogia: ใช่ไหม é estender a mão esperando um 'toca aqui'.","en":"ใช่ไหม asks 'isn't it?'. Answer ใช่ (yes) or ไม่ใช่ (no); เปล่า denies more strongly."}},{"t":{"pt":"Pedidos com กรุณา ... ได้ไหม","en":"Requests: กรุณา ... ได้ไหม"},"e":{"pt":"กรุณา abre um pedido polido e ได้ไหม no fim pergunta se a pessoa pode fazê-lo. Analogia: é o 'poderia ..., por favor?' em duas peças, uma em cada ponta da frase.","en":"กรุณา opens a polite request and ได้ไหม at the end asks whether the person can do it."}}],"paginas":"vol. 1, p. 7–19"},"3":{"n":3,"titulo":{"pt":"Identificando objetos","en":"Identifying objects"},"dialogo":[{"sp":"A","s":[["คุณ","kun","khun"],["มี","mii","mi"],["แผนที่","pɛ̌ɛn-tîi","phaenthi"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"khun mii phɛ̌ɛnthîi máj khráp","en":"Do you have a map?","pt":"Você tem um mapa?"},{"sp":"B","s":[["มี","mii","mi"],["ครับ","kráp","khrap"]],"fsi":"mii khráp","en":"I do.","pt":"Tenho."},{"sp":"A","s":[["ดี","dii","di"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"dii máj khráp","en":"Is it good?","pt":"É bom?"},{"sp":"B","s":[["ดี","dii","di"],["ครับ","kráp","khrap"]],"fsi":"dii khráp","en":"It's good.","pt":"É bom."},{"sp":"A","s":[["นี่","nîi","ni"],["อะไร","à-rai","arai"],["ครับ","kráp","khrap"]],"fsi":"nîi ʔaraj khráp","en":"What's this?","pt":"O que é isto?"},{"sp":"B","s":[["นั่น","nân","nan"],["รูป","rûup","rup"],["ครับ","kráp","khrap"]],"fsi":"nân rûup khráp","en":"That's a picture.","pt":"Isso é uma figura."},{"sp":"A","s":[["รูป","rûup","rup"],["อะไร","à-rai","arai"],["ครับ","kráp","khrap"]],"fsi":"rûup ʔaraj khráp","en":"A picture of what?","pt":"Figura de quê?"},{"sp":"B","s":[["รูป","rûup","rup"],["วัด","wát","wat"],["ครับ","kráp","khrap"]],"fsi":"rûup wát khráp","en":"A picture of a temple.","pt":"De um templo."},{"sp":"A","s":[["สวย","sǔuai","suai"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"sǔaj máj khráp","en":"Is it pretty?","pt":"É bonita?"},{"sp":"B","s":[["สวย","sǔuai","suai"],["ครับ","kráp","khrap"]],"fsi":"sǔaj khráp","en":"It's pretty.","pt":"É bonita."},{"sp":"A","s":[["แล้ว","lɛ́ɛo","laeo"],["นี่","nîi","ni"],["เรียกว่า","rîiak-wâa","riakwa"],["อะไร","à-rai","arai"],["ครับ","kráp","khrap"]],"fsi":"lɛ́ɛw nîi rîak wâa ʔaraj khráp","en":"And what's this called?","pt":"E isto, como se chama?"},{"sp":"B","s":[["เรียกว่า","rîiak-wâa","riakwa"],["หน้าต่าง","nâa-dtàang","natang"],["ครับ","kráp","khrap"]],"fsi":"rîak wâa nâatàaŋ khráp","en":"It's called a 'window'.","pt":"Chama-se 'janela'."},{"sp":"A","s":[["ขอโทษ","kɔ̌ɔ-tôot","khothot"],["อย่า","yàa","ya"],["เปิด","bpə̀ət","poet"],["หน้าต่าง","nâa-dtàang","natang"],["ครับ","kráp","khrap"]],"fsi":"khɔ̌ɔthôot, jàa pə̀ət nâatàaŋ khráp","en":"Excuse me. Don't open the window.","pt":"Com licença. Não abra a janela."},{"sp":"B","s":[["ขอโทษ","kɔ̌ɔ-tôot","khothot"],["คุณ","kun","khun"],["พูด","pûut","phut"],["ว่า","wâa","wa"],["อะไร","à-rai","arai"],["ครับ","kráp","khrap"]],"fsi":"khɔ̌ɔthôot, khun phûut wâa ʔaraj khráp","en":"Excuse me. What did you say?","pt":"Desculpe, o que você disse?"},{"sp":"B","s":[["ผม","pǒm","phom"],["ไม่","mâi","mai"],["เข้าใจ","kâo-jai","khaochai"]],"fsi":"phǒm mâj khâwcaj","en":"I didn't understand.","pt":"Não entendi."},{"sp":"B","s":[["กรุณา","gà-rú-naa","karuna"],["พูด","pûut","phut"],["ช้าๆ","cháa-cháa","chacha"],["หน่อย","nɔ̀i","noi"],["ได้","dâai","dai"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"karunaa phûut cháa cháa nɔ̀j, dâj máj khráp","en":"Could you please speak slowly?","pt":"Poderia falar devagar, por favor?"},{"sp":"A","s":[["ผม","pǒm","phom"],["พูด","pûut","phut"],["ว่า","wâa","wa"],["อย่า","yàa","ya"],["เปิด","bpə̀ət","poet"],["หน้าต่าง","nâa-dtàang","natang"]],"fsi":"phǒm phûut wâa jàa pə̀ət nâatàaŋ","en":"I said, 'Don't open the window.'","pt":"Eu disse: 'Não abra a janela.'"}],"notas":[{"t":{"pt":"นี่, นั่น, โน่น: perto, meio e longe","en":"นี่, นั่น, โน่น: near, middle, far"},"e":{"pt":"นี่ = isto (perto de quem fala); นั่น = isso (perto de quem ouve ou já mencionado); โน่น = aquilo lá longe. Sem verbo 'ser': นี่อะไร = 'isto o quê?'. Analogia: três degraus de distância, como 'aqui, aí, lá'.","en":"นี่ this (near the speaker), นั่น that (near the listener), โน่น that over there. No verb 'to be': นี่อะไร."},"ex":[["นี่","nîi","ni"],["อะไร","à-rai","arai"]]},{"t":{"pt":"Adjetivo é verbo","en":"Adjectives are verbs"},"e":{"pt":"สวย (bonito) e ดี (bom) funcionam como verbos: สวยไหม = 'está bonito?'; resposta: สวย. Sem 'ser'.","en":"สวย and ดี behave like verbs: สวยไหม 'is it pretty?'; answer สวย."},"ex":[["สวย","sǔuai","suai"],["ไหม","mǎi","mai"]]},{"t":{"pt":"Negação ไม่ e proibição อย่า","en":"Negation ไม่ and prohibition อย่า"},"e":{"pt":"ไม่ nega o verbo (ไม่เข้าใจ = não entendo); อย่า proíbe (อย่าเปิด = não abra). หน่อย no fim suaviza o pedido. Analogia: ไม่ é uma constatação, อย่า é uma placa de 'proibido'.","en":"ไม่ negates (ไม่เข้าใจ); อย่า forbids (อย่าเปิด). หน่อย softens a request."
