},"ex":[["อย่า","yàa","ya"],["เปิด","bpə̀ət","poet"],["หน้าต่าง","nâa-dtàang","natang"]]},{"t":{"pt":"เรียกว่า: como se chama","en":"เรียกว่า: what it's called"},"e":{"pt":"X เรียกว่า Y = 'X se chama Y'. Use para perguntar o nome tailandês de qualquer coisa: นี่เรียกว่าอะไร.","en":"X เรียกว่า Y = X is called Y. Ask the Thai name of anything with นี่เรียกว่าอะไร."},"ex":[["นี่","nîi","ni"],["เรียกว่า","rîiak-wâa","riakwa"],["อะไร","à-rai","arai"]]}],"paginas":"vol. 1, p. 20–34"},"4":{"n":4,"titulo":{"pt":"Identificando pessoas e a posse dos objetos","en":"Establishing identity and ownership of objects"},"dialogo":[{"sp":"A","s":[["ช่วย","chûuai","chuai"],["ส่ง","sòng","song"],["หนังสือ","nǎng-sʉ̌ʉ","nangsue"],["เล่ม","lêm","lem"],["นั่น","nân","nan"],["ให้","hâi","hai"],["ผม","pǒm","phom"],["หน่อย","nɔ̀i","noi"],["ได้","dâai","dai"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"chûaj sòŋ naŋsʉ̌ʉ lêem nân hâj phǒm nɔ̀j, dâj máj khráp","en":"Could you hand me that book?","pt":"Você poderia me passar aquele livro?"},{"sp":"B","s":[["ได้","dâai","dai"],["ครับ","kráp","khrap"]],"fsi":"dâj khráp","en":"Yes.","pt":"Claro."},{"sp":"B","s":[["หนังสือ","nǎng-sʉ̌ʉ","nangsue"],["เล่ม","lêm","lem"],["นี่","nîi","ni"],["ดี","dii","di"]],"fsi":"naŋsʉ̌ʉ lêem nîi dii","en":"This book is good.","pt":"Este livro é bom."},{"sp":"B","s":[["ของ","kɔ̌ɔng","khong"],["ใคร","krai","khrai"],["ครับ","kráp","khrap"]],"fsi":"khɔ̌ɔŋ khraj khráp","en":"Whose is it?","pt":"É de quem?"},{"sp":"A","s":[["ของ","kɔ̌ɔng","khong"],["เพื่อน","pʉ̂ʉan","phuean"],["ผม","pǒm","phom"],["ครับ","kráp","khrap"]],"fsi":"khɔ̌ɔŋ phʉ̂an phǒm khráp","en":"A friend of mine.","pt":"De um amigo meu."},{"sp":"B","s":[["เพื่อน","pʉ̂ʉan","phuean"],["คุณ","kun","khun"],["ชื่อ","chʉ̂ʉ","chue"],["อะไร","à-rai","arai"],["ครับ","kráp","khrap"]],"fsi":"phʉ̂an khun chʉ̂ʉ ʔaraj khráp","en":"What's your friend's name?","pt":"Como se chama o seu amigo?"},{"sp":"A","s":[["เขา","kǎo","khao"],["ชื่อ","chʉ̂ʉ","chue"],["จอห์น","jɔɔn","chon"],["ครับ","kráp","khrap"]],"fsi":"kháw chʉ̂ʉ coon khráp","en":"His name's John.","pt":"O nome dele é John."},{"sp":"B","s":[["คน","kon","khon"],["ไหน","nǎi","nai"],["ชื่อ","chʉ̂ʉ","chue"],["จอห์น","jɔɔn","chon"],["ครับ","kráp","khrap"]],"fsi":"khon nǎj chʉ̂ʉ coon khráp","en":"Which person is named John?","pt":"Qual pessoa se chama John?"},{"sp":"A","s":[["คน","kon","khon"],["โน่น","nôon","non"],["ครับ","kráp","khrap"]],"fsi":"khon nôon khráp","en":"That person over there.","pt":"Aquela pessoa lá."},{"sp":"B","s":[["แล้ว","lɛ́ɛo","laeo"],["นั่น","nân","nan"],["ใคร","krai","khrai"],["ครับ","kráp","khrap"]],"fsi":"lɛ́ɛw nân khraj khráp","en":"Then who's (that) there?","pt":"E aquele ali, quem é?"},{"sp":"A","s":[["ผู้หญิง","pûu-yǐng","phuying"],["หรือ","rʉ̌ʉ","rue"],["ผู้ชาย","pûu-chaai","phuchai"],["ครับ","kráp","khrap"]],"fsi":"phûujǐŋ rʉ̌ʉ phûuchaaj khráp","en":"The woman or the man?","pt":"A mulher ou o homem?"},{"sp":"B","s":[["ผู้ชาย","pûu-chaai","phuchai"],["ครับ","kráp","khrap"]],"fsi":"phûuchaaj khráp","en":"The man.","pt":"O homem."},{"sp":"A","s":[["นั่น","nân","nan"],["นักเรียน","nák-riian","nakrian"],["ครับ","kráp","khrap"]],"fsi":"nân nákrian khráp","en":"That's a student.","pt":"Aquele ali é um aluno."},{"sp":"B","s":[["คุณ","kun","khun"],["รู้จัก","rúu-jàk","ruchak"],["เขา","kǎo","khao"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"khun rúucàk kháw máj khráp","en":"Do you know him?","pt":"Você conhece ele?"},{"sp":"A","s":[["รู้จัก","rúu-jàk","ruchak"],["ครับ","kráp","khrap"]],"fsi":"rúucàk khráp","en":"Yes, I do.","pt":"Conheço."},{"sp":"B","s":[["เขา","kǎo","khao"],["เป็น","bpen","pen"],["ใคร","krai","khrai"],["ครับ","kráp","khrap"]],"fsi":"kháw pen khraj khráp","en":"Who is he?","pt":"Quem é ele?"},{"sp":"A","s":[["เขา","kǎo","khao"],["เป็น","bpen","pen"],["เพื่อน","pʉ̂ʉan","phuean"],["ผม","pǒm","phom"],["ครับ","kráp","khrap"]],"fsi":"kháw pen phʉ̂an phǒm khráp","en":"He's my friend.","pt":"Ele é meu amigo."}],"notas":[{"t":{"pt":"Classificadores: contar e apontar","en":"Classifiers: counting and pointing"},"e":{"pt":"Para dizer quantos, o tailandês usa substantivo + número + classificador: หนังสือสองเล่ม ('livro dois [volume]'), นักเรียนสองคน, เก้าอี้สองตัว. Para tirar um item de um grupo, usa substantivo + classificador + determinante: เพื่อนคนนั้น ('aquele amigo'), สมุดเล่มนี้ ('este caderno'), ปากกาด้ามไหน ('qual caneta?'). O classificador vem sempre depois do número, nunca antes — pense nele como a unidade de medida de 'dois litros', não como um artigo.","en":"Counting: noun + number + classifier (หนังสือสองเล่ม, นักเรียนสองคน). Picking one out: noun + classifier + determiner (เพื่อนคนนั้น, สมุดเล่มนี้, ปากกาด้ามไหน)."},"ex":[["หนังสือ","nǎng-sʉ̌ʉ","nangsue"],["สอง","sɔ̌ɔng","song"],["เล่ม","lêm","lem"]]},{"t":{"pt":"Qual classificador usar?","en":"Which classifier to use?"},"e":{"pt":"São uns 200 classificadores e quase nunca há pista lógica: cada um serve para muitos substantivos de sentidos bem diferentes, então é preciso aprender o classificador junto com a palavra. Alguns poucos são previsíveis: คน para pessoas e profissões, ตัว para animais e coisas com braços ou pés, แผ่น para objetos planos, ใบ para recipientes e folhas, แท่ง para coisas em barra.","en":"About 200 classifiers, learned word by word; only a few are predictable: คน people, ตัว animals and legged objects, แผ่น flat things, ใบ containers, แท่ง sticks."},"ex":[["ปากกา","bpàak-gaa","pakka"],["ด้าม","dâam","dam"],["ไหน","nǎi","nai"]]},{"t":{"pt":"O classificador no lugar do substantivo","en":"The classifier standing in for the noun"},"e":{"pt":"Depois que o substantivo já foi mencionado, o classificador assume o lugar dele na frase seguinte: นี่หนังสือสองเล่ม เล่มไหนของคุณ ('aqui estão dois livros; qual é o seu?'). Ele também pode levar só um número, como em มีสองเล่ม ('tenho dois'). Mas nunca aparece sozinho: precisa de um número antes ou de um determinante depois, como um pronome que só funciona colado num demonstrativo.","en":"Once the noun is known, the classifier alone replaces it (เล่มไหนของคุณ 'which one is yours?'), but only with a number before it or a determiner after it."},"ex":[["เล่ม","lêm","lem"],["ไหน","nǎi","nai"],["ของ","kɔ̌ɔng","khong"],["คุณ","kun","khun"]]},{"t":{"pt":"ของ marca a posse","en":"ของ marks possession"},"e":{"pt":"ของ ('de') fica entre a coisa possuída e o dono: หนังสือของเขา ('o livro dele'). Quando o substantivo está presente, o ของ é opcional — หนังสือเขา diz o mesmo. Quando o substantivo some, ele passa a ser obrigatório, porque ของเขา sozinho já significa 'o dele'. A ordem é sempre coisa + ของ + dono, o contrário do nosso 'de'.","en":"ของ 'of, belonging to' sits between the thing owned and the owner: หนังสือของเขา. Optional when the noun is present (หนังสือเขา), obligatory when it is dropped (ของเขา = 'his')."},"ex":[["หนังสือ","nǎng-sʉ̌ʉ","nangsue"],["ของ","kɔ̌ɔng","khong"],["เขา","kǎo","khao"]]},{"t":{"pt":"ใคร ocupa o lugar da resposta","en":"ใคร takes the slot of the answer"},"e":{"pt":"quem ('quem') funciona como อะไร da lição 2: fica exatamente na posição da informação que falta. เขาเป็นใคร ('ele é quem?') se responde com เขาเป็นเพื่อนผม; คุณจอห์นเป็นใคร ('o que é o John?') se responde com คุณจอห์นเป็นครูผม. Quando o verbo principal é เป็น, o ใคร costuma ir para o predicado, no fim da frase, e pode valer tanto por 'quem' quanto por 'o que'.","en":"ใคร, like อะไร, sits where the answer goes: เขาเป็นใคร 'who is he?', คุณจอห์นเป็นใคร 'what is John?'. With เป็น it normally appears in the predicate and may mean 'what'."},"ex":[["เขา","kǎo","khao"],["เป็น","bpen","pen"],["ใคร","krai","khrai"]]},{"t":{"pt":"'Ser' tem três formatos","en":"'To be' has three shapes"},"e":{"pt":"O verbo 'ser' muda conforme o que vem depois dele. Para apontar e identificar, o tailandês dispensa verbo: นี่เพื่อนเขา ('este é o amigo dele'). Para categoria ou profissão, usa เป็น: คุณจอห์นเป็นครูผม ('o John é meu professor'). Para nome, usa ชื่อ: เขาชื่อจอห์น ('ele se chama John'). Regra prática: เป็น para o que a pessoa é, ชื่อ para como ela se chama.","en":"'To be' splits three ways: no copula when pointing (นี่เพื่อนเขา), เป็น for roles and categories (คุณจอห์นเป็นครูผม), and ชื่อ for names (เขาชื่อจอห์น)."},"ex":[["เขา","kǎo","khao"],["ชื่อ","chʉ̂ʉ","chue"],["จอห์น","jɔɔn","chon"]]}],"paginas":"vol. 1, p. 35–51"},"5":{"n":5,"titulo":{"pt":"Cumprimentos, apresentações e despedidas","en":"Social formulae"},"dialogo":[{"sp":"A","s":[["สวัสดี","sà-wàt-dii","sawatdi"],["ครับ","kráp","khrap"],["คุณ","kun","khun"],["ปรีชา","bprii-chaa","pricha"]],"fsi":"sawàtdii khráp, khun priichaa","en":"Hello, Pricha.","pt":"Olá, Pricha."},{"sp":"B","s":[["สวัสดี","sà-wàt-dii","sawatdi"],["ครับ","kráp","khrap"],["คุณ","kun","khun"],["สมศักดิ์","sǒm-sàk","somsak"]],"fsi":"sawàtdii khráp, khun sǒmsàk","en":"Hello, Somsak.","pt":"Olá, Somsak."},{"sp":"B","s":[["เป็น","bpen","pen"],["ยังไง","yang-ngai","yangngai"],["บ้าง","bâang","bang"],["ครับ","kráp","khrap"]],"fsi":"pen jaŋŋaj bâaŋ khráp","en":"How are you?","pt":"Como você vai?"},{"sp":"A","s":[["ก็","gɔ̂ɔ","ko"],["เรื่อยๆ","rʉ̂ai-rʉ̂ai","rueairueai"],["ครับ","kráp","khrap"]],"fsi":"kɔ̂ɔ rʉ̂aj rʉ̂aj khráp","en":"O.K. (so, so)","pt":"Vai indo, assim-assim."},{"sp":"B","s":[["โอ","oo","o"],["คุณ","kun","khun"],["ปรีชา","bprii-chaa","pricha"],["ครับ","kráp","khrap"]],"fsi":"ʔoo, khun priichaa khráp","en":"Oh, Prichaa","pt":"Ah, Pricha!"},{"sp":"B","s":[["นี่","nîi","ni"],["คุณ","kun","khun"],["จอห์น","jɔɔn","chon"]],"fsi":"nîi khun coon","en":"This is John.","pt":"Este é o John."},{"sp":"B","s":[["นั่น","nân","nan"],["คุณ","kun","khun"],["แมรี่","mɛ̂ɛ-rîi","maeri"]],"fsi":"nân khun mɛ̂ɛrîi","en":"That's Mary.","pt":"Aquela é a Mary."},{"sp":"B","s":[["ภรรยา","pan-rá-yaa","phanraya"],["คุณ","kun","khun"],["จอห์น","jɔɔn","chon"]],"fsi":"phanrájaa khun coon","en":"John's wife.","pt":"A esposa do John."},{"sp":"A","s":[["สวัสดี","sà-wàt-dii","sawatdi"],["ครับ","kráp","khrap"]],"fsi":"sawàtdii khráp","en":"Hello.","pt":"Olá."},{"sp":"J","s":[["สวัสดี","sà-wàt-dii","sawatdi"],["ครับ","kráp","khrap"]],"fsi":"sawàtdii khráp","en":"Hello.","pt":"Olá."},{"sp":"M","s":[["สวัสดี","sà-wàt-dii","sawatdi"],["ค่ะ","kâ","kha"]],"fsi":"sawàtdii khâ","en":"Hello.","pt":"Olá."},{"sp":"A","s":[["ขอโทษ","kɔ̌ɔ-tôot","khothot"],["ผม","pǒm","phom"],["ไป","bpai","pai"],["ก่อน","gɔ̀ɔn","kon"],["นะ","ná","na"],["ครับ","kráp","khrap"]],"fsi":"khɔ̌ɔthôot, phǒm paj kɔ̀ɔn ná khráp","en":"Excuse me, I must go.","pt":"Com licença, preciso ir andando."},{"sp":"B","s":[["เชิญ","chəən","choen"],["ครับ","kráp","khrap"],["พบ","póp","phop"],["กัน","gan","kan"],["ใหม่","mài","mai"],["ครับ","kráp","khrap"]],"fsi":"chəən khráp, phóp kan màj khráp","en":"All right, I'll see you again.","pt":"Claro. Até a próxima!"}],"notas":[{"t":{"pt":"Quem cumprimenta quem: status e idade","en":"Who greets whom: status and age"},"e":{"pt":"A forma do cumprimento depende do status e da idade dos dois lados, que o livro divide em três grupos: iguais, superiores e inferiores. 'Inferior' é quem tem status menor, ou o mesmo status e menos idade; dentro de cada grupo ainda há o registro formal e o informal. O detalhe prático para um estrangeiro: na Tailândia o seu status costuma ser alto sem que você perceba, pela idade ou pelo cargo. Use as formas de 'iguais' com a maioria das pessoas que encontrar no trabalho e reserve as de 'inferior para superior' para autoridades mais graduadas.","en":"Greeting forms depend on the status and age of both speakers — equals, superiors, inferiors — and each group has a formal and an informal register. A foreigner in Thailand usually ranks high without realizing it, so use the 'equals' forms most of the time."}},{"t":{"pt":"Entre iguais: formal e informal","en":"Between equals: formal and informal"},"e":{"pt":"No registro formal os dois lados dizem exatamente o mesmo, สวัสดีครับ ou สวัสดีค่ะ, e a conversa pode seguir como na lição 1. Entre íntimos a primeira sílaba cai: (สะ)วัดดีครับ. A pergunta do dia a dia é เป็นยังไงบ้างครับ ('como vai?'), com três respostas prontas: ก็เรื่อย ๆ ('assim-assim'), แย่ ('péssimo') ou uma pergunta de volta, ไปไหนครับ ('aonde vai?') e ไปไหนมา ('de onde vem?'), respondidas com ไปเที่ยว ('a passeio') ou ไปธุระ ('a trabalho').","en":"Formal: both sides say สวัสดีครับ/ค่ะ. Intimates drop the first syllable: (สะ)วัดดีครับ. The everyday question เป็นยังไงบ้างครับ has three ready answers — ก็เรื่อย ๆ, แย่ — or is turned back as ไปไหน(มา), answered with ไปเที่ยว or ไปธุระ."},"ex":[["เป็น","bpen","pen"],["ยังไง","yang-ngai","yangngai"],["บ้าง","bâang","bang"],["ครับ","kráp","khrap"]]},{"t":{"pt":"ไป...มา: fui e já voltei","en":"ไป...มา: went and came back"},"e":{"pt":"O livro registra a moldura ไป + lugar ou atividade + มา, que conta uma ida e volta já encerrada: ไปตลาดมา ('fui ao mercado e voltei'), ไปเที่ยวมา ('voltei de um passeio'), ไปธุระมา ('voltei de resolver algo'). É ela que responde a ไปไหนมา ('onde você estava?'). O มา do fim não é 'vir' no sentido literal: é o que fecha o trajeto, como o nosso 'e voltei' implícito. Não confunda com ไปมา junto, que é outra palavra e significa 'ir e vir, vai e vem'.","en":"The book lists the frame ไป + place or activity + มา for a round trip already completed: ไปตลาดมา 'I went to the market (and am back)', ไปเที่ยวมา, ไปธุระมา. It is what answers ไปไหนมา 'where have you been?'. The final มา closes the trip rather than meaning 'come'. Don't confuse it with ไปมา written together, a different word meaning 'back and forth'."},"ex":[["ไป","bpai","pai"],["ตลาด","dtà-làat","talat"],["มา","maa","ma"]]},{"t":{"pt":"Com superior e inferior entra o wai","en":"Superiors, inferiors and the wai"},"e":{"pt":"De inferior para superior só existe o formal: สวัสดีครับ acompanhado do wai, as mãos juntas — e quanto mais alto o status do outro, mais altas as mãos. O superior responde (สวัสดี) ou apenas retribui o wai; outra saída é ท่านสบายดีหรือครับ, respondido com สบายดี ขอบใจ. De superior para inferior só existe o informal: เป็นยังไงบ้าง → สบายดีครับ. Ou seja, não se sobe de registro informal nem se desce de registro formal; entre os dois extremos, às vezes basta trocar os wais, com o inferior começando.","en":"Inferior to superior: formal only — สวัสดีครับ plus a wai (hands higher for higher status), answered with (สวัสดี) or a returning wai, or ท่านสบายดีหรือครับ → สบายดี ขอบใจ. Superior to inferior: informal only — เป็นยังไงบ้าง → สบายดีครับ."},"ex":[["ท่าน","tân","than"],["สบายดี","sà-baai-dii","sabaidi"],["หรือ","rʉ̌ʉ","rue"],["ครับ","kráp","khrap"]]},{"t":{"pt":"Apresentar alguém","en":"Introducing someone"},"e":{"pt":"Entre iguais, chama-se a atenção da pessoa com คุณ + nome e aponta-se o outro: คุณสมศักดิ์ครับ นี่คุณปรีชา — e os dois trocam สวัสดีครับ. Quando os níveis são diferentes, é sempre o inferior que é apresentado ao superior, na forma คุณ + nome + นี่ท่าน + cargo. Depois do สวัสดี, muitos grupos acrescentam ยินดีที่ได้รู้จัก ('prazer em conhecer'). Entre iguais, a mulher é apresentada ao homem e normalmente faz o wai antes; entre duas mulheres o wai não é obrigatório, mas conta como educação.","en":"Between equals: คุณ + name of the person you address, then นี่ + the one being introduced; both say สวัสดีครับ. An inferior is always introduced to a superior: คุณ + name, นี่ท่าน + rank. Many add ยินดีที่ได้รู้จัก after สวัสดี. Among equals a woman is introduced to a man and usually wais first."},"ex":[["ยินดี","yin-dii","yindi"],["ที่","tîi","thi"],["ได้","dâai","dai"],["รู้จัก","rúu-jàk","ruchak"]]},{"t":{"pt":"A despedida vale para todos os níveis","en":"Leavetaking works at every level"},"e":{"pt":"Quem vai embora pede licença com ขอโทษ ผมไปก่อนนะครับ ('com licença, vou na frente'), e quem fica responde เชิญครับ พบกันใหม่ครับ ('pois não, até a próxima'). Repare no นะ antes do ครับ: ele amacia o aviso de que você está saindo. Sem o นะ, ผมไปก่อนครับ soa seco, quase como quem comunica uma decisão.","en":"The one leaving says ขอโทษ ผมไปก่อนนะครับ 'excuse me, I must go'; the one staying answers เชิญครับ พบกันใหม่ครับ. The นะ before ครับ softens the announcement."},"ex":[["ผม","pǒm","phom"],["ไป","bpai","pai"],["ก่อน","gɔ̀ɔn","kon"],["นะ","ná","na"],["ครับ","kráp","khrap"]]},{"t":{"pt":"เชิญ dá sinal verde","en":"เชิญ gives the green light"},"e":{"pt":"เชิญครับ é um convite para a pessoa fazer algo que é bom para ela: comer, entrar, sentar. Mas também serve para autorizar algo que ela já disse que queria fazer — como ir embora, e é por isso que aparece na despedida. Analogia: é o nosso 'pois não' dito na porta, que ao mesmo tempo oferece e libera.","en":"เชิญครับ invites someone to do something good for them (eat, come in, sit down) or authorizes something they already wanted to do, such as taking leave — which is why it appears in leavetaking."},"ex":[["เชิญ","chəən","choen"],["ครับ","kráp","khrap"]]},{"t":{"pt":"Títulos no lugar de คุณ","en":"Titles instead of คุณ"},"e":{"pt":"Com um superior, ท่าน ocupa o lugar de คุณ e pode vir seguido do cargo: ท่านทูต ('senhor embaixador'), ท่านรัฐมนตรีว่าการกระทรวงต่างประเทศ ('senhor ministro das Relações Exteriores'). Os demais títulos vêm antes do nome: (คุณ)หมอ para médicos, ด็อกเตอร์ para quem tem doutorado, อาจารย์ para professores universitários e ครู para professores em geral. Com o rei ou com um monge budista, nenhuma dessas formas serve.","en":"With a superior, ท่าน replaces คุณ and may be followed by a rank (ท่านทูต 'Mr. Ambassador'). Other titles precede the name: (คุณ)หมอ for medical doctors, ด็อกเตอร์ for Ph.D.s, อาจารย์ for college teachers, ครู for school teachers. None of these forms is correct for the King or a Buddhist priest."},"ex":[["ท่าน","tân","than"],["รัฐมนตรี","rát-tà-mon-dtrii","ratthamontri"]]},{"t":{"pt":"Três negações: ไม่, ไม่ได้, ไม่ใช่","en":"Three negatives: ไม่, ไม่ได้, ไม่ใช่"},"e":{"pt":"A escolha depende do que se nega. ไม่ nega qualquer verbo: อากาศไม่ร้อน ('o tempo não está quente'), ผมไม่มีนาฬิกา ('não tenho relógio'). ไม่ได้ nega verbos de movimento e de ação, além de เป็น e ชื่อ, e é o 'não, ao contrário do que se supunha' — muito usado para o passado: ผมไม่ได้ปิดไฟ ('não apaguei a luz'), เขาไม่ได้ชื่อสมศักดิ์ ('ele não se chama Somsak'). ไม่ใช่ nega um substantivo em frases sem verbo: นี่ไม่ใช่ดินสอเขา, นาฬิกาเรือนนี้ไม่ใช่ของคุณ. Com เป็น as duas saídas servem: para afirmar do nada, เขาไม่ได้เป็นนักเรียน; para responder a uma pergunta, เขาเป็นครู ไม่ใช่นักเรียน.","en":"ไม่ negates any verb (อากาศไม่ร้อน, ผมไม่มีนาฬิกา). ไม่ได้ negates motion and action verbs plus เป็น and ชื่อ — 'not, contrary to assumption', common for the past (ผมไม่ได้ปิดไฟ). ไม่ใช่ negates noun phrases in verbless sentences (นี่ไม่ใช่ดินสอเขา). With เป็น both work: ไม่ได้เป็น in a first statement, เป็น ... ไม่ใช่ when answering."},"ex":[["เขา","kǎo","khao"],["ไม่ได้","mâi-dâai","maidai"],["เป็น","bpen","pen"],["นักเรียน","nák-riian","nakrian"]]},{"t":{"pt":"เป็นยังไง: 'como está...?'","en":"เป็นยังไง: 'how is...?'"},"e":{"pt":"เป็นอย่างไร (formal) e ยังไง (coloquial) perguntam 'como está' e aceitam qualquer sujeito, não só gente: อากาศเป็นอย่างไร ('como está o tempo?'), (การ)เรียนภาษาไทยเป็นอย่างไร ('como vai o estudo de tailandês?'). O บ้าง no fim é o tempero que deixa a pergunta natural entre conhecidos. Pense nele como o 'e aí, tudo bem?' contra o 'como vai o senhor?'.","en":"เป็นอย่างไร (formal) and ยังไง (informal) mean 'how is...?' and take any subject: อากาศเป็นอย่างไร 'how's the weather?', (การ)เรียนภาษาไทยเป็นอย่างไร 'how's studying Thai?'. บ้าง at the end is what makes the question natural between acquaintances."},"ex":[["อากาศ","aa-gàat","akat"],["เป็น","bpen","pen"],["ยังไง","yang-ngai","yangngai"]]}],"paginas":"vol. 1, p. 52–63"},"6":{"n":6,"titulo":{"pt":"Nacionalidade e país de origem","en":"Nationality and where you come from"},"dialogo":[{"sp":"A","s":[["สวัสดี","sà-wàt-dii","sawatdi"],["ครับ","kráp","khrap"]],"fsi":"sawàtdii khráp","en":"Hello.","pt":"Olá."},{"sp":"B","s":[["คุณ","kun","khun"],["พูด","pûut","phut"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"],["เก่ง","gèng","keng"],["จัง","jang","chang"]],"fsi":"khun phûut phaasǎa thaj keŋ caŋ","en":"You speak Thai very well.","pt":"Você fala tailandês muito bem."},{"sp":"B","s":[["เป็น","bpen","pen"],["คน","kon","khon"],["ชาติ","châat","chat"],["อะไร","à-rai","arai"],["ครับ","kráp","khrap"]],"fsi":"pen khon châat ʔaraj khráp","en":"What nationality are you?","pt":"Você é de que nacionalidade?"},{"sp":"A","s":[["ผม","pǒm","phom"],["เป็น","bpen","pen"],["คน","kon","khon"],["อเมริกัน","à-mee-rí-gan","amerikan"],["ครับ","kráp","khrap"]],"fsi":"phǒm pen khon ʔameerikan khráp","en":"I'm an American.","pt":"Sou americano."},{"sp":"B","s":[["คุณ","kun","khun"],["พูด","pûut","phut"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"],["ได้","dâai","dai"],["ดี","dii","di"],["มาก","mâak","mak"],["ครับ","kráp","khrap"]],"fsi":"khun phûut phaasǎa thaj dâj dii mâak khráp","en":"You (can) speak Thai very well.","pt":"O senhor fala tailandês muito bem."},{"sp":"A","s":[["ขอบคุณ","kɔ̀ɔp-kun","khopkhun"],["ครับ","kráp","khrap"]],"fsi":"khɔ̀ɔpkhun khráp","en":"Thank you.","pt":"Obrigado."},{"sp":"A","s":[["ผม","pǒm","phom"],["พูด","pûut","phut"],["ได้","dâai","dai"],["นิดหน่อย","nít-nɔ̀i","nitnoi"],["เท่านั้น","tâo-nán","thaonan"],["ครับ","kráp","khrap"]],"fsi":"phǒm phûut dâj nít nɔ̀j thâwnán khráp","en":"I can only speak a little.","pt":"Eu só falo um pouquinho."},{"sp":"B","s":[["ใคร","krai","khrai"],["สอน","sɔ̌ɔn","son"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"],["คุณ","kun","khun"],["ครับ","kráp","khrap"]],"fsi":"khraj sɔ̌ɔn phaasǎa thaj khun khráp","en":"Who taught you Thai?","pt":"Quem lhe ensinou tailandês?"},{"sp":"A","s":[["คุณ","kun","khun"],["นงนุช","nong-nút","nongnut"],["ครับ","kráp","khrap"]],"fsi":"khun noŋnút khráp","en":"Miss Nongnut.","pt":"A senhorita Nongnut."},{"sp":"A","s":[["เขา","kǎo","khao"],["เป็น","bpen","pen"],["ครู","kruu","khru"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"],["ที่","tîi","thi"],["โรงเรียน","roong-riian","rongrian"],["สอน","sɔ̌ɔn","son"],["ภาษา","paa-sǎa","phasa"]],"fsi":"kháw pen khruu phaasǎa thaj thîi rooŋrian sɔ̌ɔn phaasǎa","en":"She is a Thai language teacher at the language school.","pt":"Ela é professora de tailandês na escola de línguas."}],"notas":[{"t":{"pt":"มาก: o 'muito' do comentário","en":"มาก: the 'very' of a comment"},"e":{"pt":"มาก intensifica verbos de estado — เก่ง, ดี, สวย — e aparece em comentários, nunca em perguntas: คุณพูดภาษาไทยได้ดีมากครับ ('o senhor fala tailandês muito bem'). É o 'muito' de 'ela é muito boa nisso', e não o 'muito' de uma pergunta como 'você come muito?'. Para perguntar, o tailandês usa outra construção.","en":"มาก 'extremely, very much' intensifies stative verbs such as เก่ง, ดี and สวย in comments; it never occurs in questions."},"ex":[["พูด","pûut","phut"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"],["ได้","dâai","dai"],["ดี","dii","di"],["มาก","mâak","mak"]]},{"t":{"pt":"เก่ง: ser bom em algo","en":"เก่ง: to be good at something"},"e":{"pt":"เก่ง é 'ser hábil, ser bom em'. Ele vem depois de uma frase verbal — เขาเรียนหนังสือเก่ง ('ele aprende com facilidade'), เขาเล่นดนตรีไม่เก่ง ('ele toca mal') — ou antes de um substantivo: ครูเขาเก่งภาษาญวน ('o professor dele é bom em vietnamita'). Repare que a coisa em que se é bom vem colada, sem preposição.","en":"เก่ง means 'to be skillful at'. It follows a verb phrase (เรียนหนังสือเก่ง, เล่นดนตรีไม่เก่ง) or precedes a noun phrase (เก่งภาษาไทย) — with no preposition in between."},"ex":[["เขา","kǎo","khao"],["เรียน","riian","rian"],["หนังสือ","nǎng-sʉ̌ʉ","nangsue"],["เก่ง","gèng","keng"]]},{"t":{"pt":"เรียน, เขียน, อ่าน e สอน pedem objeto","en":"เรียน, เขียน, อ่าน and สอน need an object"},"e":{"pt":"Esses quatro verbos não aparecem sozinhos: exigem um complemento. Quando não há nada específico para dizer, entra หนังสือ — เรียนหนังสือ ('estudar'), เขียนหนังสือ ('escrever'), อ่านหนังสือ ('ler'), สอนหนังสือ ('dar aula'). É como o nosso 'dar aula', que ninguém diz só 'dar'.","en":"เรียน, เขียน, อ่าน and สอน never occur without an object complement; when there is nothing specific to say, หนังสือ fills the slot: เรียนหนังสือ 'to study', เขียนหนังสือ 'to write', อ่านหนังสือ 'to read', สอนหนังสือ 'to teach'."},"ex":[["ครู","kruu","khru"],["ผม","pǒm","phom"],["สอน","sɔ̌ɔn","son"],["หนังสือ","nǎng-sʉ̌ʉ","nangsue"],["เก่ง","gèng","keng"]]},{"t":{"pt":"Como dizer a nacionalidade","en":"How to say a nationality"},"e":{"pt":"A regra geral é คน + país: คนไทย, คนญี่ปุ่น, คนพม่า, คนเยอรมัน. Para gente da Malásia, Indonésia, Índia e Oriente Médio entra o แขก: แขกมลายู, แขกอินเดีย. Usados sozinhos, ฝรั่ง cobre os de pele clara (europeus, australianos, americanos brancos) e แขก os de pele mais escura daquelas regiões. Os muçulmanos do sul da Tailândia são chamados de ไทยอิสลาม.","en":"General rule: คน + country (คนไทย, คนญี่ปุ่น, คนเยอรมัน). For Malaya, Indonesia, India and the Middle East: แขก + country. Alone, ฝรั่ง covers white-skinned foreigners and แขก people from Malaya, Indonesia, India, Ceylon and the Middle East. Moslems in South Thailand are ไทยอิสลาม."},"ex":[["เขา","kǎo","khao"],["เป็น","bpen","pen"],["คน","kon","khon"],["อังกฤษ","ang-grìt","angkrit"]]},{"t":{"pt":"เมือง, กรุง e ประเทศ: cidade e país","en":"เมือง, กรุง and ประเทศ: city and country"},"e":{"pt":"เมือง serve para cidade e para país na fala do dia a dia: เมืองวอชิงตัน ou só วอชิงตัน, เมืองญี่ปุ่น ou só ญี่ปุ่น. Na imprensa, กรุง aparece com algumas capitais — กรุงโรม, กรุงปารีส — e ประเทศ é a forma formal para país, a de jornal e de discurso. São três registros: เมือง (conversa), กรุง (mídia), ประเทศ (formal).","en":"เมือง covers both city and country in speech (เมืองวอชิงตัน or วอชิงตัน; เมืองญี่ปุ่น or ญี่ปุ่น). The mass media use กรุง with some capitals (กรุงโรม, กรุงปารีส), and ประเทศ + country is the formal, newspaper-and-speech form."},"ex":[["เขา","kǎo","khao"],["มา","maa","ma"],["จาก","jàak","chak"],["ประเทศ","bprà-têet","prathet"],["ญี่ปุ่น","yîi-pùn","yiphun"]]},{"t":{"pt":"A posição de ใคร muda o sentido","en":"Where ใคร sits changes the meaning"},"e":{"pt":"Como regra, ใคร ocupa o lugar da resposta, depois do เป็น: เขาเป็นใคร ('quem é ele?'). Mas a ordem pode inverter o sentido: จูเลียตเป็นใคร pergunta quem é essa pessoa de quem você nunca ouviu falar, enquanto ใครเป็นจูเลียต pergunta quem faz o papel de Julieta na peça. Quando o sujeito é um pronome, o ใคร fica no complemento; com outros verbos ele pode ser sujeito ou complemento: ใครสอนภาษาไทย ('quem ensina tailandês?'), คุณประภาสสอนภาษาไทยให้ใคร ('o Prapas ensina tailandês para quem?').","en":"ใคร normally sits in the complement after เป็น (เขาเป็นใคร 'who is he?'). It may also precede เป็น, with a different reading: จูเลียตเป็นใคร 'who is Juliet?' vs. ใครเป็นจูเลียต 'who plays Juliet?'. With a pronoun subject it stays in the complement; with other verbs it may be subject or complement (ใครสอนภาษาไทย, ...สอนภาษาไทยให้ใคร)."},"ex":[["ใคร","krai","khrai"],["สอน","sɔ̌ɔn","son"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"]]}],"paginas":"vol. 1, p. 64–85"},"7":{"n":7,"titulo":{"pt":"De onde você vem e o que sabe fazer","en":"Where you come from and what you can do"},"dialogo":[{"sp":"A","s":[["ไป","bpai","pai"],["ไหน","nǎi","nai"],["ครับ","kráp","khrap"]],"fsi":"paj nǎj khráp","en":"Where are you going?","pt":"Aonde vai?"},{"sp":"B","s":[["ไป","bpai","pai"],["ตลาด","dtà-làat","talat"],["ครับ","kráp","khrap"]],"fsi":"paj talaat khráp","en":"To the market.","pt":"Vou ao mercado."},{"sp":"A","s":[["คุณ","kun","khun"],["พูด","pûut","phut"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"],["เก่ง","gèng","keng"],["จัง","jang","chang"]],"fsi":"khun phûut phaasǎa thaj keŋ caŋ","en":"You speak Thai very well.","pt":"Você fala tailandês muito bem."},{"sp":"A","s":[["เป็น","bpen","pen"],["คน","kon","khon"],["ชาติ","châat","chat"],["อะไร","à-rai","arai"]],"fsi":"pen khon châat ʔaraj","en":"What is your nationality?","pt":"Você é de que nacionalidade?"},{"sp":"B","s":[["ผม","pǒm","phom"],["เป็น","bpen","pen"],["คน","kon","khon"],["อเมริกัน","à-mee-rí-gan","amerikan"],["ครับ","kráp","khrap"]],"fsi":"phǒm pen khon ʔameerikan khráp","en":"I'm an American.","pt":"Sou americano."},{"sp":"B","s":[["ขอโทษ","kɔ̌ɔ-tôot","khothot"],["ครับ","kráp","khrap"],["คุณ","kun","khun"],["พูด","pûut","phut"],["ภาษา","paa-sǎa","phasa"],["อังกฤษ","ang-grìt","angkrit"],["เป็น","bpen","pen"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"khɔ̌ɔthôot khráp, khun phûut phaasǎa ʔaŋkrìt pen máj khráp","en":"Excuse me, do you speak English?","pt":"Com licença, o senhor fala inglês?"},{"sp":"A","s":[["ไม่","mâi","mai"],["เป็น","bpen","pen"],["ครับ","kráp","khrap"]],"fsi":"mâj pen khráp","en":"No, I don't.","pt":"Não falo."},{"sp":"B","s":[["คุณ","kun","khun"],["เป็น","bpen","pen"],["ชาว","chaao","chao"],["จังหวัด","jang-wàt","changwat"],["นี้","níi","ni"],["หรือ","rʉ̌ʉ","rue"],["เปล่า","bplào","plao"],["ครับ","kráp","khrap"]],"fsi":"khun pen chaaw caŋwàt níi rʉ̌ʉ plaaw khráp","en":"Are you a native of this province?","pt":"O senhor é desta província?"},{"sp":"A","s":[["เปล่า","bplào","plao"],["ครับ","kráp","khrap"],["ผม","pǒm","phom"],["มา","maa","ma"],["จาก","jàak","chak"],["จังหวัด","jang-wàt","changwat"],["ลำปาง","lam-bpaang","lampang"]],"fsi":"plaaw khráp, phǒm maa càak caŋwàt lampaaŋ","en":"No, I'm from Lampang Province.","pt":"Não, sou da província de Lampang."},{"sp":"A","s":[["คุณ","kun","khun"],["เคย","kəəi","khoei"],["ไป","bpai","pai"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"khun khəəj paj máj khráp","en":"Have you ever been there?","pt":"O senhor já foi lá?"},{"sp":"B","s":[["ไม่","mâi","mai"],["เคย","kəəi","khoei"],["ครับ","kráp","khrap"]],"fsi":"mâj khəəj khráp","en":"No, I haven't.","pt":"Não, nunca fui."},{"sp":"B","s":[["อยู่","yùu","yu"],["ที่","tîi","thi"],["ไหน","nǎi","nai"],["ครับ","kráp","khrap"]],"fsi":"jùu thîi nǎj khráp","en":"Where is it?","pt":"Fica onde?"},{"sp":"A","s":[["อยู่","yùu","yu"],["ใน","nai","nai"],["ภาค","pâak","phak"],["เหนือ","nʉ̌ʉa","nuea"]],"fsi":"jùu naj phâak nʉ̌a","en":"In the North.","pt":"Fica no Norte."}],"notas":[{"t":{"pt":"จังหวัด e ชาว: província e morador","en":"จังหวัด and ชาว: province and resident"},"e":{"pt":"จังหวัด é a unidade administrativa do governo tailandês — são 71 — e se traduz por 'província'. ชาว significa 'morador' ou 'natural de' e vem antes do lugar: ชาวจังหวัดนี้ ('morador desta província'), ชาวเชียงใหม่. É a palavra que aparece em คุณเป็นชาวจังหวัดนี้หรือเปล่าครับ ('você é daqui desta província?').","en":"จังหวัด is a Thai administrative unit — there are 71 — and translates as 'province'. ชาว means 'resident, native' and precedes the place: ชาวจังหวัดนี้, ชาวเชียงใหม่."},"ex":[["คุณ","kun","khun"],["เป็น","bpen","pen"],["ชาว","chaao","chao"],["จังหวัด","jang-wàt","changwat"],["นี้","níi","ni"],["หรือ","rʉ̌ʉ","rue"],["เปล่า","bplào","plao"]]},{"t":{"pt":"เก่ง e ดี: dois 'bons' diferentes","en":"เก่ง and ดี: two kinds of 'good'"},"e":{"pt":"เก่ง é 'bom' no sentido de habilidoso: เขาเรียนหนังสือเก่ง ('ele estuda bem, é bom aluno'). ดี é 'bom' no sentido geral, de índole ou qualidade: เขาเป็นคนดี ('ele é boa pessoa'). Trocar um pelo outro muda o elogio — เขาเป็นคนเก่ง fala de competência, เขาเป็นคนดี fala de caráter.","en":"เก่ง is 'good' as skillful (เขาเรียนหนังสือเก่ง 'he studies well'); ดี is 'good' in general (เขาเป็นคนดี 'he's a good person')."},"ex":[["เขา","kǎo","khao"],["เป็น","bpen","pen"],["คน","kon","khon"],["ดี","dii","di"]]},{"t":{"pt":"ไปไหน também é cumprimento","en":"ไปไหน doubles as a greeting"},"e":{"pt":"ไปไหนครับ ('aonde vai?') é pergunta, mas entre conhecidos funciona como cumprimento casual, sem exigir resposta detalhada. O normal é responder com o destino: ไปตลาดครับ ('vou ao mercado'). Pense no nosso 'e aí, pra onde?' dito na porta, que ninguém leva a sério como interrogatório.","en":"ไปไหน is frequently used as a casual greeting rather than a demand for information; the normal answer is the destination (ไปตลาดครับ)."},"ex":[["ไป","bpai","pai"],["ไหน","nǎi","nai"],["ครับ","kráp","khrap"]]},{"t":{"pt":"เคย: já ter feito algo","en":"เคย: to have ever done something"},"e":{"pt":"เคย antes do verbo marca experiência passada: เขาเคยเป็นครู ('ele já foi professor'), คุณเคยไปเมืองไทยไหม ('você já foi à Tailândia?'). A resposta afirmativa é o próprio เคย, e a negativa é ไม่เคย. É o nosso 'já' de 'você já foi lá?', com o 'nunca' embutido na negativa.","en":"เคย + verb phrase marks past experience: เขาเคยเป็นครู, คุณเคยไปเมืองไทยไหม. The affirmative answer is เคย, the negative ไม่เคย."},"ex":[["คุณ","kun","khun"],["เคย","kəəi","khoei"],["ไป","bpai","pai"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]]},{"t":{"pt":"ไป e มา aceitam lugar ou atividade","en":"ไป and มา take a place or an activity"},"e":{"pt":"Depois de ไป ('ir') e มา ('vir') pode vir um lugar — ไปโรงเรียน ('ir à escola') — ou uma atividade: ไปซื้อของ ('ir fazer compras'), ไปกินกาแฟ ('ir tomar café'). Na pergunta, qualquer um dos dois vira ไหน: ไปไหนครับ. É o molde do nosso 'ir + infinitivo', só que sem preposição nenhuma.","en":"ไป and มา are followed either by a place expression (ไปโรงเรียน) or by a verb phrase for an activity (ไปซื้อของ); in questions either slot is replaced by ไหน (ไปไหน)."},"ex":[["ไป","bpai","pai"],["ซื้อ","sʉ́ʉ","sue"],["ของ","kɔ̌ɔng","khong"]]},{"t":{"pt":"Sem tempo no verbo, sem pronome na frase","en":"No tense on the verb, no pronoun in the sentence"},"e":{"pt":"O verbo tailandês não muda com o tempo: ผมไปโรงเรียน pode ser 'vou', 'eu vou' ou 'fui' à escola — quem resolve é o contexto, e na prática quase não há ambiguidade. O pronome sujeito também cai sempre que não faz falta: às vezes em afirmações, quase sempre em perguntas, e praticamente sempre nas respostas. Por isso o diálogo tem ไปไหนครับ → ไปตลาดครับ, sem nenhum pronome.","en":"Thai verbs do not change for tense: ผมไปโรงเรียน may mean 'I'm going', 'I go' or 'I went'. The subject pronoun is dropped whenever that causes no misunderstanding — often in statements, frequently in questions, almost always in answers."},"ex":[["ไป","bpai","pai"],["ตลาด","dtà-làat","talat"],["ครับ","kráp","khrap"]]},{"t":{"pt":"ได้: ser possível, dar certo","en":"ได้: possible, all right"},"e":{"pt":"A estrutura frase + ได้ diz que algo é possível ou adequado: ผมพูดภาษาไทยได้ ('eu consigo falar tailandês'), คุณพูดภาษาไทยได้ไหม ('você consegue?'). Como o ได้ é tratado como verbo principal, a negação ไม่ gruda nele: เขาไปตลาดไม่ได้ ('ela não pode ir ao mercado'). O sujeito de tudo isso é a frase inteira antes do ได้.","en":"Sentence + ได้ means 'possible, suitable, all right': ผมพูดภาษาไทยได้. Since ได้ counts as the main verb, the negative ไม่ is placed right before it: เขาไปตลาดไม่ได้."},"ex":[["ผม","pǒm","phom"],["พูด","pûut","phut"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"],["ได้","dâai","dai"]]},{"t":{"pt":"เป็น: saber fazer","en":"เป็น: to know how"},"e":{"pt":"A estrutura frase + เป็น diz que a pessoa aprendeu a técnica: ผมขับรถเป็น ('sei dirigir'), เขาเล่นดนตรีไม่เป็น ('ele não sabe tocar'). Aqui também o เป็น é o verbo principal e o ไม่ vem logo antes dele. As respostas curtas são เป็นครับ e ไม่เป็นครับ — foi com ไม่เป็นครับ que o diálogo disse 'não falo inglês'.","en":"Sentence + เป็น means 'knows how to perform an activity': ผมขับรถเป็น, เขาเล่นดนตรีไม่เป็น. เป็น is the main verb, so ไม่ precedes it; the normal answers are เป็นครับ / ไม่เป็นครับ."},"ex":[["คุณ","kun","khun"],["พูด","pûut","phut"],["ภาษา","paa-sǎa","phasa"],["อังกฤษ","ang-grìt","angkrit"],["เป็น","bpen","pen"],["ไหม","mǎi","mai"]]},{"t":{"pt":"ได้ × เป็น: técnica contra circunstância","en":"ได้ vs. เป็น: technique vs. circumstance"},"e":{"pt":"Quando a habilidade é questão de ter aprendido a técnica, os dois servem e são intercambiáveis: ผมพูดภาษาไทยได้ / เป็น. Quando a impossibilidade vem de outra causa — saúde, circunstância — só o ได้ entra: ผมขับรถเป็น แต่วันนี้ขับไม่ได้ ผมไม่สบาย ('sei dirigir, mas hoje não dá, estou doente'). E o เคย combina com ambos: เขาเคยเล่นดนตรีเป็น ('ele sabia tocar'), respondido com เคยครับ ou ไม่เคยครับ.","en":"Where ability is a matter of learned technique, ได้ and เป็น are interchangeable (ผมพูดภาษาไทยได้/เป็น). Where inability has another cause, only ได้ works: ผมขับรถเป็น แต่วันนี้ขับไม่ได้. เคย combines with both: เขาเคยเล่นดนตรีเป็น → เคยครับ / ไม่เคยครับ."},"ex":[["เขา","kǎo","khao"],["เคย","kəəi","khoei"],["เล่น","lên","len"],["ดนตรี","don-dtrii","dontri"],["เป็น","bpen","pen"]]}],"paginas":"vol. 1, p. 86–114"},"8":{"n":8,"titulo":{"pt":"Trabalho, cargo e endereço","en":"Americans at work in Bangkok"},"dialogo":[{"sp":"A","s":[["ไป","bpai","pai"],["ไหน","nǎi","nai"],["ครับ","kráp","khrap"]],"fsi":"paj nǎj khráp","en":"Where are you going?","pt":"Aonde vai?"},{"sp":"B","s":[["ไป","bpai","pai"],["ทำงาน","tam-ngaan","thamngan"],["ครับ","kráp","khrap"]],"fsi":"paj thamŋaan khráp","en":"I'm going to work.","pt":"Vou trabalhar."},{"sp":"A","s":[["คุณ","kun","khun"],["ทำงาน","tam-ngaan","thamngan"],["ที่","tîi","thi"],["ไหน","nǎi","nai"],["ครับ","kráp","khrap"]],"fsi":"khun thamŋaan thîi nǎj khráp","en":"Where do you work?","pt":"Você trabalha onde?"},{"sp":"B","s":[["ผม","pǒm","phom"],["ทำงาน","tam-ngaan","thamngan"],["ที่","tîi","thi"],["สถานทูต","sà-tǎan-tûut","sathanthut"],["อเมริกัน","à-mee-rí-gan","amerikan"],["ครับ","kráp","khrap"]],"fsi":"phǒm thamŋaan thîi sathǎanthûut ʔameerikan khráp","en":"I work at the American Embassy","pt":"Trabalho na Embaixada Americana."},{"sp":"A","s":[["เพื่อน","pʉ̂ʉan","phuean"],["คุณ","kun","khun"],["ทำงาน","tam-ngaan","thamngan"],["ที่","tîi","thi"],["สถานทูต","sà-tǎan-tûut","sathanthut"],["เหมือนกัน","mʉ̌ʉan-gan","mueankan"],["หรือ","rʉ̌ʉ","rue"],["ครับ","kráp","khrap"]],"fsi":"phʉ̂an khun thamŋaan thîi sathǎanthûut mʉ̌ankan rʉ̌ʉ khráp","en":"Does your friend work at the Embassy too?","pt":"Seu amigo também trabalha na embaixada?"},{"sp":"B","s":[["เปล่า","bplào","plao"],["ครับ","kráp","khrap"]],"fsi":"plaaw khráp","en":"No, he doesn't.","pt":"Não, não trabalha."},{"sp":"A","s":[["เขา","kǎo","khao"],["ทำงาน","tam-ngaan","thamngan"],["อะไร","à-rai","arai"],["ครับ","kráp","khrap"]],"fsi":"kháw thamŋaan ʔaraj khráp","en":"What does he do?","pt":"O que ele faz?"},{"sp":"A","s":[["ที่ทำงาน","tîi-tam-ngaan","thithamngan"],["ของ","kɔ̌ɔng","khong"],["เขา","kǎo","khao"],["อยู่","yùu","yu"],["ที่","tîi","thi"],["ไหน","nǎi","nai"],["ครับ","kráp","khrap"]],"fsi":"thîithamŋaan khɔ̌ɔŋ kháw jùu thîi nǎj khráp","en":"Where's his office?","pt":"O escritório dele fica onde?"},{"sp":"B","s":[["อยู่","yùu","yu"],["ที่","tîi","thi"],["ถนน","tà-nǒn","thanon"],["สาทร","sǎa-tɔɔn","sathon"],["ใต้","dtâi","tai"],["ครับ","kráp","khrap"]],"fsi":"jùu thîi thanǒn saathɔɔntâj khráp","en":"On South Sathorn Street.","pt":"Fica na rua Sathorn Sul."}],"notas":[{"t":{"pt":"Compostos: como o tailandês junta palavras","en":"Compounds: how Thai puts words together"},"e":{"pt":"Um composto tailandês se explica pelas regras normais de sintaxe: se você perguntar a um nativo, ele dá uma 'derivação' que faz o sentido aparecer. Em inglês é o mesmo: pergunte o que é 'parking permit' e você ouve 'a permit for parking your car'. A sintaxe da explicação não é a do composto, mas o parentesco de sentido existe. Por isso, quando um composto não fizer sentido, pergunte a derivação a um professor. Se você inventar compostos, tenha sucesso limitado em mente e confira com um nativo antes de usar.","en":"A Thai compound can be explained by the regular syntax of the language: ask a native speaker and you get a derivation that makes the meaning clear, just as 'parking permit' yields 'a permit for parking your car'. The syntax of the derivation differs from the compound. If you coin your own compounds, check them with a native speaker first."}},{"t":{"pt":"Substantivo + substantivo","en":"Noun + noun compounds"},"e":{"pt":"O tipo mais comum soma dois substantivos: สถาน ('lugar') + ทูต ('embaixador') = สถานทูต ('embaixada'); ทหาร ('pessoa militar') + บก ('terra'), เรือ ('barco'), อากาศ ('ar') = soldado, marinheiro, aviador; กระทรวง ('ministério') + การต่างประเทศ = Ministério das Relações Exteriores; กรม ('departamento') + ตำรวจ = Departamento de Polícia; กองทัพ ('forças armadas') + บก/เรือ/อากาศ = Exército, Marinha, Força Aérea. A parte da direita costuma dizer de que tipo é a da esquerda — o contrário do nosso 'de'.","en":"Noun + noun: สถาน 'place' + ทูต 'ambassador' = 'embassy'; ทหาร + บก/เรือ/อากาศ = soldier/sailor/airman; กระทรวง + การต่างประเทศ; กรม + ตำรวจ; กองทัพ + บก/เรือ/อากาศ. The right-hand element usually tells what kind the left-hand one is."},"ex":[["ทหาร","tá-hǎan","thahan"],["บก","bòk","bok"]]},{"t":{"pt":"ผู้ e นัก fazem substantivos de agente","en":"ผู้ and นัก build agent nouns"},"e":{"pt":"ผู้ entra antes de muitos verbos para formar o 'quem faz', como o nosso sufixo -eiro ou -dor: ผู้ + เชี่ยวชาญ ('ser experiente') = ผู้เชี่ยวชาญ ('especialista'). Ele raramente aparece sozinho. นัก faz o mesmo para um grupo menor e não existe sem o verbo: นัก + ศึกษา = estudante universitário, นัก + เขียน = autor, นัก + ดนตรี = músico. Já ชาวนา, ชาวไร่ e ชาวสวน usam ชาว ('morador de') para lavrador, agricultor e pomareiro.","en":"ผู้ precedes many verbs to form agent nouns (like English -er): ผู้ + เชี่ยวชาญ = 'expert'; it rarely occurs alone. นัก does the same for a limited set and never stands alone: นักศึกษา 'university student', นักเขียน 'author', นักดนตรี 'musician'."},"ex":[["นัก","nák","nak"],["ศึกษา","sʉ̀k-sǎa","sueksa"]]},{"t":{"pt":"Composto ocupa o lugar de um substantivo só","en":"A compound fills the slot of a single noun"},"e":{"pt":"Um composto se comporta exatamente como um substantivo simples dentro de outra construção: em เจ้าหน้าตำรวจคนนี้ ('este policial') e นักศึกษาสี่คนนั้น ('aqueles quatro estudantes'), o composto aceita determinante e número + classificador do mesmo jeito. Na prática, isso quer dizer que não é preciso tratar 'สถานทูต' como algo especial: vale tudo o que vale para 'บ้าน'.","en":"Noun compounds take the same position as single nouns in larger constructions: เจ้าหน้าตำรวจคนนี้ 'this police official', นักศึกษาสี่คนนั้น 'those four students' — they accept determiners and number + classifier just like a simple noun."},"ex":[["นักศึกษา","nák-sʉ̀k-sǎa","naksueksa"],["สี่","sìi","si"],["คน","kon","khon"],["นั้น","nân","nan"]]},{"t":{"pt":"อยู่ vem seguido de lugar","en":"อยู่ is followed by a place"},"e":{"pt":"อยู่ ('estar situado, morar') pede uma expressão de lugar logo depois: ยูโซมอยู่ที่ถนนเพชรบุรี ('a USOM fica na rua Phetburi'). É a resposta padrão para อยู่ที่ไหนครับ ('onde fica?'), e a resposta começa repetindo o อยู่ — อยู่ที่ถนนสาทรใต้ครับ. Pense no nosso 'fica na rua tal'.","en":"อยู่ 'to be located at, to live at' is normally followed by a place expression: อยู่ที่บ้าน 'at home', อยู่ที่ถนนเพชรบุรี 'on Petburi Street'. The answer to อยู่ที่ไหน repeats อยู่: อยู่ที่ถนนสาทรใต้ครับ."},"ex":[["อยู่","yùu","yu"],["ที่","tîi","thi"],["ถนน","tà-nǒn","thanon"],["สาทร","sǎa-tɔɔn","sathon"]]},{"t":{"pt":"Duas respostas para 'o que você faz?'","en":"Two answers to 'what do you do?'"},"e":{"pt":"คุณทำงานอะไร ('o que você faz?') aceita duas respostas. Uma diz o cargo, com เป็น: ผมเป็นเจ้าหน้าที่ ('sou funcionário'). A outra diz o lugar, com ทำงานที่: ผมทำงานที่สถานทูตอเมริกัน ('trabalho na Embaixada Americana'). As duas são completas; a diferença é só o que você quer destacar, o título ou o endereço.","en":"คุณทำงานอะไร can be answered either with the position — ผมเป็นเจ้าหน้าที่ — or with the place of work — ผมทำงานที่สถานทูตอเมริกัน. Both are complete sentences."},"ex":[["ผม","pǒm","phom"],["ทำงาน","tam-ngaan","thamngan"],["ที่","tîi","thi"],["สถานทูต","sà-tǎan-tûut","sathanthut"]]},{"t":{"pt":"ไปไหน × ไปที่ไหน","en":"ไปไหน vs. ไปที่ไหน"},"e":{"pt":"As duas perguntam 'aonde você vai?', mas o contexto muda. ไปไหน é a pergunta solta do dia a dia, respondida com a atividade: ไปทานข้าว ('vou comer'). ไปที่ไหน quer o endereço, e a resposta é um lugar: (ที่)ร้านอาหารศรแดง ('no restaurante Red Arrow'). Use ไปที่ไหน quando precisar fixar o ponto no mapa.","en":"Both mean 'where are you going?', but ไปไหน is the casual question answered with an activity (ไปทานข้าว), while ไปที่ไหน asks for the specific place and is answered with one: (ที่)ร้านอาหาร..."}},{"t":{"pt":"ไปไหน? responde-se com a atividade","en":"Answering ไปไหน with an activity"},"e":{"pt":"Quando alguém pergunta ไปไหนครับ no portão, a resposta natural é o que você vai fazer, não o endereço: ไปทานข้าวครับ ('vou comer'). Se quiserem o lugar, vem a pergunta de follow-up ไปทานที่ไหนครับ, e aí sim você responde com o restaurante. É o mesmo encadeamento do nosso 'aonde vai?' → 'almoçar fora' → 'onde?'.","en":"The natural answer to ไปไหน is the activity (ไปทานข้าว 'going to eat'); the place is given only if a follow-up question asks ไปทานที่ไหน."},"ex":[["ไป","bpai","pai"],["ทาน","taan","than"],["ข้าว","kâao","khao"]]}],"paginas":"vol. 1, p. 115–134"},"9":{"n":9,"titulo":{"pt":"Indo ao aeroporto buscar um amigo","en":"Going to Don Muang to pick up a friend"},"dialogo":[{"sp":"A","s":[["ไป","bpai","pai"],["ไหน","nǎi","nai"],["มา","maa","ma"],["ครับ","kráp","khrap"]],"fsi":"paj nǎj maa khráp","en":"Where have you been?","pt":"Onde você esteve?"},{"sp":"B","s":[["ไป","bpai","pai"],["ดู","duu","du"],["หนัง","nǎng","nang"],["มา","maa","ma"]],"fsi":"paj duu nǎŋ maa","en":"To a movie.","pt":"Fui ao cinema."},{"sp":"B","s":[["คุณ","kun","khun"],["กำลัง","gam-lang","kamlang"],["จะ","jà","cha"],["ไป","bpai","pai"],["ไหน","nǎi","nai"]],"fsi":"khun kamlaŋ cà paj nǎj","en":"Where are you about to go to?","pt":"Você está indo aonde?"},{"sp":"A","s":[["ไป","bpai","pai"],["ดอนเมือง","dɔɔn-mʉʉang","donmueang"]],"fsi":"paj dɔɔnmʉaŋ","en":"To Don Muang (airport).","pt":"A Don Mueang, o aeroporto."},{"sp":"A","s":[["ไป","bpai","pai"],["ด้วย","dûuai","duai"],["กัน","gan","kan"],["ไหม","mǎi","mai"]],"fsi":"paj dûaj kan máj","en":"Want to go along?","pt":"Quer ir junto?"},{"sp":"B","s":[["ไม่","mâi","mai"],["เอา","ao","ao"]],"fsi":"mâj ʔao","en":"No, (thanks)","pt":"Não, obrigado."},{"sp":"B","s":[["คุณ","kun","khun"],["จะ","jà","cha"],["ไป","bpai","pai"],["ทำไม","tam-mai","thammai"]],"fsi":"khun cà paj thammaj","en":"Why are you going?","pt":"Você vai fazer o quê?"},{"sp":"A","s":[["ไป","bpai","pai"],["รับ","ráp","rap"],["เพื่อน","pʉ̂ʉan","phuean"]],"fsi":"paj ráp phʉ̂an","en":"To pick up a friend.","pt":"Vou buscar um amigo."},{"sp":"B","s":[["แมรี่","mɛ̂ɛ-rîi","maeri"],["ไม่","mâi","mai"],["อยู่","yùu","yu"],["หรือ","rʉ̌ʉ","rue"]],"fsi":"mɛ̂ɛrîi mâj jùu rʉ̌ʉ","en":"Mary isn't home?","pt":"A Mary não está em casa?"},{"sp":"A","s":[["อยู่","yùu","yu"]],"fsi":"jùu","en":"She is.","pt":"Está."},{"sp":"B","s":[["เขา","kǎo","khao"],["ไม่ได้","mâi-dâai","maidai"],["ไป","bpai","pai"],["อยุธยา","à-yút-tà-yaa","ayutthaya"],["หรือ","rʉ̌ʉ","rue"]],"fsi":"kháw mâj dâj paj ʔajutthajaa rʉ̌ʉ","en":"She didn't go to Ayuthaya?","pt":"Ela não foi a Ayutthaya?"},{"sp":"A","s":[["ครับ","kráp","khrap"]],"fsi":"khráp","en":"That's right.","pt":"Exatamente."},{"sp":"A","s":[["ไม่ได้","mâi-dâai","maidai"],["ไป","bpai","pai"]],"fsi":"mâj dâj paj","en":"She didn't go.","pt":"Ela não foi."},{"sp":"B","s":[["เขา","kǎo","khao"],["กำลัง","gam-lang","kamlang"],["ทำ","tam","tham"],["อะไร","à-rai","arai"]],"fsi":"kháw kamlaŋ tham ʔaraj","en":"What's she doing?","pt":"O que ela está fazendo?"},{"sp":"A","s":[["ดู","duu","du"],["หนังสือ","nǎng-sʉ̌ʉ","nangsue"]],"fsi":"duu naŋsʉ̌ʉ","en":"She's studying.","pt":"Está estudando."}],"notas":[{"t":{"pt":"O verbo tailandês não tem tempo","en":"Thai verbs have no tense"},"e":{"pt":"Não existe conjugação: a forma do verbo nunca muda para indicar passado, presente ou futuro. Quem marca o tempo são as partículas — จะ ('vai'), กำลัง ('está fazendo') — e as palavras de tempo, como วันนี้, พรุ่งนี้ e เมื่อวานนี้. Por isso ผมไปตลาด serve para 'vou ao mercado', 'estou indo' e 'fui', e o contexto resolve; na prática quase nunca há ambiguidade. É como o nosso 'eu vou amanhã', em que só o 'amanhã' diz quando.","en":"Thai verbs do not change form for tense. Time and state come from particles (จะ, กำลัง) and time words (วันนี้, พรุ่งนี้, เมื่อวานนี้), so ผมไปตลาด may mean 'I go', 'I'm going' or 'I went'."},"ex":[["ผม","pǒm","phom"],["กำลัง","gam-lang","kamlang"],["จะ","jà","cha"],["ไป","bpai","pai"],["ตลาด","dtà-làat","talat"]]},{"t":{"pt":"O mapa do tempo na frase","en":"The time chart inside the sentence"},"e":{"pt":"A ordem normal é: palavra de tempo + sujeito + partícula de tempo ou aspecto + verbo. Sem nada, o tempo fica não especificado. ทุกวัน ('todo dia') marca ação repetida; กำลัง marca ação em curso; กำลังจะ marca o que está para acontecer; จะ marca futuro e costuma vir com เดี๋ยว, วันนี้ ou พรุ่งนี้; เมื่อวานนี้ e เมื่อกี้นี้ jogam para o passado; เคย deixa o passado indefinido. E o มา no fim diz que a ação acabou e a pessoa voltou de onde saiu: ไปตลาดมา ('fui ao mercado e voltei').","en":"Normal order: time word + subject + time/aspect particle + verb. ทุกวัน 'every day' = repeated action; กำลัง = in progress; กำลังจะ = imminent; จะ = future (with เดี๋ยว, วันนี้, พรุ่งนี้); เมื่อวานนี้ / เมื่อกี้นี้ = past; เคย = indefinite past; a final มา = just completed, back where you started."},"ex":[["เมื่อวานนี้","mʉ̂ʉa-waan-níi","mueawanni"],["ผม","pǒm","phom"],["ไป","bpai","pai"],["ตลาด","dtà-làat","talat"],["มา","maa","ma"]]},{"t":{"pt":"A partícula de pergunta escolhe o tempo","en":"The question particle picks the time"},"e":{"pt":"O mesmo verbo muda de tempo conforme a pergunta: จะไปไหม ('vai?'), ไปหรือเปล่า ('foi?'), ไปทุกวันหรือเปล่า ('vai todo dia?'). Além do tempo, a partícula revela a intenção de quem fala — ไหม sozinho é convite, จะ...ไหม é futuro, ทุกวัน...หรือเปล่า é hábito, เมื่อวานนี้...หรือเปล่า é passado. Por isso o tailandês não precisa de entonação especial: a escolha da partícula já diz o que se quer saber.","en":"The question word can carry the time reference: จะไปไหม 'will you go?', ไปหรือเปล่า 'did you go?', ไปทุกวันหรือเปล่า 'do you go every day?'. It also signals the speaker's purpose — invitation, future, habit, past."},"ex":[["คุณ","kun","khun"],["จะ","jà","cha"],["ไป","bpai","pai"],["ไหม","mǎi","mai"]]},{"t":{"pt":"Perguntar para confirmar o que já se sabe","en":"Asking to confirm what you already believe"},"e":{"pt":"Quando quem pergunta tem quase certeza, a frase inteira afirma a suposição e o ใช่ไหม só pede a confirmação: เขาจะไปซื้อของเมื่อวานนี้ ใช่ไหมครับ ('ele foi às compras ontem, não foi?'). As respostas são ใช่ครับ, ใช่หรือเปล่า quando resta dúvida, ou simplesmente repetir o fato: เขาไปซื้อของมา. Se a certeza é menor, a pergunta entra com กำลังจะ ou กำลัง antes do verbo, e aí cabe หรือครับ no fim.","en":"When the speaker is fairly sure, the whole proposition is stated and ใช่ไหม only asks for confirmation: เขาจะไปซื้อของเมื่อวานนี้ ใช่ไหมครับ. Answers: ใช่ครับ, ใช่หรือเปล่า, or a restatement (เขาไปซื้อของมา). With less certainty the question uses กำลังจะ or กำลัง."},"ex":[["เขา","kǎo","khao"],["จะ","jà","cha"],["ไป","bpai","pai"],["ซื้อ","sʉ́ʉ","sue"],["ของ","kɔ̌ɔng","khong"],["ใช่ไหม","châi-mǎi","chaimai"],["ครับ","kráp","khrap"]]},{"t":{"pt":"Pergunta negativa: a resposta olha o fato","en":"Negative questions: the answer addresses the fact"},"e":{"pt":"Em pergunta negativa — เขาจะไม่ไปซื้อของหรือครับ, คุณไม่ได้ไปซื้อของหรือครับ — a resposta confirma ou nega o FATO, não a forma da pergunta: ไปครับ significa 'sim, ele foi', e ไม่ครับ ou ไม่ได้ไปครับ significa 'não, ele não foi'. Quem fala português ou inglês precisa virar essa chave. Entre íntimos, uma partícula fortemente nasal pode tomar o lugar do ครับ.","en":"In negative questions (เขาจะไม่ไปซื้อของหรือครับ, คุณไม่ได้ไปซื้อของหรือครับ) the answer confirms or denies the fact, not the question's form: ไปครับ = 'yes, he went', ไม่ครับ / ไม่ได้ไปครับ = 'no, he didn't'. Between intimates a strongly nasal particle may replace ครับ."},"ex":[["คุณ","kun","khun"],["ไม่","mâi","mai"],["ได้","dâai","dai"],["ไป","bpai","pai"],["ซื้อ","sʉ́ʉ","sue"],["ของ","kɔ̌ɔng","khong"],["หรือ","rʉ̌ʉ","rue"],["ครับ","kráp","khrap"]]}],"paginas":"vol. 1, p. 135–159"},"10":{"n":10,"titulo":{"pt":"Revisão — a história do senhor John","en":"Review — Mr. John's story"},"dialogo":[{"sp":"N","s":[["คุณ","kun","khun"],["จอห์น","jɔɔn","chon"],["นามสกุล","naam-sà-gun","namsakun"],["สมิท","sà-mít","samit"],["เป็น","bpen","pen"],["คน","kon","khon"],["อเมริกัน","à-mee-rí-gan","amerikan"]],"fsi":"khun coon naamsakun samit pen khon ʔameerikan","en":"Mr. John Smith is an American.","pt":"O senhor John Smith é americano."},{"sp":"N","s":[["เขา","kǎo","khao"],["ทำงาน","tam-ngaan","thamngan"],["ที่","tîi","thi"],["สถานทูต","sà-tǎan-tûut","sathanthut"],["อเมริกัน","à-mee-rí-gan","amerikan"]],"fsi":"kháw thamŋaan thîi sathǎanthûut ʔameerikan","en":"He works at the American embassy.","pt":"Ele trabalha na embaixada americana."},{"sp":"N","s":[["บ้าน","bâan","ban"],["ของ","kɔ̌ɔng","khong"],["เขา","kǎo","khao"],["อยู่","yùu","yu"],["ที่","tîi","thi"],["ถนน","tà-nǒn","thanon"],["วิทยุ","wít-tà-yú","witthayu"]],"fsi":"baan khɔ̌ɔŋ kháw jùu thîi thanǒn witthajú","en":"His house is on Withayu Road.","pt":"A casa dele fica na rua Witthayu."},{"sp":"N","s":[["บ้าน","bâan","ban"],["ของ","kɔ̌ɔng","khong"],["เขา","kǎo","khao"],["ใหญ่","yài","yai"],["และ","lɛ́","lae"],["สบาย","sà-baai","sabai"]],"fsi":"baan khɔ̌ɔŋ kháw jàj lɛ́ɛ sabaaj","en":"His house is big and comfortable.","pt":"A casa dele é grande e confortável."},{"sp":"N","s":[["คุณ","kun","khun"],["จอห์น","jɔɔn","chon"],["มา","maa","ma"],["จาก","jàak","chak"],["เมือง","mʉʉang","mueang"],["เดนเวอร์","deen-wəə","denwoe"],["รัฐ","rát","rat"],["โคโลราโด","koo-loo-raa-doo","kholorado"]],"fsi":"khun coon maa càak mʉaŋ deenwəə rát khoolooraadoo","en":"Mr. John comes from the city of Denver, Colorado.","pt":"O senhor John veio da cidade de Denver, no estado do Colorado."},{"sp":"N","s":[["ภรรยา","pan-rá-yaa","phanraya"],["ของ","kɔ̌ɔng","khong"],["เขา","kǎo","khao"],["ชื่อ","chʉ̂ʉ","chue"],["มาเรีย","maa-riia","maria"]],"fsi":"phanrájaa khɔ̌ɔŋ kháw chʉ̂ʉ maaria","en":"His wife's name is Maria.","pt":"A esposa dele se chama Maria."},{"sp":"N","s":[["มา","maa","ma"],["จาก","jàak","chak"],["เมือง","mʉʉang","mueang"],["สปริงฟิลด์","sà-bpring-fiin","sapringfin"],["รัฐ","rát","rat"],["เวอร์จิเนีย","wəə-jì-niia","woechinia"]],"fsi":"maa càak mʉaŋ sapriŋfiil rát wəəcinia","en":"She comes from the city of Springfield, Virginia.","pt":"Ela veio da cidade de Springfield, no estado da Virgínia."},{"sp":"N","s":[["ภรรยา","pan-rá-yaa","phanraya"],["คุณ","kun","khun"],["จอห์น","jɔɔn","chon"],["สวย","sǔuai","suai"],["มาก","mâak","mak"]],"fsi":"phanrájaa khun coon sǔaj mâak","en":"John's wife is very beautiful.","pt":"A esposa do senhor John é muito bonita."},{"sp":"N","s":[["คุณ","kun","khun"],["จอห์น","jɔɔn","chon"],["พูด","pûut","phut"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"],["เก่ง","gèng","keng"],["มาก","mâak","mak"]],"fsi":"khun coon phûut phaasǎa thaj keŋ mâak","en":"Mr. John speaks Thai very well.","pt":"O senhor John fala tailandês muito bem."},{"sp":"N","s":[["เขา","kǎo","khao"],["เคย","kəəi","khoei"],["เรียน","riian","rian"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"],["ที่","tîi","thi"],["โรงเรียน","roong-riian","rongrian"],["สอน","sɔ̌ɔn","son"],["ภาษา","paa-sǎa","phasa"],["ของ","kɔ̌ɔng","khong"],["กระทรวง","grà-suuang","krasuang"],["ต่างประเทศ","dtàang-bprà-têet","tangprathet"]],"fsi":"kháw khəəj rian phaasǎa thaj thîi rooŋrian sɔ̌ɔn phaasǎa khɔ̌ɔŋ kràsuaŋ tàaŋprathêet","en":"He once studied Thai at the language school of the Ministry of Foreign Affairs.","pt":"Ele estudou tailandês na escola de línguas do Ministério das Relações Exteriores."},{"sp":"N","s":[["เขา","kǎo","khao"],["อ่าน","àan","an"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"],["ได้","dâai","dai"],["ดี","dii","di"],["แต่","dtɛ̀ɛ","tae"],["เขา","kǎo","khao"],["เขียน","kǐian","khian"],["ไม่","mâi","mai"],["เป็น","bpen","pen"]],"fsi":"kháw ʔaan phaasǎa thaj dâj dii tɛ̀ɛ kháw khǐan mâj pen","en":"He can read Thai well, but he can't write it.","pt":"Ele lê tailandês bem, mas não sabe escrever."},{"sp":"N","s":[["เขา","kǎo","khao"],["ชอบ","chɔ̂ɔp","chop"],["พูด","pûut","phut"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"],["กับ","gàp","kap"],["คน","kon","khon"],["ไทย","tai","thai"],["เสมอ","sà-mə̌ə","samoe"]],"fsi":"kháw chɔ̂ɔp phûut phaasǎa thaj kàp khon thaj samə̌ə","en":"He always likes to speak Thai with Thai people.","pt":"Ele gosta de falar tailandês com os tailandeses o tempo todo."},{"sp":"N","s":[["ภรรยา","pan-rá-yaa","phanraya"],["ของ","kɔ̌ɔng","khong"],["เขา","kǎo","khao"],["พูด","pûut","phut"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"],["ได้","dâai","dai"],["ดี","dii","di"],["เหมือนกัน","mʉ̌ʉan-gan","mueankan"]],"fsi":"phanrájaa khɔ̌ɔŋ kháw phûut phaasǎa thaj dâj dii mʉ̌ankan","en":"His wife speaks Thai well too.","pt":"A esposa dele também fala tailandês bem."},{"sp":"N","s":[["เขา","kǎo","khao"],["ไม่","mâi","mai"],["เคย","kəəi","khoei"],["เรียน","riian","rian"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"],["ที่","tîi","thi"],["โรงเรียน","roong-riian","rongrian"]],"fsi":"kháw mâj khəəj rian phaasǎa thaj thîi rooŋrian","en":"She never studied Thai in school.","pt":"Ela nunca estudou tailandês na escola."},{"sp":"N","s":[["เขา","kǎo","khao"],["เรียน","riian","rian"],["จาก","jàak","chak"],["คน","kon","khon"],["ไทย","tai","thai"],["ใน","nai","nai"],["ตลาด","dtà-làat","talat"],["ร้านขายของ","ráan-kǎai-kɔ̌ɔng","rankhaikhong"],["และ","lɛ́","lae"],["ตาม","dtaam","tam"],["ถนน","tà-nǒn","thanon"]],"fsi":"kháw rian càak khon thaj naj talaat raankhǎajkhɔ̌ɔŋ lɛ́ɛ taam thanǒn","en":"She learned from Thai people in the market, in the shops and along the street.","pt":"Ela aprendeu com os tailandeses no mercado, nas lojas e pela rua."}],"notas":[{"t":{"pt":"A resposta curta repete o verbo ou o adjetivo","en":"Short answers repeat the verb or the adjective"},"e":{"pt":"Pergunta feita com verbo como มี ou com adjetivo não se responde com um 'sim' solto: a resposta repete a palavra-chave mais a partícula de educação. ครูมีบุหรี่ไหมครับ vira มีครับ ('tenho') ou ไม่มีครับ ('não tenho'); หนังสือเล่มนี้ดีไหม vira ดีครับ ou ไม่ดีครับ. Repare que o ไม่ gruda sempre no verbo ou no adjetivo, nunca na pergunta — é o mesmo mecanismo do nosso 'tenho'/'não tenho' no lugar de 'sim'/'não'.","en":"Questions built on a verb such as มี or on an adjective are not answered with a bare 'yes': the answer repeats the key word plus the politeness particle. ครูมีบุหรี่ไหมครับ → มีครับ / ไม่มีครับ; หนังสือเล่มนี้ดีไหม → ดีครับ / ไม่ดีครับ. ไม่ always attaches to the verb or the adjective, never to the question."},"ex":[["ครู","kruu","khru"],["มี","mii","mi"],["บุหรี่","bù-rìi","buri"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]]},{"t":{"pt":"este, esse, qual: apoiados no classificador","en":"this, that, which: leaning on the classifier"},"e":{"pt":"นี้ ('este'), นั้น ('esse') e ไหน ('qual') não se grudam no substantivo: quem fica no meio é o classificador. หนังสือเล่มนี้, เก้าอี้ตัวนั้น, ผู้ชายคนไหน. Cada substantivo pede o seu — เล่ม para livros, ตัว para cadeiras, mesas e roupas, คน para pessoas, แท่ง para lápis, ใบ para fotos, xícaras e recipientes, แผ่น para mapas e folhas. Na resposta o classificador volta sozinho no lugar do substantivo: เล่มไหนดี → เล่มนั้นดี.","en":"นี้ 'this', นั้น 'that' and ไหน 'which' never attach to the noun: the classifier stands between them (หนังสือเล่มนี้, เก้าอี้ตัวนั้น, ผู้ชายคนไหน). Each noun takes its own — เล่ม books, ตัว chairs/tables/clothes, คน people, แท่ง pencils, ใบ pictures/cups/containers, แผ่น maps/sheets. In the answer the classifier stands in for the noun: เล่มไหนดี → เล่มนั้นดี."},"ex":[["หนังสือ","nǎng-sʉ̌ʉ","nangsue"],["เล่ม","lêm","lem"],["นี้","níi","ni"],["ดี","dii","di"],["ไหม","mǎi","mai"]]},{"t":{"pt":"เคย: o que a pessoa já fez na vida","en":"เคย: what someone has done in life"},"e":{"pt":"เคย antes do verbo abre a conversa sobre experiência de vida: คุณเคยกินอาหารไทยไหม ('você já comeu comida tailandesa?'). A resposta afirmativa é o próprio เคย — เคยครับ — e a negativa é ไม่เคยครับ, sem verbo nenhum depois. Não entra palavra de tempo: o เคย já significa 'em algum momento da vida', exatamente como o nosso 'já' em 'você já foi lá?'.","en":"เคย before the verb opens talk of life experience: คุณเคยกินอาหารไทยไหม. The affirmative answer is เคย itself — เคยครับ — and the negative is ไม่เคยครับ, with no verb after it. No time word is needed: เคย already means 'at some point in life'."},"ex":[["คุณ","kun","khun"],["เคย","kəəi","khoei"],["กิน","gin","kin"],["อาหาร","aa-hǎan","ahan"],["ไทย","tai","thai"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]]},{"t":{"pt":"เป็น, ได้, เก่ง, ดี: quatro graus de 'saber fazer'","en":"เป็น, ได้, เก่ง, ดี: four degrees of knowing how"},"e":{"pt":"ขับรถเป็น diz que a pessoa aprendeu a dirigir; ขับรถได้ diz que dá para dirigir agora, nesta circunstância; ขับรถเก่ง diz que ela dirige bem. E o ดี qualifica o resultado da ação: อ่านภาษาไทยได้ดี ('lê tailandês bem'). Na pergunta, os quatro aceitam a negativa sem mudar o alvo — ขับรถไม่เป็น, ขับรถไม่ได้, ขับรถไม่เก่ง — e ainda cabe หรือครับ no fim para pedir confirmação.","en":"เป็น marks a learned skill, ได้ marks what is possible in the circumstances, เก่ง says you are good at it, and ดี grades the result (อ่านภาษาไทยได้ดี). All four take a negative question without shifting the target: ขับรถไม่เป็น / ไม่ได้ / ไม่เก่ง, optionally with หรือครับ at the end."},"ex":[["คุณ","kun","khun"],["ขับ","kàp","khap"],["รถ","rót","rot"],["เป็น","bpen","pen"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]]},{"t":{"pt":"Pergunta no negativo: ไหม, ไม่...หรือ, หรือไม่","en":"Negative questions: ไหม, ไม่...หรือ, หรือไม่"},"e":{"pt":"Os drills desta lição mostram que dá para negativar tanto a pergunta quanto a resposta, e o sentido muda pouco. คุณขับรถเป็นไหมครับ é neutro; คุณขับรถไม่เป็นหรือครับ já pressupõe que a pessoa não sabe dirigir. Em qualquer um dos casos a resposta olha o FATO: เป็นครับ ('sim, sei') ou ไม่เป็นครับ ('não, não sei'). O mesmo vale com ไม่...ได้: คุณขับรถไม่ได้หรือครับ.","en":"The drills show that either the question or the answer may be negated with little change of meaning. คุณขับรถเป็นไหมครับ is neutral; คุณขับรถไม่เป็นหรือครับ presupposes the person cannot drive. In both cases the answer addresses the fact: เป็นครับ / ไม่เป็นครับ. The same holds for ไม่...ได้: คุณขับรถไม่ได้หรือครับ."},"ex":[["คุณ","kun","khun"],["ขับ","kàp","khap"],["รถ","rót","rot"],["ไม่","mâi","mai"],["เป็น","bpen","pen"],["หรือ","rʉ̌ʉ","rue"],["ครับ","kráp","khrap"]]},{"t":{"pt":"อยู่ไหม para gente, อยู่หรือเปล่า para coisas","en":"อยู่ไหม for people, อยู่หรือเปล่า for things"},"e":{"pt":"O livro separa os dois padrões de propósito, e é uma distinção que vale levar para a fala. Quando o sujeito é uma pessoa, a pergunta é ...อยู่ไหม e a resposta negativa é ไม่อยู่: หมออยู่ไหม → ไม่อยู่ครับ ('o médico saiu'). Quando o sujeito é um lugar ou um objeto, entra o ...หรือเปล่า e a negativa é ไม่ได้อยู่: บ้านคุณอยู่ถนนสาทรหรือเปล่า → ไม่ได้อยู่ครับ. Ou seja: para gente se pergunta se a pessoa está lá; para coisas se confere um fato.","en":"The book keeps the two patterns apart on purpose. With an animate subject the question is ...อยู่ไหม and the negative answer ไม่อยู่ (หมออยู่ไหม → ไม่อยู่ครับ). With an inanimate subject it is ...หรือเปล่า and the negative answer ไม่ได้อยู่ (บ้านคุณอยู่ถนนสาทรหรือเปล่า → ไม่ได้อยู่ครับ). People are asked whether they are in; things are checked against a fact."},"ex":[["หมอ","mɔ̌ɔ","mo"],["อยู่","yùu","yu"],["ไหม","mǎi","mai"]]},{"t":{"pt":"เมื่อวานนี้, จะ e กำลังจะ na mesma moldura","en":"เมื่อวานนี้, จะ and กำลังจะ in the same frame"},"e":{"pt":"As três perguntas sobre o tempo usam a mesma estrutura: só o marcador muda. เมื่อวานนี้ + verbo + หรือเปล่า pergunta pelo passado, e a negativa é ไม่ได้ + verbo: เมื่อวานนี้ไปธนาคารหรือเปล่า → ไม่ได้ไป. จะ + verbo + หรือเปล่า joga para o futuro: เขาจะไปซื้อของหรือเปล่า. E กำลังจะ + verbo + หรือครับ pergunta pelo que está para acontecer neste instante: คุณกำลังจะไปซื้อของหรือครับ ('você está de saída para as compras?').","en":"The three time frames share one structure — only the marker changes. เมื่อวานนี้ + verb + หรือเปล่า asks about the past, with ไม่ได้ + verb as the negative (เมื่อวานนี้ไปธนาคารหรือเปล่า → ไม่ได้ไป); จะ + verb + หรือเปล่า asks about the future; กำลังจะ + verb + หรือครับ asks about what is on the point of happening now."},"ex":[["เมื่อวานนี้","mʉ̂ʉa-waan-níi","mueawanni"],["คุณ","kun","khun"],["ไป","bpai","pai"],["ธนาคาร","tá-naa-kaan","thanakhan"],["หรือ","rʉ̌ʉ","rue"],["เปล่า","bplàao","plao"]]},{"t":{"pt":"Convite com ด้วยกันไหม e a recusa educada","en":"Invitations with ด้วยกันไหม and polite refusals"},"e":{"pt":"Convidar é juntar o verbo, o destino, ด้วยกัน ('juntos') e o ไหม: ไปกินข้าวด้วยกันไหม, ไปดูหนังด้วยกันไหม, ไปรับเพื่อนที่สถานีรถไฟด้วยกันไหม. A resposta positiva é simplesmente ไปครับ — o 'vamos' já está no ไป. A negativa é ไม่ไปครับ ou, mais suave, ไปไม่ได้ครับ. Note que a resposta nunca repete o ด้วยกัน.","en":"An invitation joins verb, destination, ด้วยกัน 'together' and ไหม: ไปกินข้าวด้วยกันไหม, ไปดูหนังด้วยกันไหม, ไปรับเพื่อนที่สถานีรถไฟด้วยกันไหม. The positive answer is simply ไปครับ; the negative ไม่ไปครับ or, softer, ไปไม่ได้ครับ. The answer never repeats ด้วยกัน."},"ex":[["ไป","bpai","pai"],["กิน","gin","kin"],["ข้าว","kâao","khao"],["ด้วยกัน","dûuai-gan","duaikan"],["ไหม","mǎi","mai"]]},{"t":{"pt":"แต่ junta duas frases que se opõem","en":"แต่ joins two contrasting sentences"},"e":{"pt":"แต่ é o nosso 'mas' e permite fundir duas frases inteiras numa só, sem repetir o sujeito: เขาพูดภาษาไทยเป็น แต่เขียนไม่เป็น. Na segunda metade cai tudo o que já ficou claro — em vez de เขาพูดภาษาไทยเก่งแต่เขาทำงานไม่เก่ง, basta เขาพูดเก่งแต่ทำงานไม่เก่ง. É o mesmo enxugamento de 'ele fala bem, mas trabalha mal', e é o que o episódio faz com o senhor John.","en":"แต่ works like 'but' and fuses two whole sentences without repeating the subject: เขาพูดภาษาไทยเป็น แต่เขียนไม่เป็น. Everything already clear drops out of the second half — instead of เขาพูดภาษาไทยเก่งแต่เขาทำงานไม่เก่ง, just เขาพูดเก่งแต่ทำงานไม่เก่ง."},"ex":[["เขา","kǎo","khao"],["พูด","pûut","phut"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"],["เป็น","bpen","pen"],["แต่","dtɛ̀ɛ","tae"],["เขียน","kǐian","khian"],["ไม่","mâi","mai"],["เป็น","bpen","pen"]]}],"paginas":"vol. 1, p. 160–170"},"11":{"n":11,"titulo":{"pt":"Na escola de línguas","en":"At the Language School"},"dialogo":[{"sp":"A","s":[["ที่","tîi","thi"],["โรงเรียน","roong-riian","rongrian"],["สอน","sɔ̌ɔn","son"],["ภาษา","paa-sǎa","phasa"],["ที่","tîi","thi"],["คุณ","kun","khun"],["เรียน","riian","rian"],["มี","mii","mi"],["คน","kon","khon"],["ไทย","tai","thai"],["หลาย","lǎai","lai"],["คน","kon","khon"],["ไหม","mǎi","mai"]],"fsi":"thîi rooŋrian sɔ̌ɔn phaasǎa thîi khun rian mii khon thaj lǎaj khon máj","en":"At the language school where you studied are there many Thais?","pt":"Na escola de línguas onde você estudou, há muitos tailandeses?"},{"sp":"B","s":[["หลาย","lǎai","lai"],["คน","kon","khon"]],"fsi":"lǎaj khon","en":"Yes, many.","pt":"Há, vários."},{"sp":"A","s":[["มี","mii","mi"],["นักเรียน","nák-riian","nakrian"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"],["เท่าไร","tâo-rài","thaorai"]],"fsi":"mii nákrian phaasǎa thaj thâawraj","en":"How many Thai language students are there?","pt":"Quantos alunos de tailandês há?"},{"sp":"B","s":[["ไม่","mâi","mai"],["ทราบ","sâap","sap"],["ครับ","kráp","khrap"]],"fsi":"mâj sâap khráp","en":"I don't know.","pt":"Não sei."},{"sp":"A","s":[["ใน","nai","nai"],["ชั้น","chán","chan"],["คุณ","kun","khun"],["มี","mii","mi"],["นักเรียน","nák-riian","nakrian"],["กี่","gìi","ki"],["คน","kon","khon"]],"fsi":"naj chán khun mii nákrian kìi khon","en":"How many students are there in your class?","pt":"Quantos alunos há na sua turma?"},{"sp":"B","s":[["ห้า","hâa","ha"],["คน","kon","khon"],["ครับ","kráp","khrap"]],"fsi":"hâa khon khráp","en":"Five.","pt":"Cinco."},{"sp":"A","s":[["คุณ","kun","khun"],["เรียน","riian","rian"],["อะไร","à-rai","arai"],["บ้าง","bâang","bang"]],"fsi":"khun rian ʔaraj bâaŋ","en":"What (things) are you studying?","pt":"O que você estuda?"},{"sp":"B","s":[["อ่าน","àan","an"],["พูด","pûut","phut"],["เขียน","kǐian","khian"],["และ","lɛ́","lae"],["แปล","bplɛɛ","plae"]],"fsi":"ʔaan phûut khǐan lɛ́ɛ plɛɛ","en":"Reading, speaking, writing, and translating.","pt":"Leitura, fala, escrita e tradução."},{"sp":"A","s":[["เขา","kǎo","khao"],["สอน","sɔ̌ɔn","son"],["ภาษา","paa-sǎa","phasa"],["อะไร","à-rai","arai"],["บ้าง","bâang","bang"]],"fsi":"kháw sɔ̌ɔn phaasǎa ʔaraj bâaŋ","en":"What languages do they teach?","pt":"Que línguas eles ensinam?"},{"sp":"B","s":[["หลาย","lǎai","lai"],["ภาษา","paa-sǎa","phasa"],["ครับ","kráp","khrap"]],"fsi":"lǎaj phaasǎa khráp","en":"Many languages.","pt":"Muitas línguas."},{"sp":"B","s":[["มี","mii","mi"],["ภาษา","paa-sǎa","phasa"],["ญวน","yuuan","yuan"],["ลาว","laao","lao"],["ฝรั่งเศส","fà-ràng-sèet","farangset"],["สเปน","sà-bpeen","sapen"],["และ","lɛ́","lae"],["อื่นๆ","ʉ̀ʉn-ʉ̀ʉn","uenuen"]],"fsi":"mii phaasǎa juan laaw faràŋsèet sapeen lɛ́ɛ ỳyn ỳyn","en":"Vietnamese, Lao, French, Spanish, and other languages.","pt":"Vietnamita, laociano, francês, espanhol e outras línguas."},{"sp":"A","s":[["มี","mii","mi"],["ครู","kruu","khru"],["ชาติ","châat","chat"],["ต่างๆ","dtàang-dtàang","tangtang"],["ทั้งหมด","táng-mòt","thangmot"],["เท่าไร","tâo-rài","thaorai"],["ครับ","kráp","khrap"]],"fsi":"mii khruu châat tàaŋ tàaŋ (tháŋmòt) thâawraj khráp","en":"Altogether how many teachers of different nationalities are there?","pt":"Ao todo, quantos professores de nacionalidades diferentes há?"},{"sp":"B","s":[["หลาย","lǎai","lai"],["สิบ","sìp","sip"],["คน","kon","khon"],["ครับ","kráp","khrap"]],"fsi":"lǎaj sip khon khráp","en":"Several tens (less than a hundred).","pt":"Várias dezenas (menos de cem)."}],"notas":[{"t":{"pt":"กัน: plural do sujeito e ação recíproca","en":"กัน: plural subject and mutual action"},"e":{"pt":"กัน fica no fim da frase e faz dois trabalhos. O primeiro é pluralizar o sujeito: ปิดประตูกัน é 'fechem a porta' dito a um grupo. O segundo é dizer que duas ou mais pessoas participam da mesma ação, umas com as outras. Compare: ครูพูดภาษาไทยกับนักเรียน ('o professor fala tailandês com o aluno'), นักเรียนพูดภาษาไทยกับครู ('o aluno fala tailandês com o professor') e ครูและนักเรียนพูดภาษาไทยกัน ('professor e aluno falam tailandês entre si'). É o papel do nosso 'se' em 'eles se falam': a mesma palavrinha marca o grupo e a troca.","en":"กัน sits at the end of the sentence and does two jobs: it pluralizes the subject (ปิดประตูกัน 'you (pl.) shut the door') and it marks that two or more people are mutually involved. Compare ครูพูดภาษาไทยกับนักเรียน, นักเรียนพูดภาษาไทยกับครู and ครูและนักเรียนพูดภาษาไทยกัน 'the teacher and the student speak Thai with each other'."},"ex":[["ครู","kruu","khru"],["และ","lɛ́","lae"],["นักเรียน","nák-riian","nakrian"],["พูด","pûut","phut"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"],["กัน","gan","kan"]]},{"t":{"pt":"อะไร, ใคร e ไหน perguntam e também indefinem","en":"อะไร, ใคร and ไหน are interrogative and indefinite"},"e":{"pt":"As três palavras valem como pergunta e como indefinido, e nunca mudam para o plural: อะไร serve tanto para 'o quê' quanto para 'alguma coisa'. Dentro de uma negativa, o sentido vira obrigatoriamente indefinido — ผมไม่ได้ดูอะไร ('não vi nada'), ไม่มีใครทราบ ('ninguém sabe'), คุณไม่ได้ไปไหนหรือ ('você não foi a lugar nenhum?'). É exatamente o jogo do nosso 'algum / nenhum': a forma é uma só, e quem decide é a negativa em volta.","en":"All three carry both an interrogative and an indefinite reading, and neither is marked for number. In negative sentences the reading is indefinite: ผมไม่ได้ดูอะไร 'I didn't see anything', ไม่มีใครทราบ 'no one knows', คุณไม่ได้ไปไหนหรือ 'didn't you go anywhere?'."},"ex":[["ไม่","mâi","mai"],["มี","mii","mi"],["ใคร","krai","khrai"],["ทราบ","sâap","sap"]]},{"t":{"pt":"บ้าง transforma a pergunta em lista","en":"บ้าง turns the question into a request for a list"},"e":{"pt":"Juntar บ้าง depois de อะไร, ใคร ou ไหน pede vários itens de uma vez, não um só: มีหนังสืออะไรบ้าง ('que livros há?'), คุณจะไปที่ไหนบ้าง ('a que lugares você vai?'), คุณพูดภาษาไทยกับใครบ้าง ('com quem você fala tailandês?'). O บ้าง avisa que a resposta esperada é uma enumeração. Pense no nosso 'assim, uns...' em 'o que você comprou assim, uns livros?' — a partícula sinaliza que a lista pode ser longa.","en":"Adding บ้าง after อะไร, ใคร or ไหน makes the question ask for several items at once: มีหนังสืออะไรบ้าง 'what books are there?', คุณจะไปไหนบ้าง 'what places are you going to?', คุณพูดภาษาไทยกับใครบ้าง 'who all do you speak Thai with?'. It signals that the expected answer is a list."},"ex":[["มี","mii","mi"],["หนังสือ","nǎng-sʉ̌ʉ","nangsue"],["อะไร","à-rai","arai"],["บ้าง","bâang","bang"]]},{"t":{"pt":"Palavras de quantidade vêm antes do classificador","en":"Quantity words come before the classifier"},"e":{"pt":"Numeral, aqui, é tudo o que expressa quantidade: os cardinais e mais algumas palavras como หลาย ('vários'), บ้าง ('alguns'), กี่ ('quantos'), ทุก ('todo, cada'), น้อย ('poucos') e ไม่กี่ ('não muitos'). Eles entram sempre ANTES do classificador, que por sua vez vem depois do substantivo: ครูหลายคน ('vários professores'), หนังสือบางเล่ม ('alguns livros'), ดินสอไม่กี่แท่ง ('poucos lápis'), นักเรียนน้อยคน ('poucos alunos'). É a mesma ordem do português 'três xícaras de café': o número nunca se gruda direto no substantivo.","en":"Numerals cover the cardinals plus quantity words: หลาย 'many/several', บ้าง 'some', กี่ 'how many', ทุก 'every', น้อย 'few', ไม่กี่ 'not many'. They occur before the classifier, which follows the noun: ครูหลายคน 'several teachers', หนังสือบางเล่ม 'some books', ดินสอไม่กี่แท่ง 'not many pencils', นักเรียนน้อยคน 'few students'."},"ex":[["ครู","kruu","khru"],["หลาย","lǎai","lai"],["คน","kon","khon"]]},{"t":{"pt":"O sistema decimal tailandês","en":"The Thai decimal system"},"e":{"pt":"Tudo se monta a partir de 1 a 10: หนึ่ง สอง สาม สี่ ห้า หก เจ็ด แปด เก้า สิบ. As dezenas multiplicam — สามสิบ é 3 × 10, เจ็ดสิบ é 7 × 10 — e o vinte é a exceção, ยี่สิบ. O que sobra vem depois: สิบสาม é 10 + 3, สามสิบสี่ é 3 × 10 + 4. E o 'um' na ponta nunca é หนึ่ง, e sim เอ็ด: ยี่สิบเอ็ด (21), ห้าสิบเอ็ด (51). Acima vêm ร้อย (100), พัน (1.000), หมื่น (10.000), แสน (100.000) e ล้าน (1.000.000), sempre por soma e não por multiplicação do excedente: 15.000 é หมื่นห้าพัน, nunca สิบห้าพัน; 450.000 é สี่แสนห้าหมื่น.","en":"Everything is built from 1–10 (หนึ่ง…สิบ). Tens multiply (สามสิบ = 3 × 10), except twenty = ยี่สิบ; the remainder follows (สิบสาม = 13, สามสิบสี่ = 34). A final 'one' is เอ็ด, not หนึ่ง (ยี่สิบเอ็ด 21, ห้าสิบเอ็ด 51). Then ร้อย 100, พัน 1,000, หมื่น 10,000, แสน 100,000, ล้าน 1,000,000 — always by addition: 15,000 is หมื่นห้าพัน (not สิบห้าพัน), 450,000 is สี่แสนห้าหมื่น."},"ex":[["สี่","sìi","si"],["ร้อย","rɔ́ɔi","roi"],["ยี่สิบ","yîi-sìp","yisip"],["สาม","sǎam","sam"]]},{"t":{"pt":"ที่ encaixa uma frase dentro da outra","en":"ที่ embeds one sentence inside another"},"e":{"pt":"Uma frase inteira pode funcionar como modificador de um pedaço da outra, e o ที่ é a dobradiça: de หนังสือดี ('o livro é bom') e เขาเขียน ('ele escreve') nasce หนังสือที่เขาเขียนดี ('os livros que ele escreve são bons'). É o mesmo serviço do nosso 'que' relativo. Se o substantivo já vem especificado por um classificador, o ที่ apenas aponta qual: หนังสือเล่มนั้นดี vira หนังสือเล่มที่เขาเขียนดี ('o livro que ele escreveu é bom'), e a resposta para หนังสือเล่มไหนดี pode ser só เล่มที่เขาเขียน.","en":"A whole sentence may serve as modifier or specifier of part of another, with ที่ as the connector: หนังสือดี + เขาเขียน → หนังสือที่เขาเขียนดี 'the books he writes are good'. When the noun is already specified by a classifier, ที่ picks out which one: หนังสือเล่มที่เขาเขียนดี 'the book he wrote is good', and หนังสือเล่มไหนดี can be answered เล่มที่เขาเขียน."},"ex":[["หนังสือ","nǎng-sʉ̌ʉ","nangsue"],["ที่","tîi","thi"],["เขา","kǎo","khao"],["เขียน","kǐian","khian"],["ดี","dii","di"]]},{"t":{"pt":"อื่น é 'outro diferente'; อื่น ๆ é 'os outros'","en":"อื่น means a different one; อื่น ๆ means others"},"e":{"pt":"อื่น quer dizer 'outro' no sentido de DIFERENTE, não de mais um do mesmo tipo: ภาษาอื่น é 'outra língua', uma que não essa. Redobrado, อื่น ๆ funciona como pluralizador depois do substantivo — ภาษาอื่น ๆ, 'outras línguas' — e a fórmula และอื่น ๆ no fim de uma enumeração é o nosso 'etc.' (literalmente 'e outras'). A distinção importa na prática: para pedir mais um igual o tailandês usa อีก, e para pedir um diferente é อื่น.","en":"อื่น means 'other' in the sense of a different one, not an additional one of the same kind: ภาษาอื่น 'another (different) language'. Reduplicated, อื่น ๆ acts as a pluralizer after a noun (ภาษาอื่น ๆ 'other languages'), and และอื่น ๆ at the end of a list is 'etcetera' (lit. 'and others')."},"ex":[["ภาษา","paa-sǎa","phasa"],["อื่นๆ","ʉ̀ʉn-ʉ̀ʉn","uenuen"]]}],"paginas":"vol. 1, p. 171–190"},"12":{"n":12,"titulo":{"pt":"Minha família","en":"My Family"},"dialogo":[{"sp":"A","s":[["คุณ","kun","khun"],["มี","mii","mi"],["พี่น้อง","pîi-nɔ́ɔng","phinong"],["หลาย","lǎai","lai"],["คน","kon","khon"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"khun mii phîinɔ́ɔŋ lǎaj khon máj khráp","en":"Do you have many brothers and sisters?","pt":"Você tem muitos irmãos e irmãs?"},{"sp":"B","s":[["คุณพ่อ","kun-pɔ̂ɔ","khunpho"],["คุณแม่","kun-mɛ̂ɛ","khunmae"],["ผม","pǒm","phom"],["มี","mii","mi"],["ลูก","lûuk","luk"],["ห้า","hâa","ha"],["คน","kon","khon"],["ครับ","kráp","khrap"]],"fsi":"khun phɔ̂ɔ khun mɛ̂ɛ phǒm mii lûuk hâa khon khráp","en":"My parents have five children.","pt":"Meus pais têm cinco filhos."},{"sp":"A","s":[["คุณ","kun","khun"],["เป็น","bpen","pen"],["คน","kon","khon"],["ที่","tîi","thi"],["เท่าไร","tâo-rài","thaorai"]],"fsi":"khun pen khon thîi thâawraj","en":"Which are you?","pt":"Você é o número quantos?"},{"sp":"B","s":[["ผม","pǒm","phom"],["เป็น","bpen","pen"],["คนกลาง","kon-glaang","khonklang"]],"fsi":"phǒm pen khonklaaŋ","en":"I'm the middle one.","pt":"Eu sou o do meio."},{"sp":"B","s":[["มี","mii","mi"],["พี่ชาย","pîi-chaai","phichai"],["สอง","sɔ̌ɔng","song"],["คน","kon","khon"],["น้องสาว","nɔ́ɔng-sǎao","nongsao"],["สอง","sɔ̌ɔng","song"],["คน","kon","khon"]],"fsi":"mii phîichaaj sɔ̌ɔŋ khon nɔ́ɔŋsǎaw sɔ̌ɔŋ khon","en":"There are two older brothers, two younger sisters.","pt":"Tenho dois irmãos mais velhos e duas irmãs mais novas."},{"sp":"A","s":[["พี่ชาย","pîi-chaai","phichai"],["ของ","kɔ̌ɔng","khong"],["คุณ","kun","khun"],["แต่งงาน","dtɛ̀ng-ngaan","taengngan"],["หรือยัง","rʉ̌ʉ-yang","rueyang"]],"fsi":"phîichaaj khɔ̌ɔŋ khun tɛ̀ŋŋaan rʉ̌ʉjaŋ","en":"Are your older brothers married (yet)?","pt":"Seus irmãos mais velhos já casaram?"},{"sp":"B","s":[["แต่ง","dtɛ̀ng","taeng"],["แล้ว","lɛ́ɛo","laeo"],["คน","kon","khon"],["หนึ่ง","nʉ̀ng","nueng"],["อีก","ìik","ik"],["คน","kon","khon"],["หนึ่ง","nʉ̀ng","nueng"],["ยัง","yang","yang"],["เป็น","bpen","pen"],["โสด","sòot","sot"]],"fsi":"tɛ̀ŋ lɛ́ɛw khon nʉ̀ŋ ʔìik khon nʉ̀ŋ jaŋ pen sòot","en":"One is married, and one is (still) single.","pt":"Um já casou, o outro ainda é solteiro."},{"sp":"A","s":[["ขอโทษ","kɔ̌ɔ-tôot","khothot"],["แล้ว","lɛ́ɛo","laeo"],["คุณ","kun","khun"],["ล่ะ","lâ","la"],["ครับ","kráp","khrap"]],"fsi":"khɔ̌ɔthôot lɛ́ɛw khun lâ khráp","en":"And you?","pt":"Desculpe. E você?"},{"sp":"B","s":[["ผม","pǒm","phom"],["มี","mii","mi"],["ครอบครัว","krɔ̂ɔp-kruua","khropkhrua"],["แล้ว","lɛ́ɛo","laeo"],["ครับ","kráp","khrap"]],"fsi":"phǒm mii khrɔ̂ɔpkhrua lɛ́ɛw khráp","en":"I have a family.","pt":"Eu já tenho família."},{"sp":"A","s":[["ขอโทษ","kɔ̌ɔ-tôot","khothot"],["คุณ","kun","khun"],["มี","mii","mi"],["บุตร","bùt","but"],["หรือเปล่า","rʉ̌ʉ-bplàao","rueplao"],["ครับ","kráp","khra
