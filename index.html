p"]],"fsi":"khɔ̌ɔthôot khun mii bùt rʉ̌ʉplàaw khráp","en":"Do you have children?","pt":"Você tem filhos?"},{"sp":"B","s":[["มี","mii","mi"],["คน","kon","khon"],["เดียว","diiao","diao"],["ครับ","kráp","khrap"]],"fsi":"mii khon diaw khráp","en":"I have only one.","pt":"Só um."},{"sp":"B","s":[["เป็น","bpen","pen"],["ผู้ชาย","pûu-chaai","phuchai"]],"fsi":"pen phûuchaaj","en":"He's a boy.","pt":"É menino."},{"sp":"A","s":[["อายุ","aa-yú","ayu"],["เท่าไร","tâo-rài","thaorai"],["ครับ","kráp","khrap"]],"fsi":"ʔaajú thâawraj khráp","en":"How old is he?","pt":"Quantos anos ele tem?"},{"sp":"B","s":[["หก","hòk","hok"],["ขวบ","kùuap","khuap"],["ครับ","kráp","khrap"]],"fsi":"hòk khùap khráp","en":"Six.","pt":"Seis."}],"notas":[{"t":{"pt":"A árvore da família tailandesa","en":"The Thai family tree"},"e":{"pt":"O tailandês nunca diz só 'irmão': diz se é mais velho ou mais novo e se é homem ou mulher. พี่ cobre irmão e/ou irmã mais velho; น้อง, os mais novos. Juntando o sexo vêm พี่ชาย (irmão mais velho), พี่สาว (irmã mais velha), น้องชาย (irmão mais novo) e น้องสาว (irmã mais nova); พี่น้อง, sem mais nada, é 'irmãos' em geral. Os filhos são ลูกชาย e ลูกสาว, e a ordem de nascimento se marca com คน: คนโต (o mais velho), คนกลาง (o do meio), คนเล็ก ou คนสุดท้อง (o caçula). ลูก é a palavra do dia a dia para filho; บุตร diz o mesmo com roupa de cerimônia. Repare ainda que a posição do número muda o sentido: ลูกคนหนึ่ง é 'um filho', ลูกหนึ่งคน é 'um (quantidade) filho' e ลูกคนเดียว é 'filho único'.","en":"Thai always marks relative age and sex. พี่ = older sibling(s), น้อง = younger sibling(s); พี่ชาย older brother, พี่สาว older sister, น้องชาย younger brother, น้องสาว younger sister, and พี่น้อง siblings in general. Children are ลูกชาย (son) and ลูกสาว (daughter); birth order uses คน: คนโต oldest, คนกลาง middle, คนเล็ก / คนสุดท้อง youngest. ลูก is the everyday word for 'child', บุตร the more formal one. Word order also shifts meaning: ลูกคนหนึ่ง 'a child', ลูกหนึ่งคน 'one child', ลูกคนเดียว 'only one child'."},"ex":[["พี่ชาย","pîi-chaai","phichai"],["น้องสาว","nɔ́ɔng-sǎao","nongsao"]]},{"t":{"pt":"แต่งงาน: casar é 'enfeitar a festa'","en":"แต่งงาน: marrying is 'adorning the ceremony'"},"e":{"pt":"แต่งงาน junta แต่ง ('enfeitar, adornar') com งาน ('cerimônia, festa, evento'): ao pé da letra, 'enfeitar a cerimônia'. O verbo é แต่ง, e งาน funciona como complemento nominal. Por isso, na resposta, basta o verbo — ninguém repete งาน: แต่งแล้วครับ, 'já casei'. É como o nosso 'subir ao altar', que inteiro explica tudo e na prática todo mundo encurta.","en":"แต่งงาน = แต่ง 'to decorate, adorn' + งาน 'ceremony, event' — literally 'to adorn the ceremony'. แต่ง is the verb and งาน its noun complement, so in answers only the verb is needed: แต่งแล้วครับ '(I'm) married already'."},"ex":[["แต่ง","dtɛ̀ng","taeng"],["แล้ว","lɛ́ɛo","laeo"],["คน","kon","khon"],["หนึ่ง","nʉ̀ng","nueng"]]},{"t":{"pt":"Ordinais: ที่ + número, colado no classificador","en":"Ordinals: ที่ + number, right after the classifier"},"e":{"pt":"Para dizer 'segundo', 'terceiro', o tailandês usa ที่ + cardinal: ที่สี่ (quarto), ที่เจ็ด (sétimo), ที่ร้อย (centésimo). No lugar do número cabe a pergunta ที่เท่าไร ('o de número quantos?'). O bloco vem sempre imediatamente depois do classificador, formando uma peça só com ele: ลูกคนที่สาม ('o terceiro filho'), หนังสือเล่มที่เจ็ด ('o sétimo livro'), รถคันที่สอง ('o segundo carro'). A ordem é substantivo + classificador + ที่ + número — pense em 'o item número três da prateleira'.","en":"Ordinals are ที่ + a cardinal: ที่สี่ 'fourth', ที่เจ็ด 'seventh', ที่ร้อย 'hundredth', with ที่เท่าไร 'which (in order)?' as the question form. They occur immediately after classifiers and form a construction with them: ลูกคนที่สาม 'the third child', หนังสือเล่มที่เจ็ด 'the seventh book', รถคันที่สอง 'the second car'. Order: noun + classifier + ที่ + number."},"ex":[["ลูก","lûuk","luk"],["คน","kon","khon"],["ที่","tîi","thi"],["สาม","sǎam","sam"]]},{"t":{"pt":"แรก e ที่หนึ่ง: dois 'primeiros' diferentes","en":"แรก and ที่หนึ่ง: two different 'firsts'"},"e":{"pt":"แรก é o primeiro no tempo, na qualidade, numa sequência de acontecimentos ou a contar da origem. Por isso ลูกศิษย์คนแรก é 'o primeiro aluno que ele teve', รถคันแรก é 'o primeiro carro (que tive)' e ภาษาต่างประเทศภาษาแรกที่ผมเรียน é 'a primeira língua estrangeira que estudei'. Já ที่หนึ่ง aponta o primeiro item de uma série NUMERADA: ชั้นที่หนึ่ง ('o primeiro andar'), บทที่หนึ่ง ('a lição um'). Regra prática: se a série tem número impresso, use ที่หนึ่ง; se é uma experiência ou uma fileira de acontecimentos, use แรก.","en":"แรก means first in time, in quality, in a series or sequence, or reckoning from the point of origin: ลูกศิษย์คนแรก 'his first student', รถคันแรก 'my first car', ภาษาต่างประเทศภาษาแรกที่ผมเรียน 'the first foreign language I studied'. ที่หนึ่ง refers to the first item in a numbered series: ชั้นที่หนึ่ง 'the first floor', บทที่หนึ่ง 'lesson one'."},"ex":[["บท","bòt","bot"],["ที่","tîi","thi"],["หนึ่ง","nʉ̀ng","nueng"]]},{"t":{"pt":"Idade: อายุ é substantivo, não verbo","en":"Age: อายุ is a noun, not a verb"},"e":{"pt":"Idade em tailandês é uma equação entre dois blocos nominais, sem verbo nenhum no meio: เขาอายุยี่สิบปี, literalmente 'ele idade vinte anos'. Para perguntar, o normal é อายุเท่าไร; com gente nova cabe também อายุกี่ปี. A resposta é o número + ปี — mas, para quem tem menos de 12 anos (o vocabulário do livro fala em menos de 14), o contador é ขวบ no lugar de ปี: หกขวบ, 'seis anos'. É o mesmo molde do nosso 'ele tem vinte anos', só que sem o 'tem'.","en":"อายุ is a noun, so age appears in an equational sentence, Noun Phrase = Noun Phrase: เขาอายุยี่สิบปี 'he (is) age-20-years'. In questions อายุเท่าไร is the general form and อายุกี่ปี is used for younger people. The answer is number + ปี, but number + ขวบ for people under 12 (the vocabulary says under 14): หกขวบ '(he's) six'."},"ex":[["อายุ","aa-yú","ayu"],["เท่าไร","tâo-rài","thaorai"],["ครับ","kráp","khrap"]]},{"t":{"pt":"แล้วหรือยัง: a pergunta do 'já?'","en":"แล้วหรือยัง: the 'yet?' question"},"e":{"pt":"แล้วหรือยัง serve para saber se a ação chegou ao fim. Na fala o แล้ว costuma cair ou encolher, e sobra o หรือยัง; quando se fala muito depressa aparece só o ยัง. As respostas são duas: ยัง ('ainda não') ou verbo + แล้ว ('já'). Você ouve isso toda hora: คุณทานข้าวแล้วหรือยัง → ยังครับ ('ainda não') ou ทานแล้วครับ ('já comi'). É exatamente o nosso 'já comeu?' — 'ainda não' / 'já'.","en":"แล้วหรือยัง asks whether an action is complete. แล้ว is often omitted or reduced, leaving หรือยัง or, in very rapid speech, just ยัง. The answers are either ยัง 'not yet' or verb + แล้ว 'done': คุณทานข้าวแล้วหรือยัง → ยังครับ / ทานแล้วครับ."},"ex":[["คุณ","kun","khun"],["ทาน","taan","than"],["ข้าว","kâao","khao"],["แล้ว","lɛ́ɛo","laeo"],["หรือยัง","rʉ̌ʉ-yang","rueyang"]]},{"t":{"pt":"ยังไม่ e ยังไม่ได้: duas negações do 'ainda'","en":"ยังไม่ and ยังไม่ได้: two negatives with 'yet'"},"e":{"pt":"ยัง nem sempre nega: เขายังอยู่ที่นี่ é afirmativo, 'ela ainda está aqui'. A negação vem em dois sabores. เขายังไม่ไป = 'ela ainda não foi' — não quis ou não precisou, mas pode ir. เขายังไม่ได้ไป = 'ela poderia (ou deveria) ter ido, mas não foi' — fica o gosto de pendência, de tarefa que ficou para trás. Em português a diferença aparece em 'ainda não fui' × 'acabei não indo'; no tailandês, ela mora no ได้.","en":"ยัง is not always negative: เขายังอยู่ที่นี่ 'she's still here'. เขายังไม่ไป = 'she hasn't gone yet' (she doesn't want or need to, but may still go); เขายังไม่ได้ไป = 'she could or should have gone, but didn't' (see 5.2a)."},"ex":[["เขา","kǎo","khao"],["ยัง","yang","yang"],["ไม่","mâi","mai"],["ได้","dâai","dai"],["ไป","bpai","pai"]]},{"t":{"pt":"คนเดียว e กันหลายคน vêm depois do verbo","en":"คนเดียว and กันหลายคน follow the verb"},"e":{"pt":"Quando um bloco de classificador com เดียว ('só, um único') ou com หลาย ('vários') se refere ao próprio sujeito da frase, ele vai para depois do verbo, em geral bem no fim: เขาไปคนเดียว ('ele foi sozinho'), เขาไปกันหลายคน ('foram vários juntos'). Repare no กัน, que é o que dá a ideia de 'em grupo'. No diálogo o mesmo molde aparece em มีคนเดียวครับ, 'tenho só um' — o เดียว vem depois do classificador e fecha a frase.","en":"When classifier phrases with เดียว or หลาย refer to the pronoun subject of the sentence, they occur after the main verb, usually at the end: เขาไปคนเดียว 'he went by himself', เขาไปกันหลายคน 'several of them went together' (กัน marks the group sense). The dialog shows the same slot in มีคนเดียวครับ 'I have only one'."},"ex":[["เขา","kǎo","khao"],["ไป","bpai","pai"],["คน","kon","khon"],["เดียว","diiao","diao"]]}],"paginas":"vol. 1, p. 191–214"},"13":{"n":13,"titulo":{"pt":"Que horas são?","en":"Telling Time"},"dialogo":[{"sp":"A","s":[["กี่","gìi","ki"],["โมง","moong","mong"],["แล้ว","lɛ́ɛo","laeo"],["ครับ","kráp","khrap"]],"fsi":"kìi mooŋ lɛ́ɛw khráp","en":"What time is it?","pt":"Que horas são?"},{"sp":"B","s":[["ห้า","hâa","ha"],["โมง","moong","mong"],["เช้า","cháao","chao"],["กว่า","gwàa","kwa"],["แล้ว","lɛ́ɛo","laeo"],["ครับ","kráp","khrap"]],"fsi":"hâa mooŋ cháaw kwaa lɛ́ɛw khráp","en":"It's after 11 a.m.","pt":"Já passou das onze da manhã."},{"sp":"B","s":[["นาฬิกา","naa-lí-gaa","nalika"],["ของ","kɔ̌ɔng","khong"],["คุณ","kun","khun"],["เวลา","wee-laa","wela"],["เท่าไร","tâo-rài","thaorai"],["ครับ","kráp","khrap"]],"fsi":"naalikaa khɔ̌ɔŋ khun weelaa thâawraj khráp","en":"What time is it by your watch?","pt":"Que horas são no seu relógio?"},{"sp":"A","s":[["นาฬิกา","naa-lí-gaa","nalika"],["ผม","pǒm","phom"],["อีก","ìik","ik"],["ห้า","hâa","ha"],["นาที","naa-tii","nathi"],["จะ","jà","cha"],["ห้า","hâa","ha"],["โมง","moong","mong"],["เช้า","cháao","chao"]],"fsi":"naalikaa phǒm ʔìik hâa naathii cà hâa mooŋ cháaw","en":"By my watch it's five minutes to 11 a.m.","pt":"Pelo meu relógio faltam cinco minutos para as onze da manhã."},{"sp":"B","s":[["นาฬิกา","naa-lí-gaa","nalika"],["คุณ","kun","khun"],["ช้า","cháa","cha"],["ไป","bpai","pai"],["สิบ","sìp","sip"],["ห้า","hâa","ha"],["นาที","naa-tii","nathi"],["ครับ","kráp","khrap"]],"fsi":"naalikaa khun cháa paj sìp hâa naathii khráp","en":"Your watch is fifteen minutes slow.","pt":"Seu relógio está quinze minutos atrasado."},{"sp":"A","s":[["งั้น","ngán","ngan"],["ผม","pǒm","phom"],["เห็น","hěn","hen"],["จะ","jà","cha"],["ต้อง","dtɔ̂ng","tong"],["รีบ","rîip","rip"],["ไป","bpai","pai"],["เดี๋ยวนี้","dǐiao-níi","diaoni"]],"fsi":"ŋán phǒm hěn cà tɔ̂ɔŋ rîip paj dǐawníi","en":"In that case, it seems I will have to hurry.","pt":"Nesse caso, acho que vou ter que correr."},{"sp":"B","s":[["คุณ","kun","khun"],["จะ","jà","cha"],["รีบ","rîip","rip"],["ไป","bpai","pai"],["ไหน","nǎi","nai"],["ครับ","kráp","khrap"]],"fsi":"khun cà rîip paj nǎj khráp","en":"Where are you hurrying to?","pt":"Correr para onde?"},{"sp":"A","s":[["จะ","jà","cha"],["ไป","bpai","pai"],["เอา","ao","ao"],["เงิน","ngən","ngoen"],["ที่","tîi","thi"],["ธนาคาร","tá-naa-kaan","thanakhan"],["ก่อน","gɔ̀ɔn","kon"],["แล้ว","lɛ́ɛo","laeo"],["จะ","jà","cha"],["ไป","bpai","pai"],["ไปรษณีย์","bprai-sà-nii","praisani"]],"fsi":"cà paj ʔaw ŋən thîi thanaakhaan kɔ̀ɔn lɛ́ɛw cà paj prajsanii","en":"I'll go get some money at the bank first, then go to the Post Office.","pt":"Vou primeiro sacar um dinheiro no banco e depois vou aos correios."},{"sp":"B","s":[["จะ","jà","cha"],["กลับ","glàp","klap"],["เมื่อไร","mʉ̂ʉa-rài","muearai"],["ครับ","kráp","khrap"]],"fsi":"cà klàp mʉ̂araj khráp","en":"When will you return?","pt":"Você volta que horas?"},{"sp":"A","s":[["ตอน","dtɔɔn","ton"],["บ่าย","bàai","bai"],["บ่าย","bàai","bai"],["ครับ","kráp","khrap"]],"fsi":"tɔɔn bàaj bàaj khráp","en":"Sometime in the afternoon.","pt":"Lá pela tarde."}],"notas":[{"t":{"pt":"กว่า: 'mais que', e com hora 'já passou de'","en":"กว่า 'more than', and with a clock time 'after'"},"e":{"pt":"กว่า é o comparativo de superioridade: A กว่า B = 'A é mais ... que B'. Colado depois de uma hora, ele quer dizer 'e poucos, já passou daquilo' — ห้าโมงเช้ากว่าแล้ว = 'já passa das onze da manhã' (lit. 'cinco horas da manhã, mais que, já'). O แล้ว do fim só reforça que o momento chegou; é o nosso 'já' de 'já são onze e pouco'. Repare que aqui o tailandês não informa os minutos: dá a hora cheia e avisa que ela já foi superada.","en":"กว่า is the comparative 'more than'. After a clock time it means 'a little past': ห้าโมงเช้ากว่าแล้ว = 'it's after 11 a.m.' (lit. 'five o'clock morning more than already'). แล้ว marks that the moment has arrived. Note that the exact minutes are not given."},"ex":[["ห้า","hâa","ha"],["โมง","moong","mong"],["เช้า","cháao","chao"],["กว่า","gwàa","kwa"],["แล้ว","lɛ́ɛo","laeo"]]},{"t":{"pt":"ครึ่ง: a meia hora vem depois do número","en":"ครึ่ง 'half' comes after the hour"},"e":{"pt":"A meia hora é um complemento que se apoia DEPOIS da hora: สองโมงเช้าครึ่ง = 8h30 (lit. 'duas horas da manhã, metade'). A ordem é a mesma do nosso 'e meia', só que sem o 'e'. O mesmo ครึ่ง divide qualquer medida ao meio — ครึ่งชั่วโมง (meia hora de duração), สิบห้าบาทครึ่ง — e é com ele que se diz quanto um relógio está errado: ช้าไปครึ่งชั่วโมง.","en":"ครึ่ง 'half' follows the hour: สองโมงเช้าครึ่ง = 8:30 a.m. (lit. 'two o'clock morning half'). The same word halves any measure: ครึ่งชั่วโมง 'half an hour (duration)', ช้าไปครึ่งชั่วโมง 'half an hour slow'."},"ex":[["สอง","sɔ̌ɔng","song"],["โมง","moong","mong"],["เช้า","cháao","chao"],["ครึ่ง","krʉ̂ng","khrueng"]]},{"t":{"pt":"ตรง: hora em ponto","en":"ตรง 'sharp, on the dot'"},"e":{"pt":"ตรง quer dizer 'reto, exato' e, logo depois da hora, entrega o nosso 'em ponto': ห้าโมงเช้าตรง = 11h00 em ponto. A imagem é a mesma de uma linha reta — nada sobra, nada falta, o ponteiro cai exatamente sobre o número. A palavra também serve para lugar (ตรงนั้น, 'bem ali') e para 'corresponder, bater com' (ตรงกัน).","en":"ตรง means 'straight, exact'; after a clock time it gives 'sharp, on the dot': ห้าโมงเช้าตรง = 11 a.m. sharp. The same word points at place (ตรงนั้น 'right there') and at matching (ตรงกัน)."},"ex":[["ห้า","hâa","ha"],["โมง","moong","mong"],["เช้า","cháao","chao"],["ตรง","dtrong","trong"]]},{"t":{"pt":"อีก + tempo + จะ + hora: 'faltam X para'","en":"อีก + period of time + จะ + clock time: 'X minutes to'"},"e":{"pt":"Para dizer que horas vão ser daqui a pouco, o tailandês empilha: อีก ('mais, adicional') + o tempo que falta + จะ ('vai ser') + a hora que vai marcar. อีกห้านาทีจะสามโมงเช้า = 'faltam cinco minutos para as nove' (lit. 'mais cinco minutos vai ser três horas da manhã'). É o molde da fala do diálogo: นาฬิกาผมอีกห้านาทีจะห้าโมงเช้า. O จะ fica sempre colado na hora, nunca no começo da frase — ele não anuncia o futuro da pessoa, anuncia o futuro do relógio.","en":"Pattern: อีก + period of time + จะ + clock time. อีกห้านาทีจะสามโมงเช้า = 'it's five minutes to 9 a.m.' (lit. 'another five minutes will be three o'clock morning'). จะ sits right before the clock time, not at the start of the sentence."},"ex":[["อีก","ìik","ik"],["ห้า","hâa","ha"],["นาที","naa-tii","nathi"],["จะ","jà","cha"],["สาม","sǎam","sam"],["โมง","moong","mong"],["เช้า","cháao","chao"]]},{"t":{"pt":"Relógio atrasado ou adiantado: ช้า / เร็ว ไป","en":"A slow or fast timepiece: ช้า / เร็ว ไป"},"e":{"pt":"A conta do erro de um relógio sai assim: นาฬิกา + de quem + ช้า ('atrasado') ou เร็ว ('adiantado') + ไป + a diferença. นาฬิกาคุณช้าไปสิบห้านาทีครับ = 'seu relógio está quinze minutos atrasado'. O ไป daqui não é o verbo 'ir': é o 'demais, nessa medida' que fecha a diferença — por isso o livro grafa a entrada como (ช้า) ไป. No lugar dos minutos pode entrar ครึ่งชั่วโมง, e o resto não muda.","en":"Structure: watch + owner + ช้า 'slow' / เร็ว 'fast' + ไป + amount of time. นาฬิกาคุณช้าไปสิบห้านาที = 'your watch is fifteen minutes slow'. This ไป is not 'to go' but 'too much, by that amount', which is why the book lists the entry as (chaa) paj."},"ex":[["นาฬิกา","naa-lí-gaa","nalika"],["คุณ","kun","khun"],["ช้า","cháa","cha"],["ไป","bpai","pai"],["สิบ","sìp","sip"],["ห้า","hâa","ha"],["นาที","naa-tii","nathi"]]},{"t":{"pt":"O relógio oficial: โมง, ทุ่ม, ตี e เที่ยง","en":"The official Thai clock: โมง, ทุ่ม, ตี and เที่ยง"},"e":{"pt":"O dia não se divide em 24 horas, mas em turnos com palavras próprias. De madrugada, ตีหนึ่ง a ตีห้า (1h–5h). De manhã, หกโมงเช้า (6h), โมงเช้า (7h — sem número, é assim mesmo em Banguecoque; quem diz เจ็ดโมงเช้า é de fora), สองโมงเช้า a ห้าโมงเช้า (8h–11h) e เที่ยงวัน (meio-dia). À tarde, บ่ายโมง a บ่ายสี่โมง (13h–16h) e สี่โมงเย็น a หกโมงเย็น (16h–18h). À noite, หนึ่งทุ่ม a ห้าทุ่ม (19h–23h) e เที่ยงคืน (meia-noite). O truque é que o número nunca passa de seis: ele conta a distância até 6h, meio-dia, 18h ou meia-noite. É como se cada turno tivesse o próprio relógio de seis horas.","en":"The official Thai clock splits the day into shifts with their own words: ตีหนึ่ง-ตีห้า (1-5 a.m.); หกโมงเช้า (6), โมงเช้า (7, no number - Bangkok usage), สองโมงเช้า-ห้าโมงเช้า (8-11), เที่ยงวัน (noon); บ่ายโมง-บ่ายสี่โมง (1-4 p.m.), สี่โมงเย็น-หกโมงเย็น (4-6 p.m.); หนึ่งทุ่ม-ห้าทุ่ม (7-11 p.m.), เที่ยงคืน (midnight). The number never goes past six: it counts the distance to 6 a.m., noon, 6 p.m. or midnight."},"ex":[["หก","hòk","hok"],["โมง","moong","mong"],["เช้า","cháao","chao"]]},{"t":{"pt":"ตอน + período, e a repetição que deixa a hora vaga","en":"ตอน + period of the day, and reduplication for a vague time"},"e":{"pt":"ตอน funciona como 'na parte de': ตอนเช้า (de manhã), ตอนสาย (no fim da manhã), ตอนเที่ยง (por volta do meio-dia), ตอนบ่าย (à tarde), ตอนเย็น (no fim da tarde), ตอนค่ำ e ตอนหัวค่ำ (à noite), ตอนดึก (de madrugada). Repetindo a palavra do período, a hora fica vaga e sem compromisso: ตอนบ่ายบ่าย = 'lá pela tarde', em algum ponto da tarde. É exatamente o que A responde no diálogo — ele não promete um horário, só o turno. O mesmo truque vale para ตอนเช้าเช้า, ตอนเย็นเย็น e ตอนค่ำค่ำ.","en":"ตอน = 'in the (part of the) day': ตอนเช้า, ตอนสาย, ตอนเที่ยง, ตอนบ่าย, ตอนเย็น, ตอนค่ำ / ตอนหัวค่ำ, ตอนดึก. Reduplicating the time word makes the moment vague: ตอนบ่ายบ่าย = 'sometime in the afternoon'. The same trick works with ตอนเช้าเช้า, ตอนเย็นเย็น, ตอนค่ำค่ำ."},"ex":[["ตอน","dtɔɔn","ton"],["บ่าย","bàai","bai"],["บ่าย","bàai","bai"]]},{"t":{"pt":"เมื่อ: o carimbo de passado nas palavras de tempo","en":"เมื่อ: the past stamp on time words"},"e":{"pt":"Dentro de เมื่อไร, o เมื่อ só pergunta 'quando' — o tempo fica aberto. Grudado numa palavra de tempo, ele carimba o passado: เมื่อวานนี้ (ontem), เมื่อเช้านี้ (hoje de manhã), เมื่อคืนนี้ (ontem à noite), เมื่อกี้นี้ (há pouquinho). Sem o เมื่อ, a mesma expressão aponta para a frente: เย็นนี้ é 'logo mais, ao fim da tarde'; เมื่อเย็นนี้ é 'ontem no fim da tarde'. A palavra de tempo é a mesma; quem decide a direção é o เมื่อ.","en":"Inside เมื่อไร, เมื่อ simply asks 'when'. Attached to a time word it stamps the past: เมื่อวานนี้ 'yesterday', เมื่อเช้านี้ 'this morning (earlier)', เมื่อคืนนี้ 'last night', เมื่อกี้นี้ 'a short time ago'. Without it the same phrase looks forward: เย็นนี้ 'this evening' vs เมื่อเย็นนี้ 'yesterday evening'."},"ex":[["เมื่อ","mʉ̂ʉa","muea"],["คืน","kʉʉn","khuen"],["นี้","níi","ni"]]}],"paginas":"vol. 1, p. 215–232"},"14":{"n":14,"titulo":{"pt":"Perguntando o caminho (1)","en":"Directions (1)"},"dialogo":[{"sp":"A","s":[["แถวนี้","tɛ̌ɛo-níi","thaeoni"],["มี","mii","mi"],["ร้านตัดผม","ráan-dtàt-pǒm","rantatphom"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"thɛ̌ɛwníi mii ráantàtphǒm máj khráp","en":"Is there a barber shop around here?","pt":"Tem barbearia por aqui?"},{"sp":"B","s":[["มี","mii","mi"],["ครับ","kráp","khrap"],["อยู่","yùu","yu"],["ฝั่งนั้น","fàng-nân","fangnan"]],"fsi":"mii khráp jùu fàŋnân","en":"Yes, there is. On the other side (of the street).","pt":"Tem, sim. Fica do outro lado (da rua)."},{"sp":"A","s":[["อยู่","yùu","yu"],["ตรงไหน","dtrong-nǎi","trongnai"],["ครับ","kráp","khrap"]],"fsi":"jùu troŋnǎj khráp","en":"Exactly where?","pt":"Fica bem onde?"},{"sp":"B","s":[["อยู่","yùu","yu"],["ข้างๆ","kâang-kâang","khangkhang"],["ร้านกาแฟ","ráan-gaa-fɛɛ","rankafae"]],"fsi":"jùu khâaŋkhâaŋ ráankaafɛɛ","en":"Next to the coffee shop.","pt":"Fica bem ao lado da cafeteria."},{"sp":"A","s":[["อยู่","yùu","yu"],["ทางซ้าย","taang-sáai","thangsai"],["หรือ","rʉ̌ʉ","rue"],["ทางขวา","taang-kwǎa","thangkhwa"],["ครับ","kráp","khrap"]],"fsi":"jùu thaangsáaj rʉ̌ʉ thaangkhwǎa khráp","en":"To the left or right?","pt":"Fica à esquerda ou à direita?"},{"sp":"B","s":[["อยู่","yùu","yu"],["ทางซ้าย","taang-sáai","thangsai"]],"fsi":"jùu thaangsáaj","en":"To the left.","pt":"À esquerda."},{"sp":"A","s":[["ทางขวา","taang-kwǎa","thangkhwa"],["ของ","kɔ̌ɔng","khong"],["ร้านกาแฟ","ráan-gaa-fɛɛ","rankafae"],["เป็น","bpen","pen"],["อะไร","à-rai","arai"],["ครับ","kráp","khrap"]],"fsi":"thaangkhwǎa khɔ̌ɔŋ ráankaafɛɛ pen ʔaraj khráp","en":"What's to the right of the coffee shop?","pt":"E o que fica à direita da cafeteria?"},{"sp":"B","s":[["เป็น","bpen","pen"],["ร้านอาหาร","ráan-aa-hǎan","ranahan"]],"fsi":"pen ráanʔaahǎan","en":"A restaurant.","pt":"Um restaurante."},{"sp":"A","s":[["ชื่อ","chʉ̂ʉ","chue"],["คีย์โน้ต","kii-nóot","khinot"],["ใช่ไหม","châi-mǎi","chaimai"],["ครับ","kráp","khrap"]],"fsi":"chʉ̂ʉ khiinóot châj máj khráp","en":"It's named 'Key Note', isn't it?","pt":"O nome é 'Key Note', não é?"},{"sp":"B","s":[["ไม่ใช่","mâi-châi","maichai"],["ครับ","kráp","khrap"]],"fsi":"mâj châj khráp","en":"No, it isn't.","pt":"Não, não é."},{"sp":"B","s":[["ร้าน","ráan","ran"],["คีย์โน้ต","kii-nóot","khinot"],["อยู่","yùu","yu"],["ที่นั่น","tîi-nân","thinan"]],"fsi":"ráan khiinóot jùu thîinân","en":"The Key Note is over there.","pt":"O Key Note fica lá."},{"sp":"A","s":[["ถนน","tà-nǒn","thanon"],["ที่","tîi","thi"],["อยู่","yùu","yu"],["ทางขวา","taang-kwǎa","thangkhwa"],["นั้น","nân","nan"],["ชื่อ","chʉ̂ʉ","chue"],["ถนน","tà-nǒn","thanon"],["อะไร","à-rai","arai"],["ครับ","kráp","khrap"]],"fsi":"thanǒn thîi jùu thaangkhwǎa nân chʉ̂ʉ thanǒn ʔaraj khráp","en":"What's the name of the street on the right?","pt":"Aquela rua à direita, qual é o nome dela?"},{"sp":"B","s":[["ถนน","tà-nǒn","thanon"],["นั้น","nân","nan"],["หรือ","rʉ̌ʉ","rue"],["ครับ","kráp","khrap"]],"fsi":"thanǒn nân rʉ̌ʉ khráp","en":"That street?","pt":"Aquela rua?"},{"sp":"B","s":[["ชื่อ","chʉ̂ʉ","chue"],["ถนน","tà-nǒn","thanon"],["สุริวงศ์","sù-rí-wong","suriwong"]],"fsi":"chʉ̂ʉ thanǒn sùríwoŋ","en":"It's Suriwong.","pt":"Chama-se rua Suriwong."},{"sp":"A","s":[["ถนน","tà-nǒn","thanon"],["สุริวงศ์","sù-rí-wong","suriwong"],["ผ่าน","pàan","phan"],["สถานทูต","sà-tǎan-tûut","sathanthut"],["อเมริกัน","à-mee-rí-gan","amerikan"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"thanǒn sùríwoŋ phàan sathǎanthûut ʔameerikan máj khráp","en":"Does it (Suriwong Street) pass the American Embassy?","pt":"A rua Suriwong passa pela Embaixada Americana?"},{"sp":"B","s":[["ไม่","mâi","mai"],["ผ่าน","pàan","phan"],["ครับ","kráp","khrap"]],"fsi":"mâj phàan khráp","en":"No, it doesn't.","pt":"Não passa, não."},{"sp":"B","s":[["สถานทูต","sà-tǎan-tûut","sathanthut"],["อเมริกัน","à-mee-rí-gan","amerikan"],["อยู่","yùu","yu"],["แถว","tɛ̌ɛo","thaeo"],["ถนน","tà-nǒn","thanon"],["เพลินจิต","pləən-jìt","phloenchit"],["ใกล้ๆ","glâi-glâi","klaiklai"],["กับ","gàp","kap"],["สี่แยก","sìi-yɛ̂ɛk","siyaek"],["ราชประสงค์","râat-bprà-sɔ̌ɔng","ratprasong"]],"fsi":"sathǎanthûut ʔameerikan jùu thɛ̌ɛw thanǒn phləəncìt klâj klâj kàp sìijɛ̂ɛk râatprasɔ̌ɔŋ","en":"The American Embassy is in the Ploenchit street area, very near Ratprasong Corner.","pt":"A Embaixada Americana fica na região da rua Phloen Chit, bem perto do cruzamento de Ratchaprasong."}],"notas":[{"t":{"pt":"ใกล้ 'perto' e ไกล 'longe' pedem complementos diferentes","en":"ใกล้ 'near' and ไกล 'far' take different complements"},"e":{"pt":"As duas palavras se distinguem só pelo tom: ใกล้ é 'perto', ไกล é 'longe'. E cada uma pede um complemento diferente. Para 'longe de' entra o จาก — ไกลจากกรุงเทพฯ ('longe de Bangkok'). Para 'perto de' entra o กับ — อยู่ใกล้กับกรุงเทพฯ ('fica perto de Bangkok'). Na fala rápida o กับ encurta para กะ, e aí vem o detalhe que o livro destaca: o กะ só pode aparecer quando a palavra seguinte começa por consoante; antes de vogal ele se colaria nela, então volte ao กับ.","en":"ใกล้ 'near' and ไกล 'far' are told apart only by tone and take different complements: ไกล + จาก (ไกลจากกรุงเทพฯ 'far from Bangkok'), ใกล้ + กับ (อยู่ใกล้กับกรุงเทพฯ 'near Bangkok'). The colloquial reduced form กะ is possible after ใกล้ only when the following word begins with a consonant."},"ex":[["อยู่","yùu","yu"],["ใกล้","glâi","klai"],["กับ","gàp","kap"],["กรุงเทพฯ","grung-têep","krungthep"]]},{"t":{"pt":"Dois jeitos de dizer a mesma distância","en":"Two equivalent ways of stating a distance"},"e":{"pt":"O livro mostra o par com as embaixadas, e o sentido é idêntico nos dois. O primeiro jeito toma um lugar como sujeito e traz o outro depois da preposição: สถานทูตอเมริกันอยู่ใกล้กับสถานทูตอังกฤษ ('a Embaixada Americana fica perto da Embaixada Britânica'). O segundo junta os dois lugares com กับ e fecha a frase com กัน, a partícula de reciprocidade: สถานทูตอเมริกันกับสถานทูตอังกฤษอยู่ใกล้กัน ('a Embaixada Americana e a Britânica ficam perto uma da outra'). É o nosso 'um do outro'. O mesmo molde vale para o lado do ไกล: X อยู่ไกลจาก Y = X กับ Y อยู่ไกลกัน.","en":"Two equivalent patterns: สถานทูตอเมริกันอยู่ใกล้กับสถานทูตอังกฤษ 'the American Embassy is near the British Embassy' versus สถานทูตอเมริกันกับสถานทูตอังกฤษอยู่ใกล้กัน 'the American and the British Embassy are close to each other', where กัน marks reciprocity. The same alternation holds with ไกล: X อยู่ไกลจาก Y = X กับ Y อยู่ไกลกัน."},"ex":[["สถานทูต","sà-tǎan-tûut","sathanthut"],["อเมริกัน","à-mee-rí-gan","amerikan"],["กับ","gàp","kap"],["สถานทูต","sà-tǎan-tûut","sathanthut"],["อังกฤษ","ang-grìt","angkrit"],["อยู่","yùu","yu"],["ใกล้","glâi","klai"],["กัน","gan","kan"]]},{"t":{"pt":"Quão longe: a medida vai no fim","en":"How far: the measure goes at the end"},"e":{"pt":"Para informar a distância, a medida entra no fim da frase, depois dos dois lugares: กรุงเทพฯ อยู่ไกลจากเชียงใหม่ 900 กิโล ('Bangkok fica a 900 quilômetros de Chiang Mai'). A pergunta é igual, só que a medida vira กี่: ...กี่กิโล ('quantos quilômetros?'). O molde é lugar + verbo + lugar + extensão, na mesma ordem do nosso 'fica a 900 km de tal lugar' — não há preposição equivalente a 'a', o número simplesmente se apoia no fim.","en":"The extent of the distance is placed at the end: NP + verb phrase + NP + extent, as in กรุงเทพฯ อยู่ไกลจากเชียงใหม่ 900 กิโล 'Bangkok is 900 kilometers from Chiangmai'. The question replaces the measure with กี่ (กี่กิโล)."},"ex":[["กรุงเทพฯ","grung-têep","krungthep"],["อยู่","yùu","yu"],["ไกล","glai","klai"],["จาก","jàak","chak"],["เชียงใหม่","chiiang-mài","chiangmai"],["กี่","gìi","ki"],["กิโล","gì-loo","kilo"]]},{"t":{"pt":"มี existe sem sujeito","en":"มี 'there is' builds a subjectless sentence"},"e":{"pt":"A estrutura é: lugar (opcional) + มี + substantivo (+ complemento). แถวนี้มีร้านตัดผม significa 'nesta região há uma barbearia' — e o livro faz questão de avisar que a frase não tem sujeito nenhum. É o nosso 'tem/há' impessoal: ninguém pratica a ação, o que existe simplesmente existe. Por isso a pergunta se resolve acrescentando ไหม no fim, sem inventar um sujeito: แถวนี้มีร้านตัดผมไหมครับ. O lugar pode até ser omitido quando o contexto já diz onde.","en":"มี means 'to be in existence' in constructions like (location) + มี + NP (+ complement), e.g. แถวนี้มีร้านตัดผม 'in this area there is a barber shop'. The book stresses that such a sentence has no subject; the question is formed simply by adding ไหม, and the location may be dropped when the context supplies it."},"ex":[["แถว","tɛ̌ɛo","thaeo"],["นี้","níi","ni"],["มี","mii","mi"],["ร้านตัดผม","ráan-dtàt-pǒm","rantatphom"]]}],"paginas":"vol. 1, p. 233–256"},"15":{"n":15,"titulo":{"pt":"Uma entrevista em Korat","en":"An Interview at Korat"},"dialogo":[{"sp":"A","s":[["สวัสดี","sà-wàt-dii","sawatdi"],["ครับ","kráp","khrap"],["ผม","pǒm","phom"],["ชื่อ","chʉ̂ʉ","chue"],["ทอม","tɔɔm","thom"]],"fsi":"sawàtdii khráp, phǒm chʉ̂ʉ thɔɔm","en":"Hello, my name is Tom.","pt":"Olá, meu nome é Tom."},{"sp":"B","s":[["ผม","pǒm","phom"],["ชื่อ","chʉ̂ʉ","chue"],["แมน","mɛɛn","maen"],["ครับ","kráp","khrap"]],"fsi":"phǒm chʉ̂ʉ mɛɛn khráp","en":"My name is Maen.","pt":"Meu nome é Maen."},{"sp":"A","s":[["ยินดี","yin-dii","yindi"],["ที่","tîi","thi"],["ได้","dâai","dai"],["รู้จัก","rúu-jàk","ruchak"]],"fsi":"jindii thîi dâj rúucàk","en":"Glad to meet you.","pt":"Prazer em conhecer você."},{"sp":"B","s":[["คุณ","kun","khun"],["เป็น","bpen","pen"],["ทหาร","tá-hǎan","thahan"],["หรือ","rʉ̌ʉ","rue"],["ครับ","kráp","khrap"]],"fsi":"khun pen thahǎan rʉ̌ʉ khráp","en":"You're a soldier, aren't you?","pt":"Você é militar, não é?"},{"sp":"A","s":[["เปล่า","bplào","plao"],["ครับ","kráp","khrap"]],"fsi":"plaaw khráp","en":"No, I'm not.","pt":"Não, não sou."},{"sp":"A","s":[["ผม","pǒm","phom"],["เป็น","bpen","pen"],["พลเรือน","pon-lá-rʉʉan","phonlaruean"]],"fsi":"phǒm pen phonlarʉan","en":"I'm a civilian.","pt":"Eu sou civil."},{"sp":"B","s":[["คุณ","kun","khun"],["พูด","pûut","phut"],["ภาษา","paa-sǎa","phasa"],["ไทย","tai","thai"],["เก่ง","gèng","keng"],["มาก","mâak","mak"]],"fsi":"khun phûut phaasǎa thaj keŋ mâak","en":"You speak Thai very well.","pt":"Você fala tailandês muito bem."},{"sp":"A","s":[["ขอบคุณ","kɔ̀ɔp-kun","khopkhun"],["ครับ","kráp","khrap"]],"fsi":"khɔ̀ɔpkhun khráp","en":"Thank you.","pt":"Obrigado."},{"sp":"B","s":[["คุณ","kun","khun"],["มา","maa","ma"],["ทำ","tam","tham"],["อะไร","à-rai","arai"],["ที่นี่","tîi-nîi","thini"],["ครับ","kráp","khrap"]],"fsi":"khun maa tham ʔaraj thîinîi khráp","en":"What did you come here to do?","pt":"O que você veio fazer aqui?"},{"sp":"A","s":[["ผม","pǒm","phom"],["มา","maa","ma"],["ทำงาน","tam-ngaan","thamngan"],["ที่","tîi","thi"],["ยูซิส","yuu-sít","y วมใจ","rûuam-jai","ruamchai"],["ถนน","tà-nǒn","thanon"],["สุขุมวิท","sù-kǔm-wít","sukhumwit"],["ครับ","kráp","khrap"]],"fsi":"jùu thîi sɔɔj rûamcaj, thanǒn sùkhǔmwít khráp","en":"It's at Ruamchaj Lane, Sukhumwit Road.","pt":"Fica na Soi Ruam Chai, na rua Sukhumvit."},{"sp":"B","s":[["ผม","pǒm","phom"],["ยัง","yang","yang"],["ไม่","mâi","mai"],["เคย","kəəi","khoei"],["ไป","bpai","pai"],["สำนักงาน","sǎm-nák-ngaan","samnakngan"],["ยูซิส","yuu-sít","yusit"],["เลย","ləəi","loei"],["อยู่","yùu","yu"],["ที่ไหน","tîi-nǎi","thinai"],["ครับ","kráp","khrap"]],"fsi":"phǒm jaŋ mâj khəəj paj sǎmnákŋaan juusít ləəj, jùu thîinǎj khráp","en":"I've never been to (the USIS office). Where is it?","pt":"Eu nunca fui ao escritório da USIS. Fica onde?"},{"sp":"A","s":[["อยู่","yùu","yu"],["ใกล้ๆ","glâi-glâi","klaiklai"],["กับ","gàp","kap"],["ตลาด","dtà-làat","talat"],["ครับ","kráp","khrap"],["วันหลัง","wan-lǎng","wanlang"],["อันอื่น","an-ʉ̀ʉn","anuen"],["เชิญ","chəən","choen"],["ไป","bpai","pai"],["เยี่ยม","yîiam","yiam"],["เรา","rao","rao"],["ที่","tîi","thi"],["บ้าน","bâan","ban"],["นะ","ná","na"],["ครับ","kráp","khrap"]],"fsi":"jùu klâjklâj kàp talàat khráp, wanlǎŋ ʔanʉ̀ʉn chəən paj jîam rao thîi bâan ná khráp","en":"It's quite close to the market. Why don't you come over and visit us some day?","pt":"Fica bem perto do mercado. Qualquer dia desses venha nos visitar lá em casa."},{"sp":"B","s":[["ขอบคุณ","kɔ̀ɔp-kun","khopkhun"],["ครับ","kráp","khrap"]],"fsi":"khɔ̀ɔpkhun khráp","en":"Thank you.","pt":"Obrigado."},{"sp":"B","s":[["ที่ทำงาน","tîi-tam-ngaan","thithamngan"],["ของ","kɔ̌ɔng","khong"],["คุณ","kun","khun"],["เปิด","bpə̀ət","poet"],["กี่","gìi","ki"],["โมง","moong","mong"],["ครับ","kráp","khrap"]],"fsi":"thîithamŋaan khɔ̌ɔŋ khun pə̀ət kìi mooŋ khráp","en":"When does your office open?","pt":"Que horas o seu escritório abre?"},{"sp":"A","s":[["ห้องสมุด","hɔ̂ng-sà-mùt","hongsamut"],["เปิด","bpə̀ət","poet"],["เวลา","wee-laa","wela"],["เที่ยง","tîiang","thiang"],["ปิด","bpìt","pit"],["ราว","raao","rao"],["หนึ่ง","nʉ̀ng","nueng"],["ทุ่ม","tûm","thum"],["แต่","dtɛ̀ɛ","tae"],["ผม","pǒm","phom"],["เข้า","kâo","khao"],["ทำงาน","tam-ngaan","thamngan"],["เวลา","wee-laa","wela"],["สอง","sɔ̌ɔng","song"],["โมง","moong","mong"],["ครึ่ง","krʉ̂ng","khrueng"],["เลิก","lə̂ək","loek"],["ห้า","hâa","ha"],["โมง","moong","mong"],["เย็น","yen","yen"]],"fsi":"hɔ̂ɔŋsamùt pə̀ət weelaa thîaŋ, pìt raaw nʉ̀ŋthûm, tɛ̀ɛ phǒm khâw thamŋaan weelaa sɔ̌ɔŋ mooŋ khrʉ̂ŋ, lə̂ək hâa mooŋ jen","en":"The library opens at noon, (and) closes around 7 p.m. but I begin at 8:30 a.m., and quit at 5 p.m.","pt":"A biblioteca abre ao meio-dia e fecha lá pelas sete da noite. Mas eu entro às oito e meia da manhã e saio às cinco da tarde."},{"sp":"B","s":[["งั้น","ngán","ngan"],["วันหลัง","wan-lǎng","wanlang"],["ผม","pǒm","phom"],["จะ","jà","cha"],["ไป","bpai","pai"],["เยี่ยม","yîiam","yiam"],["คุณ","kun","khun"]],"fsi":"ŋán, wanlǎŋ phǒm cà paj jîam khun","en":"Then someday I'll go visit you.","pt":"Então um dia desses eu vou visitar você."},{"sp":"B","s":[["ผม","pǒm","phom"],["ลา","laa","la"],["ก่อน","gɔ̀ɔn","kon"],["นะ","ná","na"],["ครับ","kráp","khrap"],["จะ","jà","cha"],["รีบ","rîip","rip"],["ไป","bpai","pai"],["ธุระ","tú-rá","thura"]],"fsi":"phǒm laa kɔ̀ɔn ná khráp, cà rîip paj thúrá","en":"I'll say 'Goodbye!' I have urgent business (to take care of).","pt":"Já vou indo, tá? Preciso correr para resolver um assunto."},{"sp":"A","s":[["ครับ","kráp","khrap"]],"fsi":"khráp","en":"All right.","pt":"Certo."},{"sp":"A","s":[["หวัง","wǎng","wang"],["ว่า","wâa","wa"],["เรา","rao","rao"],["คง","kong","khong"],["ได้","dâai","dai"],["พบ","póp","phop"],["กัน","gan","kan"],["อีก","ìik","ik"]],"fsi":"wǎŋ wâa rao khoŋ dâj phóp kan ʔìik","en":"I hope we'll meet again.","pt":"Espero que a gente se encontre de novo."}],"notas":[{"t":{"pt":"แล้วหรือยัง: o 'já?' do tailandês","en":"แล้วหรือยัง: asking 'already?'"},"e":{"pt":"O แล้ว avisa que a coisa já aconteceu ou que o estado já vale: มีแล้วครับ é 'já tenho'. Na pergunta ele vem amarrado ao หรือยัง — คุณมีครอบครัวแล้วหรือยังครับ ('você já tem família?') — e a resposta ecoa o แล้ว: มีแล้วครับ. É o nosso 'já...?' de 'você já almoçou?', só que aqui o แล้ว é obrigatório para dizer que a bola já está em jogo. Sem ele, คุณมีครอบครัวครับ pergunta apenas se a pessoa tem família, sem nenhuma ideia de 'até agora'.","en":"แล้ว marks that something has happened or now holds: มีแล้วครับ 'I already have (one)'. In questions it comes with หรือยัง (คุณมีครอบครัวแล้วหรือยังครับ), and the answer echoes the แล้ว (มีแล้วครับ). Without it the question is a plain 'do you have a family?', with no 'by now' sense."},"ex":[["คุณ","kun","khun"],["มี","mii","mi"],["ครอบครัว","krɔ̂ɔp-kruua","khropkhrua"],["แล้ว","lɛ́ɛo","laeo"],["หรือยัง","rʉ̌ʉ-yang","rueyang"],["ครับ","kráp","khrap"]]},{"t":{"pt":"ยังไม่เคย...เลย: o 'nunca' com prazo de validade","en":"ยังไม่เคย...เลย: 'never (so far)'"},"e":{"pt":"เคย diz que a pessoa já experimentou aquilo alguma vez na vida. Negando com ยังไม่ e fechando a frase com เลย, você obtém o 'nunca... até agora': ผมยังไม่เคยไปสำนักงานยูซิสเลย ('nunca fui ao escritório da USIS'). O เลย do fim é o que dá o gosto de 'nem uma vez sequer'; sem ele a frase continua correta, só menos enfática. Repare que o tailandês não tem um verbo para 'nunca': ele empilha negação + เคย + เลย, do jeito que a gente empilha 'nunca... na vida'.","en":"เคย says you have experienced something before. Negated as ยังไม่เคย and closed off with เลย it gives 'never... so far': ผมยังไม่เคยไปสำนักงานยูซิสเลย 'I've never been to the USIS office'. The final เลย adds 'not even once'; without it the sentence is still correct, only less emphatic."},"ex":[["ผม","pǒm","phom"],["ยัง","yang","yang"],["ไม่","mâi","mai"],["เคย","kəəi","khoei"],["ไป","bpai","pai"],["สำนักงาน","sǎm-nák-ngaan","samnakngan"],["เลย","ləəi","loei"]]},{"t":{"pt":"มา + verbo: o que você veio fazer","en":"มา + verb: what you came to do"},"e":{"pt":"O มา ('vir') gruda direto no verbo que explica o motivo da vinda, sem preposição nenhuma no meio: มาทำงาน ('vim trabalhar'), มาเรียน ('vim estudar'). Na pergunta, o verbo vira อะไร — คุณมาทำอะไรที่นี่ครับ ('o que você veio fazer aqui?') — e a resposta devolve o mesmo molde: ผมมาทำงานที่ยูซิสครับ, com o ที่ puxando o lugar. É o nosso 'vim fazer o quê?', na ordem vir + fazer + onde. O mesmo vale para o ไป: ไปธุระ é 'sair para resolver um assunto'.","en":"มา 'come' is glued straight onto the verb that states the purpose, with no preposition: มาทำงาน 'come to work', มาเรียน 'come to study'. In the question the verb becomes อะไร (คุณมาทำอะไรที่นี่ครับ) and the answer repeats the frame (ผมมาทำงานที่ยูซิสครับ), with ที่ introducing the place. The same holds for ไป (ไปธุระ)."},"ex":[["คุณ","kun","khun"],["มา","maa","ma"],["ทำ","tam","tham"],["อะไร","à-rai","arai"],["ที่นี่","tîi-nîi","thini"],["ครับ","kráp","khrap"]]},{"t":{"pt":"ลา só sai da boca de quem vai embora","en":"ลา is said only by the person leaving"},"e":{"pt":"O livro é explícito no vocabulário: ลา ('dizer tchau') é palavra de quem parte — quem fica não usa. No diálogo o Maen fecha a conversa em três passos: dá o motivo (จะรีบไปธุระ, 'preciso correr para resolver um assunto'), avisa que está saindo (ผมลาก่อนนะครับ) e o Tom responde só ครับ. Aí vem o fecho de cortesia de quem fica: หวังว่าเราคงได้พบกันอีก ('espero que a gente se encontre de novo'). É o nosso 'já vou indo, tá?', com uma diferença de etiqueta: em tailandês dizer o motivo faz parte da despedida educada, não soa a justificativa.","en":"The vocabulary is explicit: ลา 'to say goodbye' is used only by the person leaving. In the dialog Maen gives the reason (จะรีบไปธุระ), announces the departure (ผมลาก่อนนะครับ) and Tom simply answers ครับ; the one who stays adds a courteous closing, หวังว่าเราคงได้พบกันอีก 'I hope we'll meet again'. Stating the reason is part of polite leavetaking, not an excuse."},"ex":[["ผม","pǒm","phom"],["ลา","laa","la"],["ก่อน","gɔ̀ɔn","kon"],["นะ","ná","na"],["ครับ","kráp","khrap"]]}],"paginas":"vol. 1, p. 257–261"},"16":{"n":16,"titulo":{"pt":"Perguntando o caminho (2)","en":"Directions (2)"},"dialogo":[{"sp":"A","s":[["ขอโทษ","kɔ̌ɔ-tôot","khothot"],["ครับ","kráp","khrap"],["ไปรษณีย์กลาง","bprai-sà-nii-glaang","praisaniklang"],["ไป","bpai","pai"],["ทางไหน","taang-nǎi","thangnai"]],"fsi":"khɔ̌ɔthôot khráp, prajsanii klaaŋ paj thaaŋnǎj","en":"Excuse me, which way is the main Post Office?","pt":"Com licença, por onde se vai ao Correio Central?"},{"sp":"B","s":[["ตรง","dtrong","trong"],["ไป","bpai","pai"],["ข้างหน้า","kâang-nâa","khangna"],["ครับ","kráp","khrap"]],"fsi":"troŋ paj khâaŋnâa khráp","en":"Straight ahead.","pt":"Segue reto, em frente."},{"sp":"A","s":[["ขอบคุณ","kɔ̀ɔp-kun","khopkhun"],["ครับ","kráp","khrap"]],"fsi":"khɔ̀ɔpkhun khráp","en":"Thank you.","pt":"Obrigado."},{"sp":"A","s":[["ขอโทษ","kɔ̌ɔ-tôot","khothot"],["ครับ","kráp","khrap"],["นี่","nîi","ni"],["ไปรษณีย์กลาง","bprai-sà-nii-glaang","praisaniklang"],["ใช่ไหม","châi-mǎi","chaimai"],["ครับ","kráp","khrap"]],"fsi":"khɔ̌ɔthôot khráp, nîi prajsanii klaaŋ châj máj khráp","en":"Excuse me, this is the main Post Office, isn't it?","pt":"Com licença, aqui é o Correio Central, não é?"},{"sp":"B","s":[["ใช่","châi","chai"],["ครับ","kráp","khrap"]],"fsi":"châj khráp","en":"Yes, it is.","pt":"É, sim."},{"sp":"A","s":[["ที่ส่งโทรเลข","tîi-sòng-too-rá-lêek","thisongthoralek"],["อยู่","yùu","yu"],["ตรงไหน","dtrong-nǎi","trongnai"],["ทราบ","sâap","sap"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"thîisòŋ thooralêek jùu troŋnǎj, sâap máj khráp","en":"Where's the place to send telegrams, do you know?","pt":"O senhor sabe onde fica o lugar de mandar telegramas?"},{"sp":"B","s":[["อยู่","yùu","yu"],["ข้างใน","kâang-nai","khangnai"],["ครับ","kráp","khrap"]],"fsi":"jùu khâaŋnaj khráp","en":"It's inside.","pt":"Fica lá dentro."},{"sp":"A","s":[["ไป","bpai","pai"],["ทางไหน","taang-nǎi","thangnai"],["ครับ","kráp","khrap"]],"fsi":"paj thaaŋnǎj khráp","en":"Which way do you go?","pt":"Vai-se por onde?"},{"sp":"B","s":[["เดิน","dəən","doen"],["ตรง","dtrong","trong"],["เข้า","kâo","khao"],["ไป","bpai","pai"],["ข้างใน","kâang-nai","khangnai"],["แล้ว","lɛ́ɛo","laeo"],["เลี้ยว","líiao","liao"],["ขวา","kwǎa","khwa"],["ที่ส่งโทรเลข","tîi-sòng-too-rá-lêek","thisongthoralek"],["จะ","jà","cha"],["อยู่","yùu","yu"],["ทางซ้าย","taang-sáai","thangsai"],["มือ","mʉʉ","mue"],["ของ","kɔ̌ɔng","khong"],["คุณ","kun","khun"]],"fsi":"dəən troŋ khâw paj khâaŋnaj, lɛ́ɛw líaw khwǎa, thîisòŋ thooralêek cà jùu thaaŋsáaj (mʉʉ) (khɔ̌ɔŋ) khun","en":"Go straight in, then turn right; the place to send telegrams will be to your left.","pt":"Ande reto para dentro e depois vire à direita. O lugar de mandar telegramas vai ficar à sua esquerda."},{"sp":"A","s":[["ขอบคุณ","kɔ̀ɔp-kun","khopkhun"],["มาก","mâak","mak"],["ครับ","kráp","khrap"]],"fsi":"khɔ̀ɔpkhun mâak khráp","en":"Thank you very much.","pt":"Muito obrigado."},{"sp":"B","s":[["ไม่เป็นไร","mâi-bpen-rai","maipenrai"],["ครับ","kráp","khrap"]],"fsi":"mâj pen raj khráp","en":"You're welcome.","pt":"Não tem de quê."}],"notas":[{"t":{"pt":"ทางไหน: por onde se vai","en":"ทางไหน: asking the way"},"e":{"pt":"O tailandês pergunta o caminho com ทาง ('caminho, direção') colado no ไหน ('qual'): ไปรษณีย์กลางไปทางไหนครับ, ao pé da letra 'o Correio Central vai por que direção?'. Repare que o ไป vem antes do lugar — é o nosso 'como se chega a X', e não 'onde fica X'. A resposta curta do livro é ตรงไปข้างหน้าครับ ('reto, à frente'); quando é preciso virar, entra o เลี้ยว — เลี้ยวขวา ('vire à direita') — e o destino final vem com อยู่ทางซ้ายมือของคุณ ('vai ficar à sua esquerda'), em que ทาง + lado monta o 'para o lado de'. O มือ ('mão') e o ของ ('de') ali são opcionais, tanto que o livro os imprime entre parênteses: ทางซ้ายคุณ também serve.","en":"The way is asked with ทาง 'way, direction' glued to ไหน 'which': ไปรษณีย์กลางไปทางไหนครับ 'which way does one go to the main Post Office?', with ไป coming before the place. Short answer: ตรงไปข้างหน้าครับ 'straight ahead'. Turns use เลี้ยวขวา 'turn right', and the final spot is given as อยู่ทางซ้ายมือของคุณ 'it will be on your left', where ทาง + side builds 'toward the ... side'. มือ and ของ are optional there — the book prints both in parentheses — so ทางซ้ายคุณ works too."},"ex":[["ไปรษณีย์กลาง","bprai-sà-nii-glaang","praisaniklang"],["ไป","bpai","pai"],["ทางไหน","taang-nǎi","thangnai"]]},{"t":{"pt":"ข้าง- congela o ponto de vista em quem fala","en":"ข้าง- fixes the point of view on the speaker"},"e":{"pt":"O VOCABULARY da lição põe dois conjuntos lado a lado: หน้า ('frente; rosto'), นอก ('fora'), หลัง ('atrás') e as formas com ข้าง — ข้างหน้า ('à frente, adiante'), ข้างใน ('lá dentro'), ข้างนอก ('lá fora'), ข้างหลัง ('a parte de trás'). O ข้าง ('lado') já embute o ponto de vista de quem fala, e por isso a palavra vem pronta: อยู่ข้างในครับ é 'fica lá dentro' sem precisar dizer dentro de quê. Já o substantivo nu pede uma referência do lado de fora — หน้าโรงเรียน, 'na frente da escola'. É o contraste entre o nosso 'aí dentro', que se basta, e 'dentro do prédio', que precisa do complemento.","en":"The vocabulary sets two groups side by side: หน้า 'in front; face', นอก 'outside', หลัง 'behind' and the ข้าง- forms ข้างหน้า 'ahead', ข้างใน 'inside', ข้างนอก 'outside', ข้างหลัง 'the back'. ข้าง 'side' already carries the speaker's point of view, so the word stands alone: อยู่ข้างในครับ 'it's inside', with no need to say inside what. The bare noun, by contrast, needs an outside reference — หน้าโรงเรียน 'in front of the school'."},"ex":[["อยู่","yùu","yu"],["ข้างใน","kâang-nai","khangnai"],["ครับ","kráp","khrap"]]},{"t":{"pt":"ออกมา × ออกไป: sair para cá ou para lá","en":"ออกมา × ออกไป: coming out vs. going out"},"e":{"pt":"O mesmo verbo muda de sentido pela partícula que vem atrás: ออกมา é 'sair para onde eu estou' e ออกไป é 'sair para longe de mim'. มา aponta para quem fala, ไป aponta para fora — e a direção é obrigatória, o tailandês não deixa o movimento no ar. É o nosso 'vem cá' × 'vai lá', só que grudado no verbo. O diálogo mostra o espelho disso com เดินตรงเข้าไปข้างใน ('ande reto para dentro'), em que เข้า é 'entrar' e o ไป empurra a ação para longe de quem dá a instrução.","en":"The same verb shifts meaning according to the particle that follows it: ออกมา 'come out' (toward the speaker) versus ออกไป 'go out' (away from the speaker). มา points to the speaker, ไป away — and the direction is obligatory, Thai does not leave the motion unspecified. The dialog mirrors this with เดินตรงเข้าไปข้างใน 'go straight in', where เข้า 'enter' plus ไป pushes the action away from the person giving directions."},"ex":[["เดิน","dəən","doen"],["ตรง","dtrong","trong"],["เข้า","kâo","khao"],["ไป","bpai","pai"],["ข้างใน","kâang-nai","khangnai"]]},{"t":{"pt":"ทราบไหมครับ: embrulhar a pergunta por educação","en":"ทราบไหมครับ: wrapping the question politely"},"e":{"pt":"Em vez de soltar ที่ส่งโทรเลขอยู่ตรงไหน ('onde fica o lugar dos telegramas?'), o livro embrulha a pergunta no fim: ...อยู่ตรงไหนทราบไหมครับ, ao pé da letra 'onde fica, o senhor sabe?'. O ทราบ é o 'saber (um fato)' formal, o que se usa com estranhos e com superiores — entre amigos seria รู้. E o ไหมครับ no fim suaviza mais um pouco: você não cobra a resposta, pergunta se a pessoa a tem. É exatamente o nosso 'por acaso o senhor sabe onde fica...?', em que a cortesia está em fingir que a outra pessoa pode não saber.","en":"Instead of a blunt ที่ส่งโทรเลขอยู่ตรงไหน 'where is the place to send telegrams?', the dialog wraps the question at the end: ...อยู่ตรงไหนทราบไหมครับ 'where is it, do you know?'. ทราบ is the formal 'to know (a fact)', the one used with strangers and superiors where friends would say รู้, and the final ไหมครับ softens it further — you ask whether the person knows rather than demanding the answer, just like English 'would you happen to know where ... is?'."},"ex":[["ที่ส่งโทรเลข","tîi-sòng-too-rá-lêek","thisongthoralek"],["อยู่","yùu","yu"],["ตรงไหน","dtrong-nǎi","trongnai"],["ทราบ","sâap","sap"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]]}],"paginas":"vol. 1, p. 262–275"},"17":{"n":17,"titulo":{"pt":"Perguntando o caminho (3)","en":"Directions (3)"},"dialogo":[{"sp":"A","s":[["ขอโทษ","kɔ̌ɔ-tôot","khothot"],["ครับ","kráp","khrap"],["คุณ","kun","khun"],["ทราบ","sâap","sap"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"],["ว่า","wâa","wa"],["โรงแรม","roong-rɛɛm","rongraem"],["เพรสซิเดนท์","pêet-sí-dên","phetsiden"],["อยู่","yùu","yu"],["ที่ไหน","tîi-nǎi","thinai"]],"fsi":"khɔ̌ɔthôot khráp khun sâap máj khráp waa rooŋrɛɛm présidén jùu thîinǎj","en":"Excuse me, do you know where the President Hotel is?","pt":"Com licença, o senhor sabe onde fica o Hotel President?"},{"sp":"B","s":[["ที่","tîi","thi"],["ถนน","tà-nǒn","thanon"],["เกษร","gee-sɔ̌ɔn","keson"],["ครับ","kráp","khrap"]],"fsi":"thîi thanǒn keesɔ̌ɔn khráp","en":"It's on Gaysorn street.","pt":"Fica na rua Gaysorn."},{"sp":"A","s":[["ไป","bpai","pai"],["ทาง","taang","thang"],["ไหน","nǎi","nai"],["ครับ","kráp","khrap"]],"fsi":"paj thaaŋ nǎj khráp","en":"Which direction is it?","pt":"Vai-se por onde?"},{"sp":"B","s":[["เดิน","dəən","doen"],["ตรง","dtrong","trong"],["ไป","bpai","pai"],["ทาง","taang","thang"],["นี้","níi","ni"],["ถึง","tʉ̌ng","thueng"],["สี่แยก","sìi-yɛ̂ɛk","siyaek"]],"fsi":"dəən troŋ paj thaaŋ níi thʉ̌ŋ sìijɛ̂ɛk","en":"Go straight this way to the corner,","pt":"Ande reto por aqui até o cruzamento,"},{"sp":"B","s":[["ข้าม","kâam","kham"],["ถนน","tà-nǒn","thanon"],["ไป","bpai","pai"],["แล้ว","lɛ́ɛo","laeo"],["เดิน","dəən","doen"],["ไป","bpai","pai"],["ทางขวา","taang-kwǎa","thangkhwa"]],"fsi":"khaam thanǒn paj lɛ́ɛw dəən paj thaaŋkhwǎa","en":"cross the street, then go to the right.","pt":"atravesse a rua e siga à direita."},{"sp":"B","s":[["โฮเต็ล","hoo-dten","hoten"],["จะ","jà","cha"],["อยู่","yùu","yu"],["ทางซ้าย","taang-sáai","thangsai"],["มือ","mʉʉ","mue"]],"fsi":"hooten cà jùu thaaŋsáaj mʉʉ","en":"The hotel is on the left.","pt":"O hotel vai ficar à esquerda."},{"sp":"A","s":[["อยู่","yùu","yu"],["ตรง","dtrong","trong"],["กัน","gan","kan"],["ข้าม","kâam","kham"],["กับ","gàp","kap"],["โรงแรม","roong-rɛɛm","rongraem"],["เอราวัณ","ee-raa-wan","erawan"],["ใช่ไหม","châi-mǎi","chaimai"],["ครับ","kráp","khrap"]],"fsi":"jùu troŋ kan khaam kàp rooŋrɛɛm ʔeeraawan châj máj khráp","en":"It's directly opposite Erawan Hotel, isn't it?","pt":"Fica bem em frente ao Hotel Erawan, não é?"},{"sp":"B","s":[["อยู่","yùu","yu"],["เยื้อง","yʉ́ʉang","yueang"],["กัน","gan","kan"],["หน่อย","nɔ̀ɔi","noi"],["ครับ","kráp","khrap"]],"fsi":"jùu jʉ́aŋ kan nɔ̀ɔj khráp","en":"It's catercornered to it.","pt":"Fica meio na diagonal."}],"notas":[{"t":{"pt":"ไป e มา atrás do verbo: a direção é sempre relativa a quem fala","en":"paj and maa as postpositions: direction is relative to the speaker"},"e":{"pt":"O tailandês cola ไป ou มา depois de outro verbo para dizer para que lado a ação corre: ไป é movimento para longe de quem fala, มา é movimento na direção dele. Por isso เข้ามา é 'entrar para onde estou' e เข้าไป é 'entrar para lá'; o mesmo molde vale para ออกมา/ออกไป, เดินมา/เดินไป e กลับมา/กลับไป. E não é só verbo de andar: โทร(ศัพท์)มา é 'telefonar para cá' e โทร(ศัพท์)ไป é 'telefonar para lá'. Pense no nosso 'vem cá' × 'vai lá', só que soldado no fim do verbo — e a bússola é sempre o falante, nunca o lugar.","en":"Thai attaches ไป or มา after another verb to fix the direction of motion: ไป = away from the speaker, มา = toward the speaker. Hence เข้ามา 'enter (toward me)' versus เข้าไป 'enter (away from me)', and the same mold in ออกมา/ออกไป, เดินมา/เดินไป, กลับมา/กลับไป. It is not limited to verbs of walking: โทร(ศัพท์)มา 'call toward me' versus โทร(ศัพท์)ไป 'call away'. The reference point is always the speaker, not the place."},"ex":[["เข้า","kâo","khao"],["มา","maa","ma"],["เข้า","kâo","khao"],["ไป","bpai","pai"]]},{"t":{"pt":"ข้าง e ทาง: preposição vira palavra de lugar","en":"khâang and thaan: prepositions become place words"},"e":{"pt":"Preposições como ใน ('dentro') e นอก ('fora') se colam a um substantivo genérico de lugar — ข้าง ('lado') ou ทาง ('caminho, direção') — e formam uma palavra nova: ข้างใน ('lá dentro'), ข้างนอก ('lá fora'), ข้างหน้า ('à frente'), ข้างบน ('em cima'), ข้างหลัง ('atrás'), ข้างล่าง ('embaixo'). Com ทาง o molde dá as direções: ทางซ้าย ('à esquerda'), ทางขวา ('à direita'), ทางเหนือ ('para o norte'), ทางใต้ ('para o sul'). Repare que a ordem é a inversa da nossa: diz-se 'lado dentro', nunca 'dentro do lado'. É como se cada preposição virasse um adjetivo de um substantivo de lugar.","en":"Prepositions such as ใน 'in' and นอก 'outside of' combine with a generic place noun — ข้าง 'side' or ทาง 'way, path' — to build single words: ข้างใน 'inside', ข้างนอก 'outside', ข้างหน้า 'in front of', ข้างบน 'up above', ข้างหลัง 'behind', ข้างล่าง 'down below'. With ทาง the same mold yields directions: ทางซ้าย 'to the left', ทางขวา 'to the right', ทางเหนือ 'North', ทางใต้ 'South'. The head noun comes first and the preposition second, the reverse of Portuguese 'dentro de'."},"ex":[["ข้างบน","kâang-bon","khangbon"],["ข้างล่าง","kâang-lâang","khanglang"]]}],"paginas":"vol. 1, p. 276–289"},"18":{"n":18,"titulo":{"pt":"Uma visita marcada","en":"An Appointment"},"dialogo":[{"sp":"A","s":[["มา","maa","ma"],["หา","hǎa","ha"],["ใคร","krai","khrai"],["คะ","ká","kha"]],"fsi":"maa hǎa khraj khá","en":"Who did you come to see?","pt":"O senhor veio ver quem?"},{"sp":"B","s":[["คุณ","kun","khun"],["สวัสดิ์","sà-wàt","sawat"],["อยู่","yùu","yu"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"khun sawàt jùu máj khráp","en":"Is Mr. Sawat in?","pt":"O senhor Sawat está?"},{"sp":"A","s":[["ไม่","mâi","mai"],["อยู่","yùu","yu"],["ค่ะ","kâ","kha"]],"fsi":"mâj jùu khâ","en":"No, he isn't.","pt":"Não está, não."},{"sp":"A","s":[["ออก","ɔ̀ɔk","ok"],["ไป","bpai","pai"],["ข้างนอก","kâang-nɔ̂ɔk","khangnok"]],"fsi":"ʔɔ̀ɔk paj khâaŋnɔ̂ɔk","en":"He went out.","pt":"Ele saiu."},{"sp":"B","s":[["จะ","jà","cha"],["กลับ","glàp","klap"],["เมื่อไร","mʉ̂ʉa-rài","muearai"],["ทราบ","sâap","sap"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"cà klàp mʉ̂araj sâap máj khráp","en":"Do you know when he'll be back?","pt":"A senhora sabe quando ele volta?"},{"sp":"A","s":[["เขา","kǎo","khao"],["บอก","bɔ̀ɔk","bok"],["ว่า","wâa","wa"],["จะ","jà","cha"],["กลับ","glàp","klap"],["ก่อน","gɔ̀ɔn","kon"],["เที่ยง","tîiang","thiang"]],"fsi":"kháw bɔ̀ɔk waa cà klàp kɔ̀ɔn thîaŋ","en":"He said he'd be back before noon.","pt":"Ele avisou que volta antes do meio-dia."},{"sp":"A","s":[["เชิญ","chəən","choen"],["เข้า","kâo","khao"],["มา","maa","ma"],["นั่ง","nâng","nang"],["คอย","kɔɔi","khoi"],["ข้างใน","kâang-nai","khangnai"],["ก่อน","gɔ̀ɔn","kon"],["ซิ","sí","si"],["คะ","ká","kha"]],"fsi":"chəən khâw maa nâŋ khɔɔj khâaŋnaj kɔ̀ɔn sí khá","en":"Please come in (and) sit down and wait.","pt":"Entre, por favor. Sente-se e espere aqui dentro."},{"sp":"B","s":[["ขอบคุณ","kɔ̀ɔp-kun","khopkhun"],["ครับ","kráp","khrap"]],"fsi":"khɔ̀ɔpkhun khráp","en":"Thank you.","pt":"Obrigado."},{"sp":"B","s":[["ขอโทษ","kɔ̌ɔ-tôot","khothot"],["ที่นี่","tîi-nîi","thini"],["มี","mii","mi"],["โทรศัพท์","too-rá-sàp","thorasap"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"khɔ̌ɔthôot thîinîi mii thoorasáp máj khráp","en":"Excuse me, is there a telephone here?","pt":"Com licença, aqui tem telefone?"},{"sp":"A","s":[["มี","mii","mi"],["ค่ะ","kâ","kha"]],"fsi":"mii khâ","en":"Yes, there is.","pt":"Tem, sim."},{"sp":"B","s":[["ผม","pǒm","phom"],["ขอ","kɔ̌ɔ","kho"],["ใช้","cháai","chai"],["โทรศัพท์","too-rá-sàp","thorasap"],["หน่อย","nɔ̀ɔi","noi"],["ได้","dâai","dai"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]],"fsi":"phǒm khɔ̌ɔ cháaj thoorasáp nɔ̀ɔj dâj máj khráp","en":"May I use it?","pt":"Eu posso usar o telefone um pouquinho?"},{"sp":"A","s":[["เชิญ","chəən","choen"],["ค่ะ","kâ","kha"]],"fsi":"chəən khâ","en":"Go ahead.","pt":"Pois não, pode usar."},{"sp":"A","s":[["อยู่","yùu","yu"],["บน","bon","bon"],["โต๊ะ","dtó","to"],["ตัว","dtuua","tua"],["นั้น","nán","nan"]],"fsi":"jùu bon tó tua nán","en":"It's on that desk.","pt":"Está em cima daquela mesa."},{"sp":"A","s":[["เห็น","hěn","hen"],["ไหม","mǎi","mai"],["คะ","ká","kha"]],"fsi":"hěn máj khá","en":"Do you see it?","pt":"Está vendo?"},{"sp":"B","s":[["เห็น","hěn","hen"],["แล้ว","lɛ́ɛo","laeo"],["ครับ","kráp","khrap"],["ขอบคุณ","kɔ̀ɔp-kun","khopkhun"],["มาก","mâak","mak"]],"fsi":"hěn lɛ́ɛw khráp khɔ̀ɔpkhun mâak","en":"I see it. Thanks very much.","pt":"Estou vendo. Muito obrigado."}],"notas":[{"t":{"pt":"มาหา: dois verbos colados para 'vir ver alguém'","en":"maa haa: two verbs glued together for 'come to see someone'"},"e":{"pt":"O tailandês não usa preposição para dizer a quem a visita se dirige: มา ('vir') gruda direto em หา ('procurar, ir atrás') e a pessoa vem depois — มาหาใครคะ ('o senhor veio ver quem?'). É o mesmo molde do มาทำงาน da lição 15 e do ไปรับ da 9: verbo de movimento + verbo que diz o motivo, sem nenhum 'para' no meio. E a bússola continua sendo o falante: quem recebe diz มาหา, quem conta a própria ida diz ไปหา.","en":"Thai needs no preposition for the person visited: มา 'come' is glued straight onto หา 'seek, look for', and the object follows — มาหาใครคะ 'who did you come to see?'. Same mold as มาทำงาน (lesson 15) and ไปรับ (lesson 9): motion verb + purpose verb, with no 'to' in between. The speaker's position still rules: the host says มาหา, the visitor talking about himself says ไปหา."},"ex":[["มา","maa","ma"],["หา","hǎa","ha"],["ใคร","krai","khrai"],["คะ","ká","kha"]]},{"t":{"pt":"ทราบ e รู้: o mesmo 'saber' em dois registros","en":"ทราบ and รู้: one 'know' in two registers"},"e":{"pt":"Os dois querem dizer saber um fato e em muita construção podem trocar de lugar; o que muda é o registro. ทราบ é a forma polida, de escritório e de balcão — por isso o visitante diz ทราบไหมครับ na recepção; entre amigos seria รู้ไหม. E há construções em que só o รู้ entra: รู้หนังสือ ('ser alfabetizado', na letra 'conhecer letra'), รู้ภาษาอังกฤษ ('saber inglês') e ไม่รู้เรื่อง ('não entender o que ele está dizendo'). Trocar ทราบ pelo รู้ nesses três casos não funciona.","en":"Both mean 'to know a fact' and are often interchangeable; what changes is register. ทราบ is the polite, official form, which is why the visitor says ทราบไหมครับ at a reception desk, while among friends it would be รู้ไหม. Some constructions take only รู้: รู้หนังสือ 'to be literate', รู้ภาษาอังกฤษ 'to know English', ไม่รู้เรื่อง 'not to follow what someone is saying'."},"ex":[["คุณ","kun","khun"],["ทราบ","sâap","sap"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]]},{"t":{"pt":"รู้จัก: conhecer gente e lugar, não saber fato","en":"รู้จัก: to be acquainted with people and places"},"e":{"pt":"Se ทราบ e รู้ dão conta de fatos, รู้จัก é o verbo da familiaridade: com gente, com lugar e com coisa. รู้จักคุณ ('conhecer você'), รู้จักสนามหลวง ('conhecer o Sanam Luang, saber onde fica'), รู้จักคำนี้ ('conhecer esta palavra'). É a nossa fronteira entre 'conhecer' e 'saber', e em tailandês ela é dura: รู้จัก não aceita uma frase inteira com ว่า dentro. Se o que você sabe é um fato, volte para รู้ ou ทราบ.","en":"Where ทราบ and รู้ handle facts, รู้จัก handles familiarity — with a person, a place or a thing: รู้จักคุณ 'know you', รู้จักสนามหลวง 'know (where) Sanam Luang is', รู้จักคำนี้ 'be familiar with this word'. It maps the Portuguese conhecer versus saber split, and รู้จัก does not take a ว่า-clause: for a fact, go back to รู้ or ทราบ."},"ex":[["เขา","kǎo","khao"],["รู้จัก","rúu-jàk","ruchak"],["คุณ","kun","khun"]]},{"t":{"pt":"Uma frase dentro da outra: o lugar entra depois do verbo","en":"Sentence embedding: the place follows the verb"},"e":{"pt":"O tailandês encaixa uma frase inteira dentro de outra sem conectivo nenhum. 'Ele está sentado' (เขานั่ง) somado a 'ele está lá na frente' (เขาอยู่ข้างหน้า) dá uma frase só: เขานั่งอยู่ข้างหน้า. O verbo de postura vem primeiro, e o อยู่ + lugar entra atrás dizendo onde a ação acontece — o mesmo vale para ยืน ('em pé'), นอน ('deitado') e para os outros verbos de movimento, como เข้าไป e มา. Pense em dois cartões sobrepostos: o de cima é a postura, o de baixo é o endereço.","en":"Thai embeds a whole sentence inside another with no connector. 'He sits' (เขานั่ง) plus 'he is in front' (เขาอยู่ข้างหน้า) merge into เขานั่งอยู่ข้างหน้า: the posture verb comes first and อยู่ + place is embedded after it to locate the action. The same holds for ยืน, นอน and other motion verbs such as เข้าไป and มา."},"ex":[["เขา","kǎo","khao"],["นั่ง","nâng","nang"],["อยู่","yùu","yu"],["ข้างหน้า","kâang-nâa","khangna"]]},{"t":{"pt":"ว่า: o conectivo obrigatório da frase-objeto","en":"ว่า: the obligatory connector of an object clause"},"e":{"pt":"Verbos como ทราบ ('saber'), พูด ('falar'), คิด ('achar') e บอก ('avisar') não pedem um substantivo, pedem uma frase inteira — e o ว่า é o conectivo obrigatório quando o verbo vem antes: เขาบอกว่ากลับก่อนเที่ยง ('ele avisou que volta antes do meio-dia'), ผมทราบว่าเขาอยู่ที่ไหน ('sei onde ele mora'). Sem o ว่า a frase fica com duas metades soltas. Quando a pergunta vem antes do verbo, o ว่า pode cair: เขาอยู่ที่ไหน คุณทราบไหมครับ.","en":"Verbs such as ทราบ 'know', พูด 'speak', คิด 'think' and บอก 'tell' take a whole sentence as object, and ว่า is the obligatory connector when the verb precedes it: เขาบอกว่ากลับก่อนเที่ยง 'he said he would be back before noon', ผมทราบว่าเขาอยู่ที่ไหน 'I know where he lives'. When the clause comes before the verb, ว่า may be dropped."},"ex":[["เขา","kǎo","khao"],["บอก","bɔ̀ɔk","bok"],["ว่า","wâa","wa"],["จะ","jà","cha"],["กลับ","glàp","klap"],["ก่อน","gɔ̀ɔn","kon"],["เที่ยง","tîiang","thiang"]]},{"t":{"pt":"ขอ: o pedido educado em três ordens","en":"ขอ: the polite request in three word orders"},"e":{"pt":"O ขอ ('pedir') transforma uma frase afirmativa em pedido, e o livro mostra as três ordens: ผมขอใช้โทรศัพท์, ขอผมใช้โทรศัพท์ e só ขอใช้โทรศัพท์ — as três valem 'posso usar o telefone?', sem diferença de sentido, e a terceira é a mais comum. O pronome só pode sumir quando é ผม ou ดิฉัน. O pedido costuma vir com หน่อยได้ไหมครับ no fim, e a resposta que concede é ได้ครับ ('pode'). É um 'por gentileza' que se encosta antes do verbo, não depois.","en":"ขอ 'to request' turns a statement into a request, and the book gives all three orders: ผมขอใช้โทรศัพท์, ขอผมใช้โทรศัพท์ and just ขอใช้โทรศัพท์, all meaning 'may I use the telephone', with no difference in meaning — the third is probably the most common. The subject pronoun may be dropped only when it is ผม or ดิฉัน. The form often takes หน่อยได้ไหมครับ at the end, and the granting answer is ได้ครับ 'go ahead'."},"ex":[["ขอ","kɔ̌ɔ","kho"],["ใช้","cháai","chai"],["โทรศัพท์","too-rá-sàp","thorasap"],["หน่อย","nɔ̀ɔi","noi"],["ได้","dâai","dai"],["ไหม","mǎi","mai"],["ครับ","kráp","khrap"]]}],"paginas":"vol. 1, p. 290–309"},"19":{"n":19,"titulo":{"pt":"Onde fica o banheiro","en":"Directions to the bathroom"},"dialogo":[{"sp":"A","s":[["ขอโทษ","kɔ̌ɔ-tôot","khothot"],["ห้องน้ำ","hɔ̂ng-náam","hongnam"],["สำหรับ","sǎm-ràp","samrap"],["ผู้ชาย","pûu-chaai","phuchai"],["อยู่","yùu","yu"],["ที่ไหน","tîi-nǎi","thinai"],["ครับ","kráp","khrap"]],"fsi":"khɔ̌ɔthôot hɔ̂ŋnáam sǎmràp phûuchaaj jùu thîinǎj khráp","en":"Excuse me, where's the men's bathroom?","pt":"Com licença, onde fica o banheiro masculino?"},{"sp":"B","s":[["ห้องน้ำ","hɔ̂ng-náam","hongnam"],["ผู้ชาย","pûu-chaai","phuchai"],["หรือ","rʉ̌ʉ","rue"],["ครับ","kráp","khrap"]],"fsi":"hɔ̂ŋnáam phûuchaaj rʉ̌ʉ khráp","en":"The men's bathroom?","pt":"O banheiro masculino?"},{"sp":"B","s":[["อยู่","yùu","yu"],["ข้างล่าง","kâang-lâang","khanglang"]],"fsi":"jùu khâaŋlâaŋ","en":"It's downstairs.","pt":"Fica lá embaixo."},{"sp":"A","s":[["ไป","bpai","pai"],["ทาง","taang","thang"],["ไหน","nǎi","nai"],["ครับ","kráp","khrap"]],"fsi":"paj thaaŋ nǎj khráp","en":"Which way?","pt":"Por onde eu vou?"},{"sp":"B","s":[["ไป","bpai","pai"],["ทาง","taang","thang"],["นี้","níi","ni"]],"fsi":"paj thaaŋ níi","en":"Go this way.","pt":"Vá por aqui."},{"sp":"B","s":[["ลง","long","long"],["กระได","grà-dai","kradai"],["ไป","bpai","pai"],["แล้ว","lɛ́ɛo","laeo"],["เลี้ยว","líiao","liao"],["ขวา","kwǎa","khwa"]],"fsi":"loŋ kradaj paj lɛ́ɛw líaw khwǎa","en":"Go down the stairs, then turn right.","pt":"Desça a escada e depois vire à direita."},{"sp":"B","s":[["ห้องน้ำ","hɔ̂ng-náam","hongnam"],["จะ","jà","cha"],["อยู่","yùu","yu"],["ทาง","taang","thang"],["ขวามือ","kwǎa-mʉʉ","khwamue"]],"fsi":"hɔ̂ŋnáam cà jùu thaaŋ khwǎamʉʉ","en":"The bathroom will be on your right.","pt":"O banheiro vai estar do lado direito."},{"sp":"A","s":[["ขอบคุณ","kɔ̀ɔp-kun","khopkhun"],["ครับ","kráp","khrap"]],"fsi":"khɔ̀ɔpkhun khráp","en":"Thank you.","pt":"Obrigado."},{"sp":"B","s":[["ไม่เป็นไร","mâi-bpen-rai","maipenrai"],["ครับ","kráp","khrap"]],"fsi":"mâjpenraj khráp","en":"You're welcome.","pt":"De nada."}],"notas":[{"t":{"pt":"ขึ้น e ลง com ไป e มา","en":"ขึ้น and ลง with ไป and มา"},"e":{"pt":"ขึ้น (subir) e ลง (descer) ganham ไป ou มา no fim para mostrar o sentido em relação a quem fala: ขึ้นไป é subir para longe de mim, ขึ้นมา é subir até onde estou. O meio vem no meio: ลงลิฟต์ไป = descer de elevador. Analogia: ไป e มา são as setas de um mapa com o ponto 'você está aqui'.","en":"ขึ้น (up) and ลง (down) take ไป or มา to show direction relative to the speaker; the means goes in the middle: ลงลิฟต์ไป, go down by elevator."},"ex":[["ขึ้น","kʉ̂n","khuen"],["ลิฟต์","líf","lif"],["ไป","bpai","pai"]]},{"t":{"pt":"สำหรับ: 'para' que pode cair","en":"สำหรับ: 'for', often dropped"},"e":{"pt":"สำหรับ significa 'para, destinado a'. Na fala ele costuma sumir: ห้องน้ำสำหรับผู้ชาย vira ห้องน้ำผู้ชาย, como 'banheiro masculino' no lugar de 'banheiro para homens'.","en":"สำหรับ means 'for, intended for' and is often dropped in speech: ห้องน้ำผู้ชาย."},"ex":[["ห้องน้ำ","hɔ̂ng-náam","hongnam"],["สำหรับ","sǎm-ràp","samrap"],["ผู้หญิง","pûu-yǐng","phuying"]]},{"t":{"pt":"ทาง: por onde","en":"ทาง: which way"},"e":{"pt":"ทาง (caminho) monta direções: ไปทางไหน (por onde?), ทางนี้ (por aqui), ทางขวามือ (do lado direito). É a mesma ideia do nosso 'pelo lado de…'.","en":"ทาง builds directions: ไปทางไหน, ทางนี้, ทางขวามือ."},"ex":[["อยู่","yùu","yu"],["ทาง","taang","thang"],["ซ้ายมือ","sáai-mʉʉ","saimue"]]}],"paginas":"vol. 1, p. 310–318"},"20":{"n":20,"titulo":{"pt":"Retrato de uma vila: Bangchak","en":"Tambon Bangchak"},"dialogo":[{"sp":"N","s":[["นี่","nîi","ni"],["คือ","kʉʉ","khue"],["ตำบล","dtam-bon","tambon"],["บ้านจาก","bâan-jàak","banchak"]],"fsi":"nîi khʉʉ tambon bâancàak","en":"This is Bangchak tambon.","pt":"Esta é a vila de Bangchak."},{"sp":"N","s":[["ตำบล","dtam-bon","tambon"],["นี้","níi","ni"],["อยู่","yùu","yu"],["ใน","nai","nai"],["จังหวัด","jang-wàt","changwat"],["แห่ง","hɛ̀ng","haeng"],["หนึ่ง","nʉ̀ng","nueng"],["ใน","nai","nai"],["ภาค","pâak","phak"],["กลาง","glaang","klang"]],"fsi":"tambon níi jùu naj caŋwàt hɛ̀ŋ nʉ̀ŋ naj phâak klaaŋ","en":"This tambon is in a province in the central region.","pt":"Esta vila fica numa província da região central."},{"sp":"N","s":[["ตำบล","dtam-bon","tambon"],["นี้","níi","ni"],["ตั้ง","dtâng","tang"],["อยู่","yùu","yu"],["ริม","rim","rim"],["คลอง","klɔɔng","khlong"]],"fsi":"tambon níi tâŋ jùu rim khlɔɔŋ","en":"This tambon is located on a canal.","pt":"A vila fica à beira de um canal."},{"sp":"N","s":[["วัด","wát","wat"],["เป็น","bpen","pen"],["ศูนย์กลาง","sǔun-glaang","sunklang"],["ของ","kɔ̌ɔng","khong"],["ตำบล","dtam-bon","tambon"],["นี้","níi","ni"]],"fsi":"wát pen sǔunklaaŋ khɔ̌ɔŋ tambon níi","en":"The temple is the center of this tambon.","pt":"O templo é o centro da vila."},{"sp":"N","s":[["ข้างๆ","kâang-kâang","khangkhang"],["วัด","wát","wat"],["มี","mii","mi"],["โรงเรียน","roong-riian","rongrian"]],"fsi":"khâaŋkhâaŋ wát mii rooŋrian","en":"Beside the temple is the school.","pt":"Ao lado do templo há uma escola."},{"sp":"N","s":[["โรงเรียน","roong-riian","rongrian"],["นี้","níi","ni"],["เป็น","bpen","pen"],["โรงเรียน","roong-r ras dobradas: ข้างๆ (ali do lado), เล็กๆ (pequenininha), ต่างๆ (diversas), ราวๆ (mais ou menos). Dobrar a palavra deixa o sentido mais vago ou mais afetuoso, como os nossos diminutivos.","en":"Doubled words make meaning vaguer or more affectionate: ข้างๆ, เล็กๆ, ต่างๆ, ราวๆ."},"ex":[["ร้าน","ráan","ran"],["ต่างๆ","dtàang-dtàang","tangtang"]]}],"paginas":"vol. 1, p. 319–324"},"21":{"n":21,"titulo":{"pt":"Combinando um passeio ao mercado flutuante","en":"Planning a trip to the Floating Market"},"dialogo":[{"sp":"A","s":[["วันที่","wan-tîi","wanthi"],["เจ็ด","jèt","chet"],["เมษา","mee-sǎa","mesa"],["นี้","níi","ni"],["เป็น","bpen","pen"],["วันหยุด","wan-yùt","wanyut"]],"fsi":"wanthîi cèt meesǎa níi pen wanjùt","en":"April 7th is a holiday.","pt":"Dia sete de abril é feriado."},{"sp":"A","s":[["คุณ","kun","khun"],["ว่าง","wâang","wang"],["ไหม","mǎi","mai"]],"fsi":"khun wâaŋ máj","en":"Are you free?","pt":"Você está livre?"},{"sp":"B","s":[["วันที่","wan-tîi","wanthi"],["เจ็ด","jèt","chet"],["ตรง","dtrong","trong"],["กับ","gàp","kap"],["วัน","wan","wan"],["อะไร","à-rai","arai"],["ครับ","kráp","khrap"]],"fsi":"wanthîi cèt troŋ kàp wan ʔaraj khráp","en":"What day of the week is the 7th?","pt":"O dia sete cai em que dia da semana?"},{"sp":"A","s":[["วันจันทร์","wan-jan","wanchan"]],"fsi":"wancan","en":"Monday.","pt":"Segunda-feira."},{"sp":"B","s":[["ยังงั้น","yang-ngán","yangngan"],["ผม","pǒm","phom"],["ว่าง","wâang","wang"],["ครับ","kráp","khrap"]],"fsi":"jaŋŋán phǒm wâaŋ khráp","en":"Then I'm free.","pt":"Então estou livre."},{"sp":"B","s":[["คุณ","kun","khun"],["มี","mii","mi"],["ธุระ","tú-rá","thura"],["อะไร","à-rai","arai"],["หรือ","rʉ̌ʉ","rue"],["ครับ","kráp","khrap"]],"fsi":"khun mii thúrá ʔaraj rʉ̌ʉ khráp","en":"You have something in mind?","pt":"Você está planejando alguma coisa?"},{"sp":"A","s":[["อยาก","yàak","yak"],["จะ","jà","cha"],["ชวน","chuuan","chuan"],["ไป","bpai","pai"],["เที่ยว","tîiao","thiao"],["ตลาดน้ำ","dtà-làat-náam","talatnam"]],"fsi":"jàak cà chu aa","pha"],["เรา","rao","rao"],["ไป","bpai","pai"],["ดู","duu","du"],["ตลาดน้ำ","dtà-làat-náam","talatnam"]],"fsi":"kháw cà phaa raw paj duu talàatnáam","en":"He will take us to see the Floating Market.","pt":"Ele vai levar a gente para ver o mercado flutuante."},{"sp":"B","s":[["เรา","rao","rao"],["จะ","jà","cha"],["พบ","póp","phop"],["กัน","gan","kan"],["ที่ไหน","tîi-nǎi","thinai"]],"fsi":"raw cà phóp kan thîinǎj","en":"Where will we meet?","pt":"Onde a gente se encontra?"},{"sp":"A","s":[["ผม","pǒm","phom"],["จะ","jà","cha"],["ไป","bpai","pai"],["รับ","ráp","rap"],["คุณ","kun","khun"],["ที่","tîi","thi"],["บ้าน","bâan","ban"],["เวลา","wee-laa","wela"],["สองโมงเช้า","sɔ̌ɔng-moong-cháao","songmongchao"]],"fsi":"phǒm cà paj ráp khun thîi bâan weelaa sɔ̌ɔŋmooŋcháaw","en":"I'll pick you up at home at 8 a.m.","pt":"Passo para te buscar em casa às oito da manhã."},{"sp":"B","s":[["ผม","pǒm","phom"],["ควร","kuuan","khuan"],["จะ","jà","cha"],["เอา","ao","ao"],["อะไร","à-rai","arai"],["ไป","bpai","pai"],["บ้าง","bâang","bang"]],"fsi":"phǒm khuan cà ʔaw ʔaraj paj bâaŋ","en":"What should I take with me?","pt":"O que eu devo levar?"},{"sp":"A","s":[["เอา","ao","ao"],["เงิน","ngən","ngoen"],["ไป","bpai","pai"],["ซื้อ","sʉ́ʉ","sue"],["ของ","kɔ̌ɔng","khong"],["กับ","gàp","kap"],["กล้องถ่ายรูป","glɔ̂ng-tàai-rûup","klongthairup"]],"fsi":"ʔaw ŋən paj sʉ́ʉ khɔ̌ɔŋ kàp klɔ̂ŋthàajrûup","en":"Take some money for shopping and your camera.","pt":"Leve dinheiro para as compras e a câmera."},{"sp":"A","s":[["ก็","gɔ̂ɔ","ko"],["พอ","pɔɔ","pho"],["แล้ว","lɛ́ɛo","laeo"],["ครับ","kráp","khrap"]],"fsi":"kɔ̂ɔ phɔɔ lɛ́ɛw khráp","en":"That'll be enough.","pt":"Já está bom."}],"notas":[{"t":{"pt":"ว่าง: livre, sem compromisso","en":"ว่าง: free"},"e":{"pt":"Falando de pessoas, ว่าง quer dizer 'desocupado, com tempo': คุณว่างไหม = você está livre? Falando de coisas, é 'vago': ห้องว่าง = quarto vago.","en":"Of people, ว่าง means free, not busy; of things, vacant."},"ex":[["คุณ","kun","khun"],["ว่าง","wâang","wang"],["ไหม","mǎi","mai"]]},{"t":{"pt":"ตรงกับ: cair em","en":"ตรงกับ: to fall on"},"e":{"pt":"ตรงกับ liga uma data a outra referência: วันที่เจ็ดตรงกับวันอะไร = o dia sete cai em que dia da semana? Também converte calendários, como o ano cristão no budista. Analogia: é colocar duas réguas lado a lado.","en":"ตรงกับ matches a date to a weekday or to another calendar."},"ex":[["วันที่","wan-tîi","wanthi"],["เจ็ด","jèt","chet"],["ตรงกับ","dtrong-gàp","trongkap"],["วันจันทร์","wan-jan","wanchan"]]},{"t":{"pt":"เชิญ × ชวน: dois convites","en":"เชิญ vs ชวน"},"e":{"pt":"เชิญ é o convite formal de quem é anfitrião e banca a ocasião; ชวน é o 'bora?' de quem chama alguém para acompanhá-lo. Analogia: convite impresso de casamento × mensagem no grupo dos amigos.","en":"เชิญ is a formal host's invitation; ชวน is an informal 'come along'."},"ex":[["ผม","pǒm","phom"],["ชวน","chuuan","chuan"],["เพื่อน","pʉ̂ʉan","phuean"],["ไป","bpai","pai"],["ทะเล","tá-lee","thale"]]},{"t":{"pt":"Como responder 'vai como?'","en":"Answering 'how are you going?'"},"e":{"pt":"Há quatro moldes: (1) ไป + veículo (ไปรถไฟ); (2) verbo de embarque + veículo + ไป/มา + destino (นั่งรถไป, ลงเรือไป, ขึ้นเครื่องบินไป, ขับรถมา, ถีบจักรยานไป); (3) บิน ou เดิน + ไป/มา + destino; (4) ไป/มา + destino + โดย + veículo, que soa formal ou escrito.","en":"Four patterns: ไปรถไฟ; นั่งรถไป...; บินไป/เดินไป...; ไป... โดยรถเมล์ (formal)."},"ex":[["เขา","kǎo","khao"],["ไป","bpai","pai"],["เชียงใหม่","chiiang-mài","chiangmai"],["โดย","dooi","doi"],["รถไฟ","rót-fai","rotfai"]]},{"t":{"pt":"พา × เอา: levar gente ou coisa","en":"พา vs เอา"},"e":{"pt":"พา leva pessoas (เขาพาเราไปดูตลาดน้ำ); เอา leva objetos (เอาเงินไปซื้อของ). Os dois pedem ไป (para longe de quem fala) ou มา (para perto). Analogia: พา é guiar alguém pela mão; เอา é carregar na mochila.","en":"พา takes people, เอา takes things; both with ไป or มา."},"ex":[["เอา","ao","ao"],["กล้องถ่ายรูป","glɔ̂ng-tàai-rûup","klongthairup"],["มา","maa","ma"]]},{"t":{"pt":"มาน
